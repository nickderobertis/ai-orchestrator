# Orchestrator side of the onejudge conversation: WHICH harness + model drives a
# tracked graph. Named by `graphs/dag-scope.yaml`'s `monitor` member as its agent
# side, which is what keeps discovery from the repo root from handing this role the
# worker's `oneharness.toml`. See docs/onejudge-integration.md.
#
# This file drives ONE member's agent side. The `check-in` pacemaker used to share
# it and now reads `oneharness.check-in.toml` — the same routing with a finite
# deadline — because of the `timeout` below. Do not point another member here.
#
# It extends `oneharness.identities.toml` rather than `oneharness.dispatch.toml`: the
# monitor is started beside a run rather than inside a node's dispatch, so there is no
# node scratch directory for the runtime-directory repoint to point at.
extends = "oneharness.identities.toml"

# timeout: the per-turn deadline in seconds. Since oneharness 0.7.0 both `0` and an
# absent key mean none; `0` stays spelled out here because this side's lack of a
# deadline is a decision, not an inherited default — one of its turns is a single
# `just run-plan` tool call that runs a whole round. That, what it cost to inherit
# the old 120 instead, and why a `0` here is safe under `mode: bypass` are
# in docs/onejudge-integration.md#choosing-a-deadline-per-side.
timeout = 0

# `role` names the SIDE of the conversation, not the persona: the orchestrator is
# an agent-side session whose `agent_role=orchestrator` label is stamped by
# `launch_orchestrator` (see docs/dag-ui/design.md). Keeping `role = "agent"` here
# is what lets telemetry and `just history` treat it as one.
# `role` is this host's key and the engine stamps nothing like it: the six
# `onepipeline.*` keys a dispatch inherits name the run, project, scope, node, step and
# attempt, none of which says which side of a conversation a session is.
history_labels = { role = "agent" }

# The orchestrator is a long-lived supervisory process, not a worker, so both
# Codex identities carry the role first — deliberately the reverse of
# oneharness.toml's worker order. Only once Codex is exhausted does it reach the
# workers' alternate Claude subscriptions, in the same relative order the worker
# uses, with the primary Claude identity last. Reaching them at all is a
# deliberate trade the operator accepts: contending for the workers' Claude quota
# beats stalling a supervisory process that every workstream waits on.
# llmlint: ignore[changed_behavior_has_e2e] tests/e2e/test_dispatch_e2e.py drives real oneharness fallback selection for this file; paid-provider quota rejection cannot be deterministic.
harnesses = [
    "codex:primary",
    "codex:alternate",
    "claude-code:alternate",
    "claude-code:alternate2",
    "claude-code:primary-backup",
    "claude-code:primary",
]

# The board credential is the plan store's and this role never reaches the store, so it
# stops here rather than travelling to the provider. Stated per role rather than in the
# shared parent because it is a per-role policy and a parent's mask is one no child can
# remove — `oneharness.identities.toml` says so at this same variant. The board
# *nomination* is left travelling on purpose: a live lane handed the owner, number and
# repository but no token skips and says why, where one handed nothing cannot tell a
# misconfigured lane from a deliberate one.
[harness.codex.variant.primary]
unset_env = ["GH_PROJECTS_TOKEN"]
