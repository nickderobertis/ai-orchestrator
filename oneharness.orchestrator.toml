# Orchestrator side of the onejudge conversation: WHICH harness + model drives a
# tracked graph. Named by `graphs/dag-scope.yaml`'s `orchestrator` member as its
# agent side, and forced by `scripts/oneharness-orchestrator.sh` on the manual and
# smoke path; discovery from the repo root would otherwise hand this role the
# worker's `oneharness.toml`. See docs/onejudge-integration.md.
#
# This file drives ONE member's agent side. The `check-in` pacemaker used to share
# it and now reads `oneharness.check-in.toml` — the same routing with a finite
# deadline — because of the `timeout` below. Do not point another member here.

# run_mode: how the selected harnesses are run. "fallback" tries them in priority
# order and stops at the first that can actually run, falling through only
# harnesses that cannot run at all — see the note in oneharness.toml.
run_mode = "fallback"

# timeout: the per-turn deadline in seconds; `0` means none, and an absent key
# means 120. This side is the only role here with none, because one of its turns
# is a single `just run-plan` tool call that runs a whole round. That, what it
# cost to inherit 120 instead, and why a `0` here is safe under `mode: bypass` are
# in docs/onejudge-integration.md#choosing-a-deadline-per-side.
timeout = 0

# Record this side's runs to disk too; onejudge's pinned `--config` skips the
# user-level config.toml, so history must be enabled here.
# llmlint: ignore[changed_behavior_has_e2e] oneharness writes a history record only for a real harness session; a run driven by the suite's codex stand-in leaves the store empty (verified), so this pair cannot be asserted at the launch boundary the rest of this file's e2e uses.
history = true

# `role` names the SIDE of the conversation, not the persona: the orchestrator is
# an agent-side session whose `agent_role=orchestrator` label is stamped by
# `launch_orchestrator` (see docs/dag-ui/design.md). Keeping `role = "agent"` here
# is what lets telemetry and `just history` treat it as one.
history_labels = { role = "agent" }

# The orchestrator is a long-lived supervisory process, not a worker, so both
# Codex identities carry the role first — deliberately the reverse of
# oneharness.toml's worker order. Only once Codex is exhausted does it reach the
# workers' alternate Claude subscriptions, in the same relative order the worker
# uses, with the primary Claude identity last. Reaching them at all is a
# deliberate trade the operator accepts: contending for the workers' Claude quota
# beats stalling a supervisory process that every workstream waits on.
# llmlint: ignore[changed_behavior_has_e2e] tests/e2e/test_dispatch_e2e.py drives real oneharness fallback selection for this file; paid-provider quota rejection cannot be deterministic.
harnesses = [
    "codex",
    "codex:alternate",
    "claude-code:alternate",
    "claude-code:alternate2",
    "claude-code:primary",
]

# [harness.<id>]: per-harness overrides. Model names differ per provider, so
# each harness names its own.
# Sol is the flagship tier of the GPT-5.6 family; name it explicitly so the tier
# cannot drift under us.
[harness.codex]
model = "gpt-5.6-sol"

# The second Codex identity; held identical to oneharness.toml's by
# tests/test_harness_routing.py, since one drifted copy would silently change how
# a role authenticates. See scripts/codex-alt-home.sh for the indirection.
[harness.codex.variant.alternate]
model = "gpt-5.6-sol"
env_from = { CODEX_HOME = "ORCHESTRATOR_CODEX_ALT_HOME" }
unset_env = ["OPENAI_API_KEY"]

[harness.claude-code]
# IS_SANDBOX lets claude-code run under root without --dangerously-skip-permissions
# refusing; harmless on other harnesses.
env = { IS_SANDBOX = "1" }

# The Claude fallbacks are the same three identities the worker uses, with the
# same portable indirections and credential masking;
# tests/test_harness_routing.py holds each variant identical to oneharness.toml's.
[harness.claude-code.variant.alternate]
model = "claude-opus-5"
env_from = { CLAUDE_CONFIG_DIR = "ORCHESTRATOR_CLAUDE_ALT_CONFIG_DIR" }
# Subscription auth must not be shadowed by ambient API or OAuth credentials.
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

[harness.claude-code.variant.alternate2]
model = "claude-opus-5"
env_from = { CLAUDE_CONFIG_DIR = "ORCHESTRATOR_CLAUDE_ALT2_CONFIG_DIR" }
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

# The last resort: Claude's default config directory, with every higher-precedence
# credential selector and any inherited alternate directory masked off.
[harness.claude-code.variant.primary]
model = "claude-opus-5"
unset_env = [
    "CLAUDE_CONFIG_DIR",
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

# Inspect the effective, fully layered config (and where each value came from)
# with `oneharness config`.
