# The dag-scope agent graph `onepipeline start` launches for every run.
#
# `onepipeline` reads this path — `graphs/dag-scope.yaml`, relative to the
# directory the run is launched from — and hands it to `oneagentgraph run`.
# Nothing scaffolds it: the published crate ships the *default path*, not the
# file, because the file names the operator's own onejudge and oneharness
# configs. This repository is that operator, and this is its file.
# `ONEPIPELINE_DAG_GRAPH` names a different one, which is how the e2e suite proves
# the refusal a checkout without this file gets. That suite's real launch uses
# this file, with a stand-in for the paid model behind it.
#
# Every ref below is relative to THIS file's directory, not the working
# directory: `oneagentgraph` resolves a relative ref against the directory the
# document it appears in was read from.
#
# Schema 3, because the `check-in` member below carries its own `task`; that field
# is what the version buys, and `oneagentgraph validate` refuses it under 1 or 2.
version: 3
name: dag-scope
members:
  # The orchestrator that drives the run: it calls `just run-plan` /
  # `just next-round` (i.e. `onepipeline round run|next`) one round at a time
  # under the run's ownership lock.
  orchestrator:
    kind: onejudge
    base_config: ../config/onejudge.base.yaml
    persona: ../personas/orchestrator.yaml
    agent:
      oneharness_config: ../oneharness.orchestrator.toml
    # A simulated-user judge, not the planner channel — deliberately, and not
    # what the published crate's own example graph shows.
    #
    # `judge: {command: ["onepipeline", "channel", "serve", RUN]}` is what that
    # example names, and it still cannot run against onejudge 0.3.10: a onejudge
    # command provider is handed `{"op": ..., "messages": [...]}` on stdin, and
    # `channel serve` parses its stdin as its own boundary frame
    # (`{kind, message, blocking?, node?}`, unknown fields refused). The
    # orchestrator dies on its first supervisor turn with `the orchestrator
    # emitted a bad frame: unknown field 'op'`. Re-measured at this adoption by
    # piping a supervisor frame into `onepipeline channel serve`, which refused it
    # in exactly those words. Reported upstream; when it is fixed this member's
    # judge becomes the channel again and the planner supervises the conversation
    # directly.
    #
    # Until then the planner still steers the run over the channel — surfaces
    # with `just channel-next`, live graph edits and `complete` with
    # `just channel-reply` — because those are queued and reconciled
    # independently of the judge side.
    judge:
      oneharness_config: ../oneharness.judge.toml
    mode: bypass
  # The durable planner-update pacemaker: a single-sided member that comes due on a
  # schedule, reports the run's progress from durable evidence, and exits. It is what
  # keeps a supervising planner informed without being asked. Resettable, so every
  # planner-visible surface restarts its clock and a run that is already reporting
  # does not also get a pacemaker surface.
  #
  # It claims its own `task`, and that is a rule rather than a nicety. `onepipeline`
  # composes ONE task for this graph and `oneagentgraph` hands it to every member
  # that does not claim one; a member's own `task` REPLACES that composed task as its
  # whole prompt. So this member is told what it is for here, rather than inheriting
  # whatever the run-level task happens to say — and it must therefore name the run
  # itself, which it does through `$ONEPIPELINE_RUN_ID` in the environment. It cannot
  # name it by interpolating the composed task back in, because AT THIS DOCUMENT'S
  # VERSION there is no placeholder to do it with: `oneagentgraph` expands `{task}`
  # only from schema 4, so under the `version: 3` above the token is passed through
  # literally and writing one would send a model the six characters. Measured at
  # this adoption, not read: the same member run at 3, 4, and 5 was handed
  # `prefix {task} suffix` at 3 and `prefix <composed task> suffix` at 4 and 5.
  # Raising the version to get the placeholder is a real option, not a closed door
  # — oneagentgraph 0.2.13 reads schema versions 1 through 5 — but it is a separate
  # change, and this member does not need it: `$ONEPIPELINE_RUN_ID` already names
  # the run, and a member that inherited the run-level task would be back to being
  # told the orchestrator's job.
  #
  # The rounds belong to the `orchestrator` member alone, and the prohibition in that
  # task is load-bearing. This member is single-sided, so it begins its turn before
  # the two-party orchestrator begins one; a round it claimed would run *inside* this
  # turn, and the finite deadline in ../oneharness.check-in.toml would kill the
  # dispatched worker along with it. Scoping the task away from the round verbs is
  # what makes that impossible; raising the deadline only moves when it happens.
  #
  # Never point this member at ../oneharness.orchestrator.toml: it reads its own
  # config so that it keeps a finite deadline, and re-sharing one file is what
  # would silently take that away. See
  # docs/onejudge-integration.md#choosing-a-deadline-per-side.
  check-in:
    kind: oneharness
    oneharness_config: ../oneharness.check-in.toml
    persona: ../personas/check-in.yaml
    task: |
      Report current progress on the onepipeline run named by the
      $ONEPIPELINE_RUN_ID environment variable, for the planner supervising it.
      Read it with the read-only views, send one
      `onepipeline surface "$ONEPIPELINE_RUN_ID" --kind check-in --message <text>`,
      and exit. Never run `onepipeline round run` or `onepipeline round next`: the
      orchestrator member owns the run's rounds, and a round started from this turn
      dies with it.
    schedule: {every: 1800, resettable: true}
