# llmlint: ignore-file[changed_behavior_has_e2e] The `progress-report` note's `text` is prose given to a paid model, and whether a model then writes a useful report cannot be driven by a deterministic double. What is provable is driven: tests/e2e/launch_monitor_observer/test_orchestrate_launch_e2e.py launches runs whose doubled monitor answers the note, and holds when it is offered, when it is reset and the one `check-in` surface it raises; tests/e2e/launch_monitor_observer/test_observer_graph_liveness_e2e.py reads the shipped cadence back off a real launch.
# The dag-scope agent graph `just orchestrate` attaches to every run it launches.
#
# `onepipeline start --dag-graph <REF>` names it and hands it to `oneagentgraph
# run`. The shipped default is `off`: since onepipeline 0.4.0 no agent is required
# to run a plan at all, because the engine drives its own DAG continuously to
# settlement. A graph named here **observes** that run and authors channel
# surfaces; it never drives the engine. `just orchestrate` opts in by naming this
# file, which is why an operator on this host always gets the watcher and a bare
# `onepipeline start` elsewhere does not.
#
# Nothing scaffolds this file: the published crate ships the *flag*, not the
# document, because the document names the operator's own onejudge and oneharness
# configs. This repository is that operator, and this is its file.
#
# Every ref below is relative to THIS file's directory, not the working
# directory: `oneagentgraph` resolves a relative ref against the directory the
# document it appears in was read from.
#
# Schema 11, the first version that admits every field the member below carries: the
# `monitor` member's `background` requires 8, a `schedule` on a two-party member 9, and
# its `scheduled_notes` — with the `reset_on` that restarts the note's clock — 11. 11 is
# declared because the progress report moved from a separate scheduled member, a fresh
# paid turn every half hour that read only the run's status and draft list, into the
# monitor's own conversation, timed by a note: the monitor already reads the detailed
# stream with its history intact, and a note costs one message rather than a turn of a
# second member that starts with none of that context. None of it is remembered:
# tests/e2e/launch_monitor_observer/test_observer_graph_liveness_e2e.py reads the paced
# fields and the note back off a real launch, and the range is re-read off the pinned
# binary at each adoption, which refuses 0 and 12 by naming it. oneagentgraph 0.12.0
# reads 1 through 11.
version: 11
name: dag-scope
members:
  # The run's active monitor. It drives nothing — there are no engine verbs left to
  # drive — and its whole value is judgment: it reads the detailed activity stream,
  # compares what the run is actually doing against the goal, each node's task
  # prose, and the graph, and says something about the difference. Its two ways of
  # saying it are a non-blocking planner surface and an attributed live edit inside
  # the engine's monitor allowlist. `../personas/orchestrator.yaml` states that bar
  # on both sides; the file keeps its name because it is this repository's
  # supervisory-role persona and the catalog in ../personas/README.md indexes it
  # under that name.
  monitor:
    kind: onejudge
    base_config: ../config/onejudge.base.yaml
    persona: ../personas/orchestrator.yaml
    agent:
      oneharness_config: ../oneharness.orchestrator.toml
    # The planner channel IS this member's judge side, so the planner's replies
    # reach the monitor in its own conversation rather than only as graph edits.
    #
    # `onemessagebus serve surfaces --codec monitor` is that side: the bus's generic
    # binding interpreter, reading the `monitor` binding this host declares in
    # config/onemessagebus.yaml. The grammar is the bus's, in onemessagebus's
    # docs/codecs.md; what each frame is answered — the texts, the two surface kinds,
    # what a lost turn is called — is this host's policy, written there as data.
    #
    # The channel directory is the run's own, and an argv cannot name a run it is not
    # told: the engine exports `ONEPIPELINE_RUNS_DIR` and `ONEPIPELINE_RUN_ID` to both
    # sides of an observer member —
    # measured against onepipeline 0.107.0 on both of that member's sides, by dumping
    # each one's whole environment on the suite's real launches with their paid model
    # doubled (tests/e2e/launch_monitor_observer/test_orchestrate_launch_e2e.py re-takes
    # it every gate run) — so the command composes the directory from those and nothing
    # else.
    #
    # This is the one ref in this file NOT resolved against this file's directory:
    # `command` is an argv, spawned with the directory the run was launched from as
    # its working directory — measured by dumping a judge command's own `PWD` on a
    # real launch. So the configuration is named launch-relative, which is why `just
    # orchestrate` is run from the repository root, exactly as `--dag-graph
    # graphs/dag-scope.yaml` already is.
    judge:
      command:
        - bash
        - -c
        - >-
          exec onemessagebus serve surfaces --codec monitor
          --config config/onemessagebus.yaml
          --transport-dir "${ONEPIPELINE_RUNS_DIR:-runs}/$ONEPIPELINE_RUN_ID/channel"
    mode: bypass
    # One turn every five minutes, paced by the graph rather than by the model: `every`
    # is the hold between the judge's answer and the next agent turn, and a `schedule`
    # on a two-party member paces this one conversation rather than starting a second.
    # The persona reads the stream from a cursor rather than a tail because of it.
    #
    # `start_after: 0` is stated because from schema 4 an omitted one defaults to
    # `every`, which would leave the first five minutes of every run unwatched; the
    # conversation still opens with the wave. It declares no `reset_on`: the turns keep
    # their cadence whatever the planner reads, and only the progress-report note below
    # restarts on a read.
    #
    # A manager's `note` offered during the hold ENDS it — the turn opens with the note
    # in it — so a note is never held for five minutes; a `trigger`, the run's `stop`,
    # a `cancel`, and the driver's cancel at settlement end one the same way. A journey
    # needing turns closer together says so with
    # `just orchestrate --set members.monitor.schedule.every=<seconds>`, never here.
    schedule: {every: 300, start_after: 0}
    # FOREGROUND, and this line is what keeps the observer graph alive between the
    # monitor's turns. A scheduled member is background unless it says otherwise, and a
    # run settles once only background members survive — so without this the graph
    # would take its initial wave and settle, and the note below would have no
    # conversation to be offered into. Liveness is a property this document declares;
    # tests/e2e/launch_monitor_observer/test_observer_graph_liveness_e2e.py reads it back off a real launch.
    background: false
    # WHEN the progress report is written; `../personas/orchestrator.yaml` says WHAT it
    # is. The note is offered into this conversation — one more message, not a fresh paid
    # turn — after `start_after` and then every `every` seconds, addressed to the agent
    # side (`worker`), which raises the report as one `check-in` surface.
    #
    # `reset_on` restarts its clock whenever the planner reads a surface of this run: the
    # engine passes the run's own journal to this graph (`--follow-events`, every launch,
    # restart and adoption), and the engine appends `planner-surfaced` to it when
    # `onepipeline next` hands a surface over. So a manager who reads an update hears
    # nothing more for thirty minutes, and one who reads none gets a report every thirty.
    # The 35-minute wake budget, the watch and the Stop guard stay the fallback for a
    # report that does not arrive. A journey compresses it on the launch with
    # `--set members.monitor.scheduled_notes.progress-report.every=<seconds>` (and
    # `.start_after=`), never here; the liveness journey reads this cadence back off a
    # real launch that names no override.
    scheduled_notes:
      - id: progress-report
        every: 1800
        start_after: 1800
        addressee: worker
        reset_on:
          include:
            - {source: pipeline, kind: planner-surfaced}
        text: |
          Progress report due: the planner has read no update from this run for thirty
          minutes. Write the progress report your role defines now, on this turn, even if
          nothing is wrong — what is done, in progress and next, and any risk, in plain
          language the manager can relay to the user — and raise it as one `check-in`
          surface with `onepipeline surface --kind check-in "$ONEPIPELINE_RUN_ID"`, its
          text on stdin through a single-quoted heredoc.
