# The agent graph a planning run's `draft` and `finalize` planners run under
# (`templates/planning/`): `graphs/node-scope.yaml`'s worker, judged by a panel of two. It is
# also the bar every plan review judges against: `scripts/review-plan-item.sh` runs
# `oneagentgraph run graphs/planner.yaml --judge-only --member worker` over a task or a
# plan's description, and attests under this member's `--bar-fingerprint`.
#
# - `reviewer` is the simulated user every dispatch has, holding the review bar of the
#   persona judged under: the judgment calls. It runs `oneharness.judge.toml`, which is
#   `read-only`, so the panel starts as it is: onejudge refuses a panel holding a judge
#   in a writable mode, and this graph sets no `allow_writable_judges`, because a
#   read-only reviewer needs none.
# - `plan-checklist` is llmlint under `config/plan-checklist.llmlint.yml`: the rules the
#   plan's code would otherwise first meet on its merge path. A judge-only run lints exactly
#   the judged file, which the review lays out as `tasks/<id>.md` or `projects/<id>.md` so
#   the checklist's globs select it; a draft dispatch's checkout holds no such path, so there
#   it judges nothing and the review after the draft is what holds the plan to it.
#
# The worker is handed each judge's instruction under its own header, and the panel
# completes only when both do. Every ref below is relative to THIS file's directory.
version: 1
name: planner
members:
  worker:
    kind: onejudge
    base_config: ../config/onejudge.base.yaml
    agent:
      oneharness_config: ../oneharness.toml
    judge:
      - oneharness_config: ../oneharness.judge.toml
        label: reviewer
      - kind: llmlint
        label: plan-checklist
        config: ../config/plan-checklist.llmlint.yml
        # A task carries this host's operational appendix, whose own `llmlint: ignore`
        # directives name the repository's rules rather than the checklist's: they are
        # read as text here, so their structure is not checked against this config.
        args: ["--no-ignore-check"]
    mode: bypass
