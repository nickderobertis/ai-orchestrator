# llmlint: ignore-file[changed_behavior_has_e2e] What reaches this document on a real run is a remote lifecycle publication, and this suite performs none: it doubles the published CLIs at the recipe boundary because driving one for real would open a pull request on a real repository. Everything below that boundary is driven — tests/e2e/test_orchestrate_launch_e2e.py runs this graph with only the paid provider scripted and asserts the `{body}` object a turn answers with, the re-prompt a non-conforming answer gets, and the `pr_author_graph` a real launch records.
# The drafting agent graph `just orchestrate` attaches to every run it launches.
#
# `onepipeline start --pr-author-graph <REF>` names it and runs it once per remote
# lifecycle publication whose plan states no body of its own. Naming none is the
# shipped default, exactly as `--dag-graph` defaults to `off`: a launch with no
# drafting graph opens its change requests with the body its plan states, or with
# none at all. `just orchestrate` opts in by naming this file, which is why every
# pull request from this host gets a drafted body and a bare `onepipeline start`
# elsewhere does not.
#
# Nothing scaffolds this file: the published crate ships the *flag*, not the
# document, because the document names the operator's own oneharness config and
# persona. This repository is that operator, and this is its file.
#
# Every ref below is relative to THIS file's directory, not the working directory:
# `oneagentgraph` resolves a relative ref against the directory the document it
# appears in was read from. The one exception is `schema_file`, which is not here at
# all — it lives in ../oneharness.pr-author.toml and resolves against THAT file's
# directory.
#
# Schema 4, for the one field the member below needs. Its own `task` requires 3;
# that task interpolates `{task}`, which `oneagentgraph` expands only from 4 — under
# 3 the token reaches the model as its six literal characters. oneagentgraph 0.3.3
# reads 1 through 6.
version: 4
name: pr-author
members:
  # The drafter. One single-sided turn per publication: read the branch's diff,
  # answer with the change request body, exit. It has no judge side and takes no
  # second turn, because ../oneharness.pr-author.toml's `schema_file` is the review:
  # an answer that is not exactly `{body: string}` is refused and re-prompted by
  # oneharness itself, which is a harder bar than a supervisor and a cheaper one.
  #
  # `../personas/pr-author.yaml` is named here for the LABEL alone. A single-sided
  # `kind: oneharness` member has no onejudge base config to layer a persona delta
  # over, so neither that file's `system_prompt` nor its `user.persona` reaches
  # this turn — the prose below is the only thing the model is given, and the persona
  # file is the catalog entry that names the role and nothing more. Exactly the
  # arrangement `graphs/dag-scope.yaml`'s `check-in` member documents.
  #
  # It claims its own `task`, and that is a rule rather than a nicety. `onepipeline`
  # composes ONE task for this graph — "Read this branch's diff and write the change
  # request's body…", followed by the task the branch delivered — and `oneagentgraph`
  # hands it to every member that does not claim one; a member's own `task` REPLACES
  # that composed task as its whole prompt. So this member states its role here and
  # opens by interpolating `{task}` back in, because that composed task is the ONLY
  # thing that names the branch and its delivered task to this member. Drop the
  # interpolation and the drafter is asked to describe a diff it was never shown.
  pr-author:
    kind: oneharness
    oneharness_config: ../oneharness.pr-author.toml
    persona: ../personas/pr-author.yaml
    task: |
      {task}

      Write that body the way this repository's own pull request template states
      it: a terse `## What`, a terse `## Why`, and `## Additional info` only when
      there is something to put in it. Read `.github/pull_request_template.md` in
      the branch if it has one.

      `## What` describes at a high level what changed and its impact, from the
      diff — never a walkthrough of individual hunks, and never a restatement of
      the task prose. `## Why` is the user-facing motivation: source it from the
      `## Why` of the task above, which records the impact and the decision driver
      a diff cannot recover.

      Nothing about how the change was produced belongs in the body. No dispatch
      details, no agent-turn or iteration counts, no local verification narrative,
      no orchestrator-to-agent handoff phrasing, no pasted task prose.

      Answer with the JSON object the response schema declares: exactly one `body`
      field, holding that Markdown. It is published verbatim as the change
      request's body.
