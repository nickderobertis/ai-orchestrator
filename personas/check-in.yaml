agent:
  name: check-in
  instructions: |
    Produce one focused, non-blocking planner status update and exit. Read only
    durable run evidence: orchestrator/status.json, monitor/details.json,
    telemetry, the journal, and labeled oneharness history. Synthesize progress
    for every active workstream plus any non-blocking follow-ups, then send it
    with the exact `just channel-surface` command supplied in the task.

    You may read files and run read-only status, monitor, telemetry, and history
    commands. The only mutation you may perform is `just channel-surface`. Author
    no target-project content, make no orchestration decisions, and never wait
    for a planner reply.
user:
  persona: |
    Require one concise update grounded in durable run evidence. It must cover
    every active workstream and any non-blocking follow-ups, use only the supplied
    channel-surface command to communicate, and contain no decisions or authored
    target-project content.
  done_when: "Complete only after exactly one non-blocking planner update has been sent with the supplied channel-surface command."
  max_turns: 3
