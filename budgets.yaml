# The budgets every push of this repository is held to. A budget labelled `onepipeline`
# is a delivery budget, reported once its change has landed rather than on a push;
# docs/budgets.md is the convention.
schema_version: 1
conditions:
  - name: dispatches
    command: ["scripts/budget-dispatches.sh"]
budgets:
  # llmlint: ignore-block[budgets_track_product_owner_outcomes] The one budget held at the push, where it can refuse a publication; cycle-time is a delivery budget reported only once a change has landed, so this is not a phase checked at cycle-time's moment but the bar every push waits on.
  - id: gate-time
    description: >-
      Wall clock of this repository's complete pre-push gate on a publishing push, with
      the Nx cache as that push found it. It protects how long every change waits to
      publish.
    labels: [host-variable]
    measure: reported
    command: ["scripts/budget-gate-time.sh"]
    unit: seconds
    direction: max
    threshold: 1800
  # llmlint: ignore-end[budgets_track_product_owner_outcomes]
  # The three figures one complete gate's own run records about its effect on the host,
  # which `python -m orchestrator.gate_impact report` reads back for this push; that
  # module's docstring states how each is measured and what each cannot see. Unlabelled,
  # so over any of them refuses the push.
  - id: gate-leftovers
    description: >-
      Entries one complete pre-push gate leaves in its own temporary root and registered
      scratch once it has exited. It protects the disk every agent on this host shares
      from a suite that stops cleaning up after itself.
    measure: reported
    command: [".venv/bin/python", "-m", "orchestrator.gate_impact", "report", "leftovers"]
    unit: entries
    direction: max
    threshold: 0
  - id: gate-peak-temp-disk
    description: >-
      The largest temporary disk, sampled while it runs, that one complete pre-push gate
      holds in its own root and registered scratch. It protects the shared disk
      from a gate that fills it mid-run and fails every concurrent dispatch with it.
    measure: reported
    command: [".venv/bin/python", "-m", "orchestrator.gate_impact", "report", "peak-temp-disk"]
    unit: gib
    direction: max
    threshold: 2
  - id: gate-leaked-processes
    description: >-
      Processes descended from one complete pre-push gate still alive the moment it
      exits. It protects the host from test processes that outlive their tests and hold
      its resources, or a caller's output, open.
    measure: reported
    command: [".venv/bin/python", "-m", "orchestrator.gate_impact", "report", "leaked-processes"]
    unit: processes
    direction: max
    threshold: 0
  - id: cycle-time
    description: >-
      A landed change's time from its first dispatch to its landing on the base. It
      protects how quickly delivered work reaches the base.
    labels: [onepipeline]
    measure: reported
    command: ["scripts/budget-cycle-time.sh"]
    unit: seconds
    direction: max
    threshold: 10800
  - id: design-doc-budget-summary-length
    description: >-
      Characters of the `## Budgets` section a design document renders, for #1568's real
      budget answers converted to the summary's shape (9 budgets, 6 concerns answered n/a, 4
      repositories, 1 realistic-data choice, no spike finding): what a person reads before
      approving a plan, which has to stay short enough to review on a phone. Rendered from the
      committed fixture through the design-doc template of the workspace project at this
      repository's root, so a template change that lengthens the summary is caught.
    measure: reported
    command: ["scripts/budget-design-doc-summary.sh"]
    unit: characters
    direction: max
    threshold: 3000
