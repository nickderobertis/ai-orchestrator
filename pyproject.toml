[project]
name = "ai-orchestrator"
version = "0.1.0"
description = "Local orchestration harness: drive many onejudge processes to complete a task DAG in parallel."
requires-python = ">=3.13"
# Nothing versioned here is published (`AGENTS.md`, "Stack and composition"): this
# classifier is the truthful statement of that, and the one PyPI refuses an upload over.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "onetaskgraph-sdk==0.14.17",
    "onebudgetspec-cli==0.2.2",
    "oneagentgraph-cli==0.13.2",
    "oneharness-cli==0.31.0",
    "onejudge==0.23.5",
    "onemessagebus-cli==0.11.1",
    "onevcs-cli==0.67.3",
    "onefollowup-cli==0.8.0",
    # A library rather than a producer's wheel: the one YAML reader this package has,
    # for composing the workspaces file `just repos-apply` installs. Pinned exactly like
    # the wheels so the lock and this list agree; `tests/test_host_installs.py` states
    # why it earns no row.
    "pyyaml==6.0.3",
]

[project.scripts]
# The one command this repository still owns: it composes the workspaces file `just
# repos-apply` installs — the tracked `config/onevcs.workspaces.yml` overlaid by the host's
# own file outside every checkout — so a host sizes its pool where its identities already
# live rather than in a tracked file every host shares; `orchestrator/workspaces_overlay.py`
# states the overlay rule. Every other verb is a thin `just` wrapper over a published CLI.
orchestrator-workspaces-overlay = "orchestrator.workspaces_overlay:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.26",
    # Evaluates the `oneharness-cli` specifier an installed `llmlint-cli` declares
    # against `config/oneharness.version` (`tests/llmlint_install.py`).
    "packaging>=24",
    "types-pyyaml>=6.0.12.20260906",
    # Reports each budget's figure and breakdown from `tests/budget_telemetry.py`, at the
    # release `config/onebudgetspec.version` pins for the CLI that reads the report.
    "onebudgetspec-sdk==0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
packages = ["orchestrator"]
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
# `orchestrator/budgets` holds the tests of the budget measurement it holds, which the
# judged lint's `budgets_scoped_to_minimal_tree` keeps beside `orchestrator/budgets.yaml`.
testpaths = ["tests", "orchestrator/budgets"]
# pytest's own import path for this suite's shared modules, so `project_fixtures` and
# `waits` resolve from whichever directory a tier collects rather than only from the one
# pytest happens to have inserted for the files it is collecting. It declares nothing
# about packaging: these are test helpers of this single uv workspace, not a second
# distribution for another project to depend on.
pythonpath = ["tests", "tests/e2e"]
addopts = "-q"
tmp_path_retention_count = 3
markers = [
    "reads_docs: asserts on this repository's own prose, so it belongs to the whole-workspace test tier rather than the code-only one",
    "reads_recipes: drives this repository's own recipes and scripts and reads nothing else of it, so it belongs to the recipe-scoped test tier rather than the code-only one",
    "reads_checkouts: reconciles this repository's configuration against state that lives outside the workspace — another repository's checkout, the merge path it publishes through, an installed producer whose wire format it reads, or a package registry's published releases — and so outside every cache key, and belongs to the uncached tier rather than any memoized one",
    "real_plan_store_roots(*sources, reason): keeps the named writable plan sources ('authoring', 'drafts') rooted where this checkout configures them rather than under the suite's own temporary root, for a module whose subject is that resolution; declared at module level with a reason naming what a temporary root would defeat",
]

[tool.coverage.run]
source = ["orchestrator"]
branch = true
# The measuring tiers' data files are declared Nx outputs, so a cache hit replays a
# file another checkout wrote. Absolute paths make that replay a failure rather than
# a saving: this host runs each dispatch in its own worktree, they share one cache,
# and the worktree that measured is usually gone by the time another replays its
# data — leaving the combine reporting "No source for code" for a file that is right
# there under the current root. Relative paths are what makes a recorded measurement
# a statement about the tree rather than about one directory that held it.
relative_files = true

[tool.coverage.report]
show_missing = true
# The single source of the enforced floor: pytest-cov adopts `fail_under` when no
# `--cov-fail-under` overrides it. `precision` is load-bearing, not cosmetic — the
# fail decision compares `round(total, precision)`, so at the default precision 0 a
# 94.93% total rounded up to 95 and exited 0 while printing "FAIL ... not reached".
#
# Raised to 100 when this repository became a configuration layer: what is left of
# the package is the label contract, the redaction rule, and the paths they read,
# all of them small trust boundaries that are fully exercised. A single uncovered
# statement fails this, which is what makes it a bar rather than a description.
fail_under = 100
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
