[project]
name = "ai-orchestrator"
version = "0.1.0"
description = "Local orchestration harness: drive many onejudge processes to complete a task DAG in parallel."
requires-python = ">=3.11"
dependencies = [
    "oneharness-cli==0.6.6",
    "onejudge==0.3.4",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
orchestrator-run-plan = "orchestrator.graph:main_cli"
orchestrator-replan = "orchestrator.replan:main"
orchestrator-next-round = "orchestrator.next_round:main_cli"
orchestrator-runs = "orchestrator.next_round:main_runs"
orchestrator-stop = "orchestrator.stop:main"
orchestrator-goals = "orchestrator.goals:main"
orchestrator-results = "orchestrator.results:main"
orchestrator-new-persona = "orchestrator.personas:main_new"
orchestrator-validate-personas = "orchestrator.personas:main_validate"
orchestrator-history = "orchestrator.history:main_list"
orchestrator-history-show = "orchestrator.history:main_show"
orchestrator-monitor = "orchestrator.monitor:main"
orchestrator-history-labels = "orchestrator.labels:main"
orchestrator-status = "orchestrator.status:main"
orchestrator-host = "orchestrator.host:main"
orchestrator-recoverable = "orchestrator.recoverable:main"
orchestrator-telemetry = "orchestrator.telemetry:main"
orchestrator-telemetry-server = "orchestrator.server:main"
orchestrator-smoke = "orchestrator.smoke:main"
orchestrator-integrate = "orchestrator.integrate:main"
orchestrator-repo-recover = "orchestrator.recover:main"
orchestrator-register-repo = "orchestrator.registry:main_register"
orchestrator-migrate-repo-workflow = "orchestrator.registry:main_migrate_workflow"
orchestrator-migrate-repo-type = "orchestrator.registry:main_migrate_type"
orchestrator-migrate-repo-gate = "orchestrator.registry:main_migrate_gate"
orchestrator-repos = "orchestrator.registry:main_repos"
orchestrator-orchestrate = "orchestrator.dispatch:main_orchestrate"
orchestrator-channel-next = "orchestrator.channel:main_next"
orchestrator-channel-reply = "orchestrator.channel:main_reply"
orchestrator-channel-surface = "orchestrator.channel:main_surface"
orchestrator-channel-approve = "orchestrator.channel:main_approve"
orchestrator-channel-reject = "orchestrator.channel:main_reject"
orchestrator-channel-continue = "orchestrator.channel:main_continue"
orchestrator-relay-supervisor = "orchestrator.channel:main_relay"
orchestrator-sweep-scratch = "orchestrator.scratch:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["orchestrator"]
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
tmp_path_retention_count = 3
markers = [
    "reads_docs: asserts on this repository's own prose, so it belongs to the whole-workspace test tier rather than the code-only one",
    "reads_recipes: drives this repository's own recipes and scripts and reads nothing else of it, so it belongs to the recipe-scoped test tier rather than the code-only one",
    "single_threaded: asserts on a process-directed signal, so it needs a process whose every thread it controls; xdist workers carry execnet's receiver thread, so these run in their own serial invocation",
]

[tool.coverage.run]
source = ["orchestrator"]
branch = true
# The measuring tiers' data files are declared Nx outputs, so a cache hit replays a
# file another checkout wrote. Absolute paths make that replay a failure rather than
# a saving: this host runs each dispatch in its own worktree, they share one cache,
# and the worktree that measured is usually gone by the time another replays its
# data — leaving the combine reporting "No source for code" for a file that is right
# there under the current root. Relative paths are what makes a recorded measurement
# a statement about the tree rather than about one directory that held it.
relative_files = true

[tool.coverage.report]
show_missing = true
# The single source of the enforced floor: pytest-cov adopts `fail_under` when no
# `--cov-fail-under` overrides it. `precision` is load-bearing, not cosmetic — the
# fail decision compares `round(total, precision)`, so at the default precision 0 a
# 94.93% total rounded up to 95 and exited 0 while printing "FAIL ... not reached".
fail_under = 95
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
