[project]
name = "ai-orchestrator"
version = "0.1.0"
description = "Local orchestration harness: drive many onejudge processes to complete a task DAG in parallel."
requires-python = ">=3.11"
dependencies = [
    "oneagentgraph-cli==0.3.10",
    "oneharness-cli==0.11.0",
    "onejudge==0.5.3",
    "onepipeline-api-cli==0.6.3",
    "onepipeline-cli==0.14.2",
    "onevcs-cli==0.15.0",
]

[project.scripts]
# The two commands this repository still owns. Every other verb is a thin `just`
# wrapper over a published CLI; the first exists because `just lint-llm` has to hand
# a tool it shells out to a merged `ONEHARNESS_HISTORY_LABELS` value, and the merge
# has to preserve an inherited value whose shape the recipe does not know.
orchestrator-history-labels = "orchestrator.labels:main"
# The second reads a plan against the review bar each of its nodes resolves to, which
# no published CLI knows how to do: the bar is composed from this host's own base
# config and the role `onepipeline` links, and the plan is refused before a launch
# spends a dispatch on a node its own judge would fail on procedure.
orchestrator-check-plan = "orchestrator.criteria_guard:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["orchestrator"]
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
tmp_path_retention_count = 3
markers = [
    "reads_docs: asserts on this repository's own prose, so it belongs to the whole-workspace test tier rather than the code-only one",
    "reads_recipes: drives this repository's own recipes and scripts and reads nothing else of it, so it belongs to the recipe-scoped test tier rather than the code-only one",
    "reads_checkouts: reconciles this repository's configuration against state that lives outside the workspace — another repository's checkout, the merge path it publishes through, or an installed producer whose wire format it reads — and so outside every cache key, and belongs to the uncached tier rather than any memoized one",
]

[tool.coverage.run]
source = ["orchestrator"]
branch = true
# The measuring tiers' data files are declared Nx outputs, so a cache hit replays a
# file another checkout wrote. Absolute paths make that replay a failure rather than
# a saving: this host runs each dispatch in its own worktree, they share one cache,
# and the worktree that measured is usually gone by the time another replays its
# data — leaving the combine reporting "No source for code" for a file that is right
# there under the current root. Relative paths are what makes a recorded measurement
# a statement about the tree rather than about one directory that held it.
relative_files = true

[tool.coverage.report]
show_missing = true
# The single source of the enforced floor: pytest-cov adopts `fail_under` when no
# `--cov-fail-under` overrides it. `precision` is load-bearing, not cosmetic — the
# fail decision compares `round(total, precision)`, so at the default precision 0 a
# 94.93% total rounded up to 95 and exited 0 while printing "FAIL ... not reached".
#
# Raised to 100 when this repository became a configuration layer: what is left of
# the package is the label contract, the redaction rule, and the paths they read,
# all of them small trust boundaries that are fully exercised. A single uncovered
# statement fails this, which is what makes it a bar rather than a description.
fail_under = 100
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
