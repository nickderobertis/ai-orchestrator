[project]
name = "ai-orchestrator"
version = "0.1.0"
description = "Local orchestration harness: drive many onejudge processes to complete a task DAG in parallel."
requires-python = ">=3.11"
dependencies = [
    "oneagentgraph-cli==0.3.15",
    "oneharness-cli==0.11.3",
    "onejudge==0.7.0",
    "onepipeline-api-cli==0.7.2",
    "onepipeline-cli==0.27.0",
    "onevcs-cli==0.19.3",
]

[project.scripts]
# The seven commands this repository still owns. Every other verb is a thin `just`
# wrapper over a published CLI; the first exists because `just lint-llm` has to hand
# a tool it shells out to a merged `ONEHARNESS_HISTORY_LABELS` value, and the merge
# has to preserve an inherited value whose shape the recipe does not know.
orchestrator-history-labels = "orchestrator.labels:main"
# The second reads a plan project against the review bar each of its nodes resolves to, which
# no published CLI knows how to do: the bar is composed from this host's own base
# config and the role `onepipeline` links, and the plan is refused before a launch
# spends a dispatch on a node its own judge would fail on procedure.
orchestrator-check-plan = "orchestrator.plan_check:main"
# The third spends the judged turn that clears a plan's authored content: `check-plan`
# refuses a task carrying no review record for what it currently says, and this is what
# records one. It is a command of this repository rather than a wrapper because the
# record it writes has to be written by this repository's own code — see
# `orchestrator/plan_review.py` for why that is structural rather than a convention.
orchestrator-review-plan = "orchestrator.plan_review:main"
# The fourth is the step between them: it copies a cleared plan onto the board this
# repository launches from, refusing one whose criteria nothing has reviewed before the
# destination is asked to hold it. It is a command of this repository rather than a bare
# `onetaskgraph project copy` because that pre-flight has to ask the same question
# `check-plan` asks, of the same code — a second implementation of the review key would
# disagree with the first the moment either moved.
orchestrator-copy-plan = "orchestrator.plan_copy:main"
# The fifth records the user's approval of the design document a plan is reviewed as,
# which is the thing a person can actually judge and so the thing put in front of them.
# It is a command of this repository because the record is keyed on this checkout's own
# tracked template — see `orchestrator/design_approval.py`.
orchestrator-approve-design = "orchestrator.design_approval:main"
# The sixth is the other half of that gate and is not a verb anybody types: every launch
# this repository makes goes through it, and it refuses a plan whose design document is
# missing or unapproved before `onepipeline start` is reached.
orchestrator-launch-gate = "orchestrator.design_approval:gate_main"
# The seventh answers where a destination holds a plan `just finish-plan` copied into it,
# and the one design document beside it — the two things a person then opens. Neither
# address can be composed from this side: a destination decides its own native ids and
# where its records live, so both are read back out of it through the origin stamp the
# store writes onto every record it creates by copying.
orchestrator-plan-locations = "orchestrator.plan_locations:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["orchestrator"]
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest's own import path for this suite's shared modules, so `project_fixtures` and
# `waits` resolve from whichever directory a tier collects rather than only from the one
# pytest happens to have inserted for the files it is collecting. It declares nothing
# about packaging: these are test helpers of this single uv workspace, not a second
# distribution for another project to depend on.
pythonpath = ["tests", "tests/e2e"]
addopts = "-q"
tmp_path_retention_count = 3
markers = [
    "reads_docs: asserts on this repository's own prose, so it belongs to the whole-workspace test tier rather than the code-only one",
    "reads_recipes: drives this repository's own recipes and scripts and reads nothing else of it, so it belongs to the recipe-scoped test tier rather than the code-only one",
    "reads_checkouts: reconciles this repository's configuration against state that lives outside the workspace — another repository's checkout, the merge path it publishes through, an installed producer whose wire format it reads, or a package registry's published releases — and so outside every cache key, and belongs to the uncached tier rather than any memoized one",
]

[tool.coverage.run]
source = ["orchestrator"]
branch = true
# The measuring tiers' data files are declared Nx outputs, so a cache hit replays a
# file another checkout wrote. Absolute paths make that replay a failure rather than
# a saving: this host runs each dispatch in its own worktree, they share one cache,
# and the worktree that measured is usually gone by the time another replays its
# data — leaving the combine reporting "No source for code" for a file that is right
# there under the current root. Relative paths are what makes a recorded measurement
# a statement about the tree rather than about one directory that held it.
relative_files = true

[tool.coverage.report]
show_missing = true
# The single source of the enforced floor: pytest-cov adopts `fail_under` when no
# `--cov-fail-under` overrides it. `precision` is load-bearing, not cosmetic — the
# fail decision compares `round(total, precision)`, so at the default precision 0 a
# 94.93% total rounded up to 95 and exited 0 while printing "FAIL ... not reached".
#
# Raised to 100 when this repository became a configuration layer: what is left of
# the package is the label contract, the redaction rule, and the paths they read,
# all of them small trust boundaries that are fully exercised. A single uncovered
# statement fails this, which is what makes it a bar rather than a description.
fail_under = 100
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
