[project]
name = "ai-orchestrator"
version = "0.1.0"
description = "Local orchestration harness: drive many onejudge processes to complete a task DAG in parallel."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
orchestrator-dispatch = "orchestrator.dispatch:main"
orchestrator-run-plan = "orchestrator.plan:main"
orchestrator-repo-task = "orchestrator.lifecycle:main_task"
orchestrator-repo-plan = "orchestrator.lifecycle:main_plan"
orchestrator-replan = "orchestrator.replan:main"
orchestrator-next-round = "orchestrator.next_round:main"
orchestrator-runs = "orchestrator.next_round:main_runs"
orchestrator-new-persona = "orchestrator.personas:main_new"
orchestrator-validate-personas = "orchestrator.personas:main_validate"
orchestrator-history = "orchestrator.history:main_list"
orchestrator-history-show = "orchestrator.history:main_show"
orchestrator-status = "orchestrator.status:main"
orchestrator-integrate = "orchestrator.integrate:main"
orchestrator-repo-recover = "orchestrator.recover:main"
orchestrator-register-repo = "orchestrator.registry:main_register"
orchestrator-migrate-repo-workflow = "orchestrator.registry:main_migrate_workflow"
orchestrator-repos = "orchestrator.registry:main_repos"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["orchestrator"]
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["orchestrator"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
