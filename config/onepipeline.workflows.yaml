# The launch config of this host's own workflow runs — `just plan`, `just finish-plan`, the
# spikes run a planning run's `spikes` step starts, and the follow-up runs — as the
# engine's `start --launch-config` reads it. It is `config/onepipeline.launch.yaml` without
# what only a plan's own run carries: no launch check (a planning run launches a plan
# nothing has reviewed yet, which is the point of it), no plan-edit hook, no run-end hook
# and no drafting graph. A planning run's tasks are rendered by the store from this host's
# `templates/planning/` files rather than resolved by name, so `require_rendered` is off.
# This is the authoritative value for a spikes project, which `scripts/spike-records.sh`
# launches under this document; `plan check` reads no launch config, so
# `scripts/onepipeline.sh` restates it as `--require-rendered false` for a project whose own
# record carries the store's provenance naming `templates/planning/spikes.md.j2`, and
# `--require-rendered true` for every other project.
# Paths are relative to the launch directory, this checkout's root.
schema_version: 14
require_rendered: false
template_root: templates
bus_config: config/onemessagebus.yaml
dispatch_env_hook: scripts/dispatch-env-hook.sh
maintenance_config: config/onepipeline.maintenance.yaml
