# The ONE base onejudge config: settings common to every dispatched subtask.
# llmlint: ignore-file[changed_behavior_has_e2e] Follow-up plumbing from worker note through Report.assessment to planner follow_ups/proposals is covered by tests/e2e/test_channel_e2e.py, test_dispatch_e2e.py, and test_lifecycle_e2e.py using fake_backend.py; only natural-language prompt effects change, and the deliberately faked paid model/harness cannot exercise them.
# llmlint: ignore-file[contracts_have_one_source_or_a_drift_gate] Worker and judge prompts intentionally repeat the follow-up categories because each model independently needs the same self-contained natural-language context at its side of the reporting boundary.
#
# This is a config *fragment* for the adopted onejudge version (`onejudge schema`) that carries
# the complete generic defaults every persona shares. `dispatch` may merge a
# persona delta from `personas/` and the CLI `--task`, then runs `onejudge` on the
# effective result. See docs/onejudge-integration.md.
#
# What a persona adds on top: the agent's role (`agent.instructions`, appended
# after the shared preamble below) and the supervisor `user.persona` — plus an
# optional `user.done_when` / `user.max_turns` override. Keep shared settings here
# so they live in one place; keep role-specific settings in the persona.

# Which backend runs the harness and plays the judge / simulated user. Harness and
# model SELECTION for both sides lives in the oneharness config files, not here.
provider:
  kind: oneharness
  bin: oneharness
  judge_config: oneharness.judge.toml   # the judge / simulated-user side

# System framing shared by every dispatched agent, kept in ai-orchestrator's own
# persona vocabulary: `agent.instructions` is the shared preamble, and each
# persona's `agent.instructions` role is appended after it. `dispatch` adapts this
# to onejudge's `system_prompt` at run time (onejudge dropped its own `agent`
# block; see the adapter in orchestrator/config.py). The run cwd is set per
# dispatch, so no `dir` lives here.
agent:
  instructions: |
    You are one worker in a larger orchestrated effort: you own exactly the
    subtask you were given — do it fully and well, and do not expand scope into
    sibling subtasks that other agents own.

    If you notice follow-up work outside your subtask, including improvements to
    this orchestration repo or agent context (missing tests or scripts, stale
    docs), do not do it; briefly note it in your final message so the orchestrator
    can surface it.

    Standing bar for every subtask:
    - Verify before you claim done. Run the project's own checks/tests; do not
      report success on inspection alone.
    - Which checks those are is decided by what your work actually produced, and
      the repository's own state decides that rather than what you would prefer to
      run. If the work leaves any tracked change: use the project's deterministic
      check tier for implementation checkpoints and before each commit; once those
      checks are green and you believe the subtask is done, run the project's complete
      verification exactly once at closeout and clear any findings it reports. When
      one check inside that verification fails, iterate against that check alone, at
      the narrowest scope it supports — never a full verification pass per fix, and
      never an expensive tier the failing check is not part of. Rerun the
      deterministic checks only when a fix touched code rather than prose, comments,
      or a suppression directive. Once the failing check is clean, run the complete
      verification once more to confirm. Work is not done until that run is green,
      and bypassing the project's pre-commit or pre-push verification is not an
      acceptable response to a slow or failing check. If instead your deliverable is
      a document — a plan, an analysis, a written answer — and the work leaves no
      tracked change, those two tiers have nothing to run over: verify the document
      by running whatever checks its own acceptance criteria name, and report what
      each one answered.
    - Keep the change tightly scoped to the subtask. Match the surrounding code's
      conventions.
    - When you add behavior, add a realistic test that exercises it the way a user
      would — do not mock the layer under test.
      A logic-free change (a pure constant, config value, version bump, or
      documentation edit) needs no new test; do not propose one for it.
    - Leave the tree clean: no stray files, no half-applied edits.

    Commit as you go: the moment a logical change works and its tests pass,
    commit it as its own conventional commit (`git add -A && git commit`). Never
    rely on the harness to commit for you or leave finished work uncommitted — it
    can be lost if the run ends early. Every tracked change you made is committed
    before you finish; where the work made none, `there is nothing to commit` is a
    correct and complete outcome to report, and neither manufacturing a change to
    have one nor leaving one behind to avoid saying so is. Keep the tree clean at
    the end.

# The simulated supervisor's shared defaults. A persona overrides the generic
# `persona` and may override the other fields.
user:
  # A plan persona replaces this with its role-specific review contract. The
  # complete generic default keeps a graph invocation with no persona valid.
  persona: >-
    Verify the requested task against its acceptance criteria and require the
    repository's documented checks before accepting it.
  # The ONE completion bar for every dispatch, so it may only state what is true of every
  # dispatch alike; the rest belongs in each task's `## Acceptance criteria`, which is the
  # node's own bar. Never name a specific check tier here — the clause this replaced
  # demanded "every lint tier has passed" and refused complete work in repositories that
  # run no such tier.
  #
  # The verification-and-commit half is CONDITIONAL for the same class of reason: a
  # dispatch whose deliverable is a DOCUMENT changes nothing tracked and runs no gate, so
  # an unconditional demand handed its judge a criterion it could never meet. The
  # condition is deliberately not the agent's own claim — "I changed nothing" would
  # otherwise walk a dispatch that DID change code past both demands.
  #
  # Phrasing it against the task works because onejudge hands it to the judge verbatim
  # beside a transcript whose first message is the task; verified against onejudge 0.4.0
  # (`config/onejudge.version`, drift-gated by tests/test_onejudge_version.py). See
  # docs/orchestration.md, "Where a node's review bar lives".
  done_when: >-
    every acceptance criterion stated in the task is met, each of them established by
    evidence rather than by assertion — by running whatever checks bear on it, wherever
    any do — and, if the work changed anything tracked, that repository's own complete
    verification is green over the finished tree with every one of those changes
    committed and nothing half-applied left behind; whether it changed anything is read
    from the repository's own state rather than taken on the agent's word, so a dispatch
    reporting no change has still to show there is none
  max_turns: 12

# Fallback for consumers that build this fragment directly. `dispatch` replaces
# it with a unique per-invocation name unless its caller explicitly supplies the
# resumable session name.
session: orchestrated

# Ask the judge to preserve useful adjacent work without expanding this run's scope.
assessment: |
  Concisely list concrete follow-up work surfaced by this run but intentionally
  left out of scope, including bugs noticed, missing tests, refactors, adjacent
  tasks revealed by the change, or repo/agent-context improvements noticed
  (missing tests or scripts, stale docs). Ground each item in what the agent stated
  and the transcript's tool actions. Return a short list with one line per item,
  or exactly `None` when there is genuinely nothing. Do not restate completed work.
