# yaml-language-server: $schema=https://raw.githubusercontent.com/nickderobertis/llmlint/main/assets/llmlint.schema.json
#
# The plan checklist: the llmlint rules a plan is held to while it is reviewed, so a rule
# its code would later meet on the merge path refuses the plan before approval instead.
# It is the planner's second judge (`graphs/planner.yaml`) and the checklist `just
# review-plan` runs, both through `scripts/plan-checklist.sh`, and the one source of every
# plan-checklist rule. The repository's own `llmlint.yml` never loads it, and llmlint never
# discovers it, because it is not named `llmlint.yml`.
#
# Every rule judges exactly the plan documents it is passed — the project's description
# and each task's Markdown document — and never a file of a repository's tree. Under `-c`
# llmlint roots every glob at its working directory rather than at this file's, and drops
# a passed path outside that directory without a word, so the script runs llmlint from the
# plan-authoring root (the directory holding `projects/` and `tasks/`), names the
# documents relative to it, and selects them with `**/*.md` here. A rule about the plan's
# description alone selects `projects/**/*.md`, and one about task documents alone
# `tasks/**/*.md`, since that is where the store keeps each.
#
# The judge's oneharness routing is `oneharness.llmlint.toml`'s, the same as this
# repository's judged tier: `oneharness.bin` resolves against llmlint's working
# directory, which is the plan-authoring root and not this checkout, so the script
# names `scripts/llmlint-oneharness.sh` through `LLMLINT_ONEHARNESS_BIN` rather than
# this file naming it.
#
# A deliberate departure from a rule is one HTML comment on its own line in the departing
# task's `additional_info` answer — `<!--`, then `llmlint: ignore-file`, then the rule's name
# in square brackets, then the reason, then `-->` — or, for a rule judged on the plan's
# description, the same line in its overview under `**Decided**`. The checklist runs with
# `--no-ignore-check`, so a departure naming a misspelled rule suppresses nothing and the
# rule still fires.
files:
  include: ["**/*.md"]
rationales: true
history:
  max_runs: 200
plugins:
  - "https://raw.githubusercontent.com/nickderobertis/dero-skills/main/skills/bootstrap/create-repo/assets/llmlint/tools/onebudgetspec.llmlint.yml@1"
  - "https://raw.githubusercontent.com/nickderobertis/dero-skills/main/skills/bootstrap/create-repo/assets/llmlint/project-graph.llmlint.yml@1"

agents:
  plan:
    prompt_template: |

      ## You are reading a plan, not code

      Every target file is a document of one execution plan, written before any of its
      work exists. Each is either the plan's description (its goal, its workload and
      sizing, its answer about 10x usage, and its budget checklist) or one plan task's
      Markdown document. A task document carries YAML frontmatter, whose
      `orchestrator.budgets` record lists the budgets that task owns, and a body with
      `## What`, `## Why`, `## Acceptance criteria`, an optional `## Budgets` section
      and `## Additional info`. Text under `### Operational notes for this host` is a
      standard appendix every task carries: read it as context, never as the plan's
      own content, and never report a violation inside it.

      The plan describes work in a target repository you cannot see. Judge each rule
      against what the plan says will exist once its tasks are done. A rule written
      about code, tests, scripts, `budgets.yaml` files or project definitions is
      judged against the plan's own statements of them: where each budget will be
      registered and what its command will read and measure, what each test will
      assert and with what doubled, and which project a test will land in and what
      that project will depend on. A plan that states nothing a rule could judge
      makes that rule not relevant; never report a rule against a file only because
      the repository it describes is not visible to you.

rules:
  # The fragment rules a plan is held to. Each inherits its description from the fragment,
  # so its wording stays upstream; only where it looks and when it applies are stated here.
  - name: budgets_track_product_owner_outcomes
    override: true
    agent: plan
    files:
      include: ["**/*.md"]
    relevance: the plan registers or keeps a budget, in a task's budget record or a description's budget checklist
  - name: budgets_reuse_gate_telemetry
    override: true
    agent: plan
    files:
      include: ["**/*.md"]
    relevance: the plan registers a budget and states what its command runs or reads
  - name: budgets_scoped_to_minimal_tree
    override: true
    agent: plan
    files:
      include: ["**/*.md"]
    relevance: the plan registers a budget and states where its budgets file, command, or budget-only fixtures will live
  - name: budget_commands_measure_directly
    override: true
    agent: plan
    files:
      include: ["**/*.md"]
    relevance: the plan registers a budget and states its command
  - name: tests_hold_no_nonfunctional_thresholds
    override: true
    agent: plan
    files:
      include: ["**/*.md"]
    relevance: the plan states what a test it adds or changes will assert about a timing, size or count figure, or how it bounds a wait
  - name: expensive_tests_stay_behind_their_own_edge
    override: true
    agent: plan
    files:
      include: ["**/*.md"]
    relevance: the plan adds or changes a test that is slow or reaches an external service, or a project definition or dependency edge that owns one, or makes a budget's figure depend on one

  # Every other rule the two fragments ship, off: each is about a repository's own files
  # rather than anything a plan states.
  - name: budget_descriptions_durable_and_terse
    override: true
    agent: plan
    files:
      include: ["**/*.md"]
    relevance: false
  - name: onebudgetspec_is_the_only_judge
    override: true
    agent: plan
    files:
      include: ["**/*.md"]
    relevance: false
  - name: instruction_layer_localized
    override: true
    agent: plan
    files:
      include: ["**/*.md"]
    relevance: false
  - name: new_projects_keep_the_graph_uniform
    override: true
    agent: plan
    files:
      include: ["**/*.md"]
    relevance: false
  - name: code_lands_in_the_domain_that_owns_it
    override: true
    agent: plan
    files:
      include: ["**/*.md"]
    relevance: false

  # The rules a plan alone answers to: what its tasks, its budgets and its description must
  # state before any of its work exists. Each is worded here and nowhere else.
  - name: plan_criteria_satisfiable_inside_the_dispatch
    agent: plan
    files:
      include: ["tasks/**/*.md"]
    relevance: the task document has an `## Acceptance criteria` section
    description: |
      true when every acceptance criterion can be met from inside the task's own dispatch,
      from what its worker controls. false when one rests on something that happens only
      after the dispatch settles or outside it: a change request merging, a release or
      deploy, the merge path's or a host's required checks passing, a scheduled job, or a
      third party acting. A criterion naming a later comparison while stating that its
      result is not the task's bar, one about the dispatch's own judged lint, and one about
      a draft or demonstration change request the task grants its worker rest on nothing
      outside it.
    require_line_attribution: true
  - name: plan_criteria_require_realistic_tests
    agent: plan
    files:
      include: ["tasks/**/*.md"]
    relevance: the task's acceptance criteria ask for a test or other proof of behaviour
    description: |
      true when every criterion asking for proof of behaviour requires a test that drives
      the real interface the behaviour is reached by, doubling at most a paid, external or
      third-party boundary, and asserts the behaviour itself rather than internal state or
      a snapshot of output.
    require_line_attribution: true
  - name: plan_workload_states_numbers
    agent: plan
    files:
      include: ["**/*.md"]
    relevance: the file states a realistic workload, in a plan description's workload or a budget's `workload`
    description: |
      true when every realistic workload the file states gives its scale in numbers: how
      many of what, how often, how large. false when one is stated only in words such as
      "typical", "a few" or "normal use".
    require_line_attribution: true
  - name: plan_ten_x_names_a_covering_budget
    agent: plan
    files:
      include: ["projects/**/*.md"]
    relevance: the description answers what the product owner notices getting worse first at 10x realistic usage
    description: |
      true when the 10x answer names, by id, a budget the plan registers or keeps whose
      figure grows with the effect the answer names.
    require_line_attribution: true
  - name: plan_budget_command_measures_its_figure
    agent: plan
    files:
      include: ["tasks/**/*.md"]
    relevance: the task's budget record registers or changes a budget
    description: |
      true when every budget in the task's record names a `command` that, as the plan
      describes it, produces that budget's `measure`, in its `unit`, at its `workload`.
    require_line_attribution: true
  - name: plan_budget_basis_matches_evidence
    agent: plan
    files:
      include: ["tasks/**/*.md"]
    relevance: the task's budget record holds a budget whose `basis` is `measured`
    description: |
      true when each such budget's `evidence` reports a measurement of its figure at its
      `workload`.
    require_line_attribution: true
  - name: plan_budget_inner_measure_has_reason
    agent: plan
    files:
      include: ["tasks/**/*.md"]
    relevance: the task's budget record registers or changes a budget
    description: |
      true when every budget measures the outermost figure its concern is felt at, or,
      where it measures one step, component or inner process of what the user waits on or
      pays for, gives a non-empty `inner_measure_reason` saying why.
    require_line_attribution: true
  - name: plan_criteria_omit_repo_wide_budgets
    agent: plan
    files:
      include: ["tasks/**/*.md"]
    relevance: the task document has an `## Acceptance criteria` section
    description: |
      true when the task's acceptance criteria name only budgets the task itself registers
      or changes. false when a criterion holds the task to a repository-wide budget it
      does not own, such as the gate's own time or another root budget.
    require_line_attribution: true
  - name: plan_budget_owner_criteria_name_budget_and_workload
    agent: plan
    files:
      include: ["tasks/**/*.md"]
    relevance: the task's budget record registers or changes a budget
    description: |
      true when the task's acceptance criteria name, by id, every budget its record
      registers or changes, each with the workload it is measured at.
    require_line_attribution: true

  # The facts a re-declared fragment rule judges, which a plan has to state before that
  # rule has anything to read. Each demands a statement and never restates the fragment
  # rule's invariant, whose one wording stays upstream.
  - name: plan_budget_names_its_telemetry_source
    agent: plan
    files:
      include: ["tasks/**/*.md"]
    relevance: the task's budget record holds a budget whose figure is read from telemetry tests record, by a `source` of `telemetry` or a command that analyses recorded telemetry
    description: |
      true when the task names, for every such budget, the test target or targets whose
      tests record what its command reads (the project and target, or the test tier, that
      runs them, not only test files) and the project whose budgets file registers it.
    require_line_attribution: true
  - name: plan_budget_measurement_is_decided
    agent: plan
    files:
      include: ["tasks/**/*.md"]
    relevance: the task's budget record registers or changes a budget
    description: |
      true when the task states, for every budget it owns, one decided way its figure is
      taken (read from telemetry its tests record, or measured fresh by its command)
      together with any label the budget carries, such as `host`. false when it leaves the
      way to the worker, as an either/or or a "say which".
    require_line_attribution: true
