# yaml-language-server: $schema=https://raw.githubusercontent.com/nickderobertis/llmlint/main/assets/llmlint.schema.json
#
# The plan checklist: the llmlint rules a plan is held to while it is reviewed, so a rule
# its code would later meet on the merge path refuses the plan before approval instead.
# It is the `plan-checklist` judge of `graphs/planner.yaml`'s worker, so every review —
# `scripts/review-plan-item.sh`'s judge-only run, for authoring and for every live edit —
# judges against it, and the planner's draft task carries these rules as `llmlint rules`
# prints them. It is the one source of every plan-checklist rule, the criteria and
# authorization rules and the cross-record budget rules among them, each judged rather than
# matched. The repository's own `llmlint.yml` never loads it, and llmlint never discovers
# it, because it is not named `llmlint.yml`.
#
# Every rule judges exactly the plan document it is passed. The review lays each out under a
# scratch root as `tasks/<id>.md` (a task) or `projects/<id>.md` (a plan's description, its
# front matter listing every task with its metadata), each opening with front matter holding
# the record's title and metadata. A rule about task documents selects `tasks/**/*.md`, one
# about descriptions `projects/**/*.md`; no rule selects any other path, so a checkout's own
# files are never judged against this checklist.
#
# The judge's oneharness routing is `oneharness.llmlint.toml`'s, the same as this
# repository's judged tier, named below under `oneharness.config`; llmlint resolves it
# against the process's working directory, which is this checkout's root.
#
# A deliberate departure from a rule is one HTML comment on its own line in the departing
# task's `additional_info` answer — `<!--`, then `llmlint: ignore-file`, then the rule's name
# in square brackets, then the reason, then `-->` — or, for a rule judged on the plan's
# description, the same line in its overview under `**Decided**`.
files:
  include: ["tasks/**/*.md", "projects/**/*.md"]
rationales: true
history:
  max_runs: 200
oneharness:
  config: ["oneharness.llmlint.toml"]
plugins:
  - "https://raw.githubusercontent.com/nickderobertis/dero-skills/main/skills/bootstrap/create-repo/assets/llmlint/tools/onebudgetspec.llmlint.yml@1"
  - "https://raw.githubusercontent.com/nickderobertis/dero-skills/main/skills/bootstrap/create-repo/assets/llmlint/project-graph.llmlint.yml@1"

agents:
  plan:
    prompt_template: |

      ## You are reading a plan, not code

      Every target file is a document of one execution plan, written before any of its
      work exists. Each is either the plan's description (its goal, its workload and
      sizing, its answer about 10x usage, and its budget checklist) or one plan task's
      Markdown document. Each opens with front matter holding its title and metadata; a
      description's also lists every task of the plan, with each task's metadata, so a rule
      about the whole plan reads the tasks there. A task's `orchestrator.budgets` record
      lists the budgets that task owns, and its `orchestrator.unit` the unit it changes. A
      task document has a body with
      `## What`, `## Why`, an optional `## Goals` section, an optional `## Budgets`
      section, `## Acceptance criteria` and `## Additional info`. Text under
      `### Operational notes for this host` is a standard appendix every task
      carries: read it as context, never as the plan's own content, and never
      report a violation inside it.

      The plan describes work in a target repository you cannot see. Judge each rule
      against what the plan says will exist once its tasks are done. A rule written
      about code, tests, scripts, `budgets.yaml` files or project definitions is
      judged against the plan's own statements of them: where each budget will be
      registered and what its command will read and measure, what each test will
      assert and with what doubled, and which project a test will land in and what
      that project will depend on. A plan that states nothing a rule could judge
      makes that rule not relevant; never report a rule against a file only because
      the repository it describes is not visible to you.

      Who ruled on a decision does not settle it. A decision the plan records as the
      manager's ruling, an answer to the planner's question or an exception the manager
      accepted, is judged against every rule like anything the planner chose. Only a
      decision the plan attributes to the user's own words is exempt: the user's ruling
      binds, so never report a violation in what the plan records as the user's own
      words, quoted or attributed to the user in its **Decided** or **Requested** part.

rules:
  # The fragment rules a plan is held to. Each inherits its description from the fragment,
  # so its wording stays upstream; only where it looks and when it applies are stated here.
  - name: budgets_track_product_owner_outcomes
    override: true
    agent: plan
    files:
      include: ["tasks/**/*.md", "projects/**/*.md"]
    relevance: the plan registers or keeps a budget, in a task's budget record or a description's budget checklist
  - name: budgets_reuse_gate_telemetry
    override: true
    agent: plan
    files:
      include: ["tasks/**/*.md", "projects/**/*.md"]
    relevance: the plan registers a budget and states what its command runs or reads
  - name: budgets_scoped_to_minimal_tree
    override: true
    agent: plan
    files:
      include: ["tasks/**/*.md", "projects/**/*.md"]
    relevance: the plan registers a budget and states where its budgets file, command, or budget-only fixtures will live
  - name: budget_commands_measure_directly
    override: true
    agent: plan
    files:
      include: ["tasks/**/*.md", "projects/**/*.md"]
    relevance: the plan registers a budget and states its command
  - name: tests_hold_no_nonfunctional_thresholds
    override: true
    agent: plan
    files:
      include: ["tasks/**/*.md", "projects/**/*.md"]
    relevance: the plan states what a test it adds or changes will assert about a timing, size or count figure, or how it bounds a wait
  - name: expensive_tests_stay_behind_their_own_edge
    override: true
    agent: plan
    files:
      include: ["tasks/**/*.md", "projects/**/*.md"]
    relevance: the plan adds or changes a test that is slow or reaches an external service, or a project definition or dependency edge that owns one, or makes a budget's figure depend on one

  # Every other rule the two fragments ship, off: each is about a repository's own files
  # rather than anything a plan states. `code_lands_in_the_domain_that_owns_it` stays off
  # beside `seam_decisions_rest_with_their_owner` below: it asks which project a file of
  # code belongs in, while that rule asks which side of a contract a decision belongs to.
  - name: budget_descriptions_durable_and_terse
    override: true
    agent: plan
    files:
      include: ["tasks/**/*.md", "projects/**/*.md"]
    relevance: false
  - name: onebudgetspec_is_the_only_judge
    override: true
    agent: plan
    files:
      include: ["tasks/**/*.md", "projects/**/*.md"]
    relevance: false
  - name: instruction_layer_localized
    override: true
    agent: plan
    files:
      include: ["tasks/**/*.md", "projects/**/*.md"]
    relevance: false
  - name: new_projects_keep_the_graph_uniform
    override: true
    agent: plan
    files:
      include: ["tasks/**/*.md", "projects/**/*.md"]
    relevance: false
  - name: code_lands_in_the_domain_that_owns_it
    override: true
    agent: plan
    files:
      include: ["tasks/**/*.md", "projects/**/*.md"]
    relevance: false

  # First decide whether work needs an added/changed task budget; only then perform budget
  # analysis. With none and no existing analysis, overview alone is sufficient. Existing
  # full analysis stays validated. Design rendering is `design-doc` budgets_guidance's.
  # The rules a plan alone answers to: what its tasks, its budgets and its description must
  # state before any of its work exists. Each is worded here and nowhere else.
  - name: seam_decisions_rest_with_their_owner
    agent: plan
    files:
      include: ["tasks/**/*.md", "projects/**/*.md"]
    relevance: the plan's design names a contract between two components, such as a call, a selection or query, a stored shape or a boundary between two collections of code
    description: |
      true when every decision a contract between two components encodes is made by the
      component that owns the knowledge it rests on. A contract exposes what the caller
      needs as behaviour: a purpose-built call, or a general primitive such as
      list-then-fetch that the caller composes. false when a contract requires either side
      to name the other's internal vocabulary or to decide the other's concerns: a knob the
      caller tunes over the callee's internals, or a callee that encodes what its caller's
      screen or workflow needs.

      The incident this rule comes from, an engine and the read API that draws its runs:
      - false: `Selection::FirstScreen { node, node_latest, stub_kinds }`, where the read
        API passes the engine's record kinds through `stub_kinds`. The caller names the
        callee's internals.
      - false: the engine decides "every record whose payload a first screen draws" and
        owns the screen's row count. The callee absorbs its caller's concern.
      - true: the engine returns the run's folded state plus a payload-free head for every
        record, and fetches whole records by handle; the read API, which owns the screen,
        chooses which records to fetch whole.
    require_line_attribution: true
  - name: plan_criteria_satisfiable_inside_the_dispatch
    agent: plan
    files:
      include: ["tasks/**/*.md"]
    relevance: the task document has an `## Acceptance criteria` section
    description: |
      true when every acceptance criterion can be met from inside the task's own dispatch,
      from what its worker controls. false when one rests on something that happens only
      after the dispatch settles or outside it: a change request merging, a release or
      deploy, the merge path's or a host's required checks passing, a scheduled job, or a
      third party acting. A criterion naming a later comparison while stating that its
      result is not the task's bar, and one about the dispatch's own judged lint, rest on
      nothing outside it.
    require_line_attribution: true
  - name: plan_criteria_draft_needs_its_grant
    agent: plan
    files:
      include: ["tasks/**/*.md"]
    relevance: an acceptance criterion is about the worker's own draft change request, or a throwaway demonstration change request stacked on it, being opened, pushed to or described
    description: |
      true when the task's own `## Additional info`, above its operational notes, grants
      the worker that draft (that its change request may be published early) or that
      demonstration change request.
    require_line_attribution: true
  - name: plan_criteria_state_properties
    agent: plan
    files:
      include: ["tasks/**/*.md"]
    relevance: the task document has an `## Acceptance criteria` section
    description: |
      true when every acceptance criterion states a property of the finished tree or of
      what the dispatch reports. false when one names a procedure in its place: an exact
      command line that must be run, a sequence of steps to perform, or an act such as
      "the branch publishes" or "the gate is run".
    require_line_attribution: true
  - name: plan_task_names_its_unit
    agent: plan
    files:
      include: ["tasks/**/*.md"]
    relevance: the file opens with front matter carrying a `metadata` object
    description: |
      true when that `metadata` holds an `orchestrator.unit` that is a non-empty string
      naming the unit of the plan the task changes, which the design document groups
      tasks under.
    require_line_attribution: true
  - name: plan_checklist_budgets_have_owners
    agent: plan
    files:
      include: ["projects/**/*.md"]
    relevance: the file opens with front matter listing the plan's `tasks`, and its `orchestrator.plan-budgets` checklist names a budget in an entry's `budget`
    description: |
      true when every budget id a checklist entry names in its `budget` is owned by one of
      the listed tasks, in that task's `orchestrator.budgets` record, and no budget id is
      owned by two tasks.
    require_line_attribution: true
  - name: plan_criteria_require_realistic_tests
    agent: plan
    files:
      include: ["tasks/**/*.md"]
    relevance: the task's acceptance criteria ask for a test or other proof of behaviour
    description: |
      true when every criterion asking for proof of behaviour requires a test that drives
      the real interface the behaviour is reached by, doubling at most a paid, external or
      third-party boundary, and asserts the behaviour itself rather than internal state or
      a snapshot of output.
    require_line_attribution: true
  - name: plan_workload_states_numbers
    agent: plan
    files:
      include: ["tasks/**/*.md", "projects/**/*.md"]
    relevance: the file states a realistic workload, in a plan description's workload or a budget's `workload`
    description: |
      true when every realistic workload the file states gives its scale in numbers: how
      many of what, how often, how large. false when one is stated only in words such as
      "typical", "a few" or "normal use".
    require_line_attribution: true
  - name: plan_ten_x_names_a_covering_budget
    agent: plan
    files:
      include: ["projects/**/*.md"]
    relevance: the description answers what the product owner notices getting worse first at 10x realistic usage
    description: |
      true when the 10x answer names, by id, a budget the plan registers or keeps whose
      figure grows with the effect the answer names.
    require_line_attribution: true
  - name: plan_budget_command_measures_its_figure
    agent: plan
    files:
      include: ["tasks/**/*.md"]
    relevance: the task's budget record registers or changes a budget
    description: |
      true when every budget in the task's record names a `command` that, as the plan
      describes it, produces that budget's `measure`, in its `unit`, at its `workload`.
    require_line_attribution: true
  - name: plan_budget_basis_matches_evidence
    agent: plan
    files:
      include: ["tasks/**/*.md"]
    relevance: the task's budget record holds a budget whose `basis` is `measured`
    description: |
      true when each such budget's `evidence` reports a measurement of its figure at its
      `workload`.
    require_line_attribution: true
  - name: plan_budget_inner_measure_has_reason
    agent: plan
    files:
      include: ["tasks/**/*.md"]
    relevance: the task's budget record registers or changes a budget
    description: |
      true when every budget measures the outermost figure its concern is felt at, or,
      where it measures one step, component or inner process of what the user waits on or
      pays for, gives a non-empty `inner_measure_reason` saying why.
    require_line_attribution: true
  - name: plan_criteria_omit_repo_wide_budgets
    agent: plan
    files:
      include: ["tasks/**/*.md"]
    relevance: the task document has an `## Acceptance criteria` section
    description: |
      true when the task's acceptance criteria name only budgets the task itself registers
      or changes. false when a criterion holds the task to a repository-wide budget it
      does not own, such as the gate's own time or another root budget.
    require_line_attribution: true
  - name: plan_criteria_do_not_restate_budgets
    agent: plan
    files:
      include: ["tasks/**/*.md"]
    relevance: the task's budget record registers or changes a budget
    description: |
      true when no criterion the plan's author wrote repeats what a budget this task owns
      already proves. A criterion opening with a budget's id and the words `is registered
      in` is the one the template derives from the budget record, not an authored one, and
      it is true. false when an authored criterion restates an owned budget's figure, its
      threshold or the workload it holds at.
    require_line_attribution: true

  # The facts a re-declared fragment rule judges, which a plan has to state before that
  # rule has anything to read. Each demands a statement and never restates the fragment
  # rule's invariant, whose one wording stays upstream.
  - name: plan_budget_names_its_telemetry_source
    agent: plan
    files:
      include: ["tasks/**/*.md"]
    relevance: the task's budget record holds a budget whose figure is read from telemetry tests record, by a `source` of `telemetry` or a command that analyses recorded telemetry
    description: |
      true when the task names, for every such budget, the test target or targets whose
      tests record what its command reads (the project and target, or the test tier, that
      runs them, not only test files) and the project whose budgets file registers it.
    require_line_attribution: true
  - name: plan_budget_measurement_is_decided
    agent: plan
    files:
      include: ["tasks/**/*.md"]
    relevance: the task's budget record registers or changes a budget
    description: |
      true when the task states, for every budget it owns, one decided way its figure is
      taken (read from telemetry its tests record, or measured fresh by its command)
      together with any label the budget carries, such as `host`. false when it leaves the
      way to the worker, as an either/or or a "say which".
    require_line_attribution: true
