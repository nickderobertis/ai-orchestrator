<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The only fonts Chromium sees while `scripts/render-diagram.sh` renders a diagram: the
     locked `@expo-google-fonts/noto-sans` package (its TTF files, scanned recursively) `bun.lock` names, and no host font. The path is
     relative to this file, so it resolves into whichever checkout holds it. -->
<fontconfig>
  <dir prefix="relative">../../node_modules/@expo-google-fonts/noto-sans</dir>
</fontconfig>
