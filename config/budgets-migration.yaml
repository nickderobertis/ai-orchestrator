# The plans that predate the budgets requirement, and the one source of which those are.
#
# Every plan states its budgets in a `<project>-budgets` document rendered from the
# `plan-budgets` template (`docs/budgets.md`), and `just check-plan` refuses a plan that
# carries none — unless this list names it. A plan named here is exempt from every refusal
# about its budgets document and held to everything else, and its design document says
# "This plan predates budgets: <reason>" in place of the budget sections.
#
# Adding to this list is a reviewed change to this repository, so a plan cannot exempt
# itself. Each entry is a qualified plan project id and a sentence saying why that plan
# predates the requirement. `orchestrator/plan_budgets.py` reads it, and
# `tests/test_budgets_migration.py` holds it to its shape and compares it with the
# `authoring` source and the `plans` board.
#
# The first entries were taken when the requirement landed: every project the `authoring`
# source held then, and every project on the `plans` board, none of which carried a
# budgets document.

