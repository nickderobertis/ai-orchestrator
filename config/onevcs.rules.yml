# The base every host's onevcs rules are composed over: no rule, and the reviewed default.
#
# A repository declares its own default publication policy in the `[policy]` of the
# `onevcs.toml` at its root — `publication`, `approvals`, and optionally `base_merge`,
# `drafts` and `checks: {wait_seconds}`, each spelled as a rule spells it — and `onevcs`
# reads it from the checkout. A host rule matching the identity overrides that declaration
# field by field, and `default:` below applies to a field neither sets.
#
# This tracked file names no repository. A host's rules live in its overlay,
# `${XDG_CONFIG_HOME:-$HOME/.config}/ai-orchestrator/onevcs.rules.yml`, outside every
# checkout, and only for two reasons: to override what a repository declares, or for a
# repository that declares nothing — every private one among them, declaring its
# `visibility: private` so the host is never asked. `just repos-apply` composes this base
# with that overlay through `onevcs rules apply --base ... --overlay ...` and installs the
# result at `$ONEVCS_HOME/rules.yml` (`~/.onevcs/rules.yml` by default); `onevcs rules
# check <repo>` names the source of each resolved field — a rule, `the repository
# declaration <path>`, or the default — and `docs/host-setup.md` section 7 is how a host
# registers, creates and overrides a repository.
#
# A rule and the default are `{publication, approvals}` plus those optional keys; `gate:`
# went with onevcs 0.11.0 and is refused at `version: 3`. What verifies a change is the
# repository's own merge path — its required checks, or its `pre-push` hook for a
# `local-direct` one — which `just repos --audit-gate-coverage` reports per identity.
version: 3

# The prefix every provenance trailer key on a preserved branch is spelled under.
# `onevcs` writes `Onevcs-` when nothing configures one, but every branch this host
# has preserved — and every recovery attestation already on a base branch here —
# carries `Orchestrator-`, which is the spelling `AGENTS.md` documents. A marker
# written under a prefix the host is not configured with is neither read nor
# ignored: it is reported as unrecognized and refused publication, so leaving this
# unset strands every preserved branch that predates the adoption.
trailer_prefix: Orchestrator-


rules: []

# The policy for a field no rule and no repository declaration sets: reviewed, approved,
# and verified by the host's own required checks. This is `onevcs`'s own built-in
# default, restated so that reading this file tells you what an undeclared repository
# gets. `just repos-apply` fails on any registered checkout whose `publication` or
# `approvals` lands here, because the default is safe but is nobody's configured policy.
default:
  publication: change-open
  approvals: required
