# How a node of this host waits on another repository's release, and for which artifact.
#
# `onevcs` reads this file from `$ONEVCS_HOME/releases.yml` (`~/.onevcs/releases.yml`
# by default); `just repos-apply` installs this tracked copy there beside the rules
# file. Editing *this* file and re-running that recipe is how release adoption changes:
# no command writes this document, and `onevcs release targets <repo>` reports what one
# repository resolves out of it.
#
# A node adopts a dependency `fast` (against its branch, as soon as the change lands)
# or `published` (once the release carrying it exists), decided by the node's own
# `adoption`, then its repository's rule below, then `default:`, then `fast`.
#
#   - `default: adoption: fast` is what `onevcs` answers with no file at all, so a plan
#     against a repository this file does not name runs as it always did.
#
#   - `ai-orchestrator` is `published`, and not as a preference: this identity
#     publishes `local-direct`, and a `fast` node behind an unreleased producer is
#     published as a draft carrying the pin it launched against — which `local-direct`
#     refuses by name, since it opens no change request and would land the pin the
#     draft exists to hold back. So a `fast` node of this repository behind a release
#     could never land; a `published` one waits, then lands the released version.
#
#   - Every other rule names a producer and says which of its targets a consumer naming
#     no `consumes` gets, spelled as that producer's own `release-targets.toml` names it.
#     `declaration: merge` keeps the producer's declaration as the source of its
#     targets, and no rule carries `targets:` of its own, because a target restated
#     here replaces the producer's whole and stops matching it the day it moves. Such a
#     rule is one of two kinds, and `orchestrator/host_installs.py` says which:
#
#       - A producer this host installs, whose `default_target` is the wheel this host
#         installs — a row of `INSTALLED`. `llmlint` is one of them though no `config/`
#         pin governs it: its `cli` is the `llmlint-cli` wheel
#         `scripts/setup-llmlint.sh` installs, and its row names that script in place
#         of a pin.
#
#       - A producer this host installs nothing of, whose `default_target` is the
#         artifact a consumer outside this repository waits on — named in
#         `CONSUMER_DEFAULTS`. `printobserver`'s `github-release` is the program's own
#         release, which lets a `published` node of a `local-direct` repository wait on
#         it with no `consumes`, the field `local-direct` refuses. `privateterms`'
#         `crate` is the specification's Rust crate, which the tools that detect or
#         rewrite private terms build against. `onetaskgraph-ui`'s `npm` is the React
#         component package `onepipeline-ui` installs; it releases with semantic-release
#         and opens no release change request, so its rule names no `release_change`.
#
#   - A producer this host will install but has not yet adopted may carry its rule
#     ahead of its first release, so a node adopting that release waits for the right
#     artifact from the start. `orchestrator/host_installs.py` names each such producer
#     in `AWAITING_FIRST_ADOPTION` until the node adopting it adds its row and pin:
#     `onefollowup`, whose `pypi` is the `onefollowup-cli` wheel.
# `release_change.head` finds the producer's open release change request by its
# release-plz head-branch prefix, so `release holdup` can name its failing checks.
version: 1
default:
  adoption: fast
repositories:
  - match: {host: github.com, owner: nickderobertis, name: ai-orchestrator}
    adoption: published
  - match: {host: github.com, owner: nickderobertis, name: onepipeline}
    release_change: {head: "release-plz-*"}
    declaration: merge
    default_target: npm
  - match: {host: github.com, owner: nickderobertis, name: onevcs}
    release_change: {head: "release-plz-*"}
    declaration: merge
    default_target: pypi
  - match: {host: github.com, owner: nickderobertis, name: oneagentgraph}
    release_change: {head: "release-plz-*"}
    declaration: merge
    default_target: pypi
  - match: {host: github.com, owner: nickderobertis, name: onejudge}
    release_change: {head: "release-plz-*"}
    declaration: merge
    default_target: cli
  - match: {host: github.com, owner: nickderobertis, name: oneharness}
    release_change: {head: "release-plz-*"}
    declaration: merge
    default_target: cli-wheel
  - match: {host: github.com, owner: nickderobertis, name: onetaskgraph}
    release_change: {head: "release-plz-*"}
    declaration: merge
    default_target: pypi
  - match: {host: github.com, owner: nickderobertis, name: onepipeline-ui}
    release_change: {head: "release-plz-*"}
    declaration: merge
    default_target: npm-cli
  - match: {host: github.com, owner: nickderobertis, name: onemessagebus}
    release_change: {head: "release-plz-*"}
    declaration: merge
    default_target: pypi
  - match: {host: github.com, owner: nickderobertis, name: onebudgetspec}
    release_change: {head: "release-plz-*"}
    declaration: merge
    default_target: pypi
  - match: {host: github.com, owner: nickderobertis, name: llmlint}
    release_change: {head: "release-plz-*"}
    declaration: merge
    default_target: cli
  - match: {host: github.com, owner: nickderobertis, name: printobserver}
    release_change: {head: "release-plz-*"}
    declaration: merge
    default_target: github-release
  - match: {host: github.com, owner: nickderobertis, name: privateterms}
    release_change: {head: "release-plz-*"}
    declaration: merge
    default_target: crate
  - match: {host: github.com, owner: nickderobertis, name: onetaskgraph-ui}
    declaration: merge
    default_target: npm
  - match: {host: github.com, owner: nickderobertis, name: onefollowup}
    release_change: {head: "release-plz-*"}
    declaration: merge
    default_target: pypi
