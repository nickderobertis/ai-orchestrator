# How long each remote identity's required checks took, read off GitHub, and the
# `checks: {wait_seconds}` `config/onevcs.rules.yml` sizes from it.
#
# A publication watches its change request's required checks for `wait_seconds`
# before ending `checks-unsettled`; unset, onevcs waits 3600 s. Several identities'
# required checks routinely take longer than that, so a wait sized below what they
# take ends every publication with no verdict and a retry.
# This file is the evidence each rule's wait is sized from.
#
# How it was read, with GET requests only through `gh api`:
#
# - The cutoff is `cutoff:` below: a run counts when it had completed by then.
# - The required checks are the default branch's, read off its rulesets and branch
#   protection, as `just repos --audit-gate-coverage` reports them.
# - A pull-request CI run is a `pull_request` or `pull_request_target` run of a
#   workflow whose jobs report one of those required checks.
# - The sample is the repository's ten most recent such runs completed by the cutoff,
#   across all its CI workflows and ordered by `created_at` (every one where it had
#   fewer), whatever their conclusion — cancelled, failed and re-attempted runs
#   included, none excluded. `runs_used` is how many that was.
# - A run's `seconds` is from its `created_at` to the `completed_at` of the last of
#   its required checks to complete, as the run's jobs list (its latest attempt)
#   reports them, so time queued before a check starts is counted. A re-attempted run
#   (`attempt` above 1) is measured the same way, so its figure includes the time
#   before somebody re-ran it. Where a run's required checks come from a matrix job
#   that ended — skipped by the workflow's own conditions, or cancelled — before its
#   matrix expanded, the jobs list reports that job once, named without the matrix
#   suffix the required checks carry; it is the run's last required check, measured
#   the same way, and `unexpanded` records how it ended.
# - `max_seconds` is the largest figure, from `max_run`. An identity whose
#   `max_seconds`, plus the 25% `margin`, exceeds the 3600 s default carries that
#   figure rounded up to a multiple of 300 s as its rule's `wait_seconds`; any other
#   stays on the default, `wait_seconds: default` here.
#
# `tests/e2e/checks_wait/test_checks_wait_sizing_e2e.py` holds the rules file to this
# record through the installed `onevcs rules check`. Re-measure and re-size together.

