# A stand-in for the release-targets.toml github.com/nickderobertis/onebudgetspec will
# declare at its base, carrying the five target names its plan contracts and nothing a
# probe would run: what a scratch producer identity in a journey of
# scripts/apply-repo-registry.sh declares. The producer has released nothing yet, so it
# has no row in orchestrator/host_installs.py and this copy is not yet held to its real
# declaration by tests/test_host_installs.py's reads_checkouts tier; the node adopting
# its first release adds that row, and the tier then holds this file whole.
schema_version = 1
probe = "scripts/release-probe.sh"

[[target]]
id = "crate:onebudgetspec"
name = "crate"
what = "The crate target of onebudgetspec, as this host's scratch declaration states it."
published_by = "Nothing: this is a journey's stand-in for the producer's declaration."

[[target]]
id = "pypi:onebudgetspec-cli"
name = "pypi"
what = "The pypi target of onebudgetspec, as this host's scratch declaration states it."
published_by = "Nothing: this is a journey's stand-in for the producer's declaration."

[[target]]
id = "npm:@onebudgetspec/cli"
name = "npm"
what = "The npm target of onebudgetspec, as this host's scratch declaration states it."
published_by = "Nothing: this is a journey's stand-in for the producer's declaration."

[[target]]
id = "pypi:onebudgetspec-sdk"
name = "sdk-pypi"
what = "The sdk-pypi target of onebudgetspec, as this host's scratch declaration states it."
published_by = "Nothing: this is a journey's stand-in for the producer's declaration."

[[target]]
id = "npm:@onebudgetspec/sdk"
name = "sdk-npm"
what = "The sdk-npm target of onebudgetspec, as this host's scratch declaration states it."
published_by = "Nothing: this is a journey's stand-in for the producer's declaration."
