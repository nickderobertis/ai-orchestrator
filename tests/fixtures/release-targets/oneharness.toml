# A stand-in for the release-targets.toml github.com/nickderobertis/oneharness declares at its
# base, carrying its target ids and names and nothing a probe would run: what a scratch
# producer identity in a journey of scripts/apply-repo-registry.sh declares. Its target
# ids and names are held whole to the producer's own declaration, in
# tests/test_host_installs.py's reads_checkouts tier.
schema_version = 1
probe = "scripts/release-probe.sh"

[[target]]
id = "crate:oneharness-core"
name = "core"
what = "The core target of oneharness, as this host's scratch declaration states it."
published_by = "Nothing: this is a journey's stand-in for the producer's declaration."

[[target]]
id = "crate:oneharness"
name = "cli-crate"
what = "The cli-crate target of oneharness, as this host's scratch declaration states it."
published_by = "Nothing: this is a journey's stand-in for the producer's declaration."

[[target]]
id = "pypi:oneharness-cli"
name = "cli-wheel"
what = "The cli-wheel target of oneharness, as this host's scratch declaration states it."
published_by = "Nothing: this is a journey's stand-in for the producer's declaration."

[[target]]
id = "pypi:oneharness-sdk"
name = "python-sdk"
what = "The python-sdk target of oneharness, as this host's scratch declaration states it."
published_by = "Nothing: this is a journey's stand-in for the producer's declaration."

[[target]]
id = "npm:oneharness-cli"
name = "cli-npm"
what = "The cli-npm target of oneharness, as this host's scratch declaration states it."
published_by = "Nothing: this is a journey's stand-in for the producer's declaration."

[[target]]
id = "npm:@oneharness/sdk"
name = "node-sdk"
what = "The node-sdk target of oneharness, as this host's scratch declaration states it."
published_by = "Nothing: this is a journey's stand-in for the producer's declaration."
