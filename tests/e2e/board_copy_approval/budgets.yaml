# The board-copy-approval project's budgets: what approving a plan's board copy costs, through
# the real `just approve-design` recipe against the loopback board double holding 2,000 items.
#
# What a copy and an approval spend of the board token's GraphQL allowance is budgeted in the
# plan store that spends it, not here: the adopted onetaskgraph release registers
# `github-plan-copy-points-first`, `github-plan-copy-points-changed`,
# `github-plan-copy-points-unchanged`, `github-plan-copy-content-creations` and
# `github-approval-calls-points` in its `crates/onetaskgraph-github-projects-e2e/budgets.yaml`,
# each measured with write screening on under a synthetic policy. So no copy points, writes or
# approval points budget is registered here: the journeys show every board request these
# recipes send comes from the store calls those budgets measure, and
# `tests/board_copy_quota_handover/test_board_copy_quota_handover.py` reads the adopted release's registration of them.
#
# `plan-approval-seconds` is labelled `host`, so the uncached `budgets-host` target checks it on every check, reading what its uncached
# `test-host` target measured in the same run: a wall clock a cache replayed would be
# another moment's. It is also labelled `host-variable`, so over it warns rather than fails:
# this repository has no CI, and a time target is a gate only where measurement is
# consistent (`scripts/budgets-host.sh`). The command is the one analysis every budget runs
# (`tests/budget_telemetry.py`).
schema_version: 1
budgets:
  - id: plan-approval-seconds
    description: >-
      Seconds a person waits for one `just approve-design` of that plan's board copy: the
      recipe's real elapsed time against the loopback board double, plus, for each request
      the double logged, the GitHub latency the copy-speed spike measured for its kind, each
      store call's requests and latency and that per-kind table in the breakdown.
    labels: [host, host-variable]
    measure: reported
    command: ["uv", "run", "--directory", "../../..", "python", "-m", "tests.budget_telemetry"]
    unit: seconds
    direction: max
    threshold: 7
