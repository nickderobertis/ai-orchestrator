# The `pr-author` drafter's harness config: WHICH harness + model writes the body
# a lifecycle change request opens under. Named by `graphs/pr-author.yaml`'s one
# member, which `onepipeline` runs once per remote publication that states no body
# of its own. See docs/onejudge-integration.md and docs/repo-lifecycle.md.
#
# This is a THIRD copy of the supervisory routing, and it is a separate file for
# the same reason `oneharness.check-in.toml` is: the three sides that share that
# identity order do not share a deadline, and `schema_file` and `stream` below are
# this side's alone. Pointing this member at either of the others would take its
# schema and its deadline away at once.

# run_mode: how the selected harnesses are run. "fallback" tries them in priority
# order and stops at the first that can actually run, falling through only
# harnesses that cannot run at all — see the note in oneharness.toml.
run_mode = "fallback"

# timeout: the per-turn deadline in seconds. Stated rather than inherited, because
# a drafter is a scheduled, bounded job and not a watcher: it reads one branch's
# diff, answers with one body, and exits. It also sits between a passed gate and a
# publication, so a turn with no deadline would hold a verified branch unpublished
# for as long as the run lasts.
#
# What a missed deadline costs is bounded and already handled: a drafting turn that
# does not answer publishes the change request with no body, which is the same
# outcome as naming no drafting graph at all. So this is set generously enough for
# an honest read of a large diff and no more.
timeout = 300

# schema_file: the structured answer every turn is validated against, and what makes
# this a contract rather than a prompt. Relative to THIS file's directory, which is
# oneagentgraph's own resolution rule for the key since 0.2.18 — not the working
# directory, and not the member's scratch.
schema_file = "config/pr-author-body.schema.json"

# schema_max_retries: how many times oneharness re-prompts a turn whose answer does
# not validate. Two, because the failure this absorbs is a model wrapping the body in
# prose or an extra field rather than a model that cannot do the task, and one
# re-prompt with the validation error usually settles it. Past that the run has spent
# more on drafting than the body is worth, and publishing with none is the fallback.
schema_max_retries = 2

# stream = false, and it is not a preference. oneharness validates a structured
# answer against the COMPLETE response, so `stream = true` and `schema_file` cannot
# both hold — `oneagentgraph` refuses the member outright with "a schema run does not
# stream. Drop one of them." Every other side here streams for per-turn visibility;
# this one trades that for the schema, and the schema is the point.
stream = false

# Record this side's runs to disk too; a pinned `--config` skips the user-level
# config.toml, so history must be enabled here.
history = true

# `role` names the SIDE of the conversation, not the persona: the drafter is a
# single-sided agent turn, so telemetry and `just history` treat it as one.
history_labels = { role = "agent" }

# The drafter carries the supervisory order, not the worker's: both Codex identities
# first — deliberately the reverse of oneharness.toml's worker order — then the
# workers' alternate Claude subscriptions in the same relative order the worker uses,
# with the primary Claude identity last. This turn runs after a worker's work is done
# and gates that worker's publication, so it must not queue ahead of the workers still
# doing theirs.
# llmlint: ignore[changed_behavior_has_e2e] tests/e2e/test_oneharness_timeout_e2e.py proves this list against the real CLI's effective configuration; paid-provider quota rejection cannot be deterministic.
harnesses = [
    "codex",
    "codex:alternate",
    "claude-code:alternate",
    "claude-code:alternate2",
    "claude-code:primary",
]

# [harness.<id>]: per-harness overrides. Model names differ per provider, so
# each harness names its own.
# Sol is the flagship tier of the GPT-5.6 family; name it explicitly so the tier
# cannot drift under us.
[harness.codex]
model = "gpt-5.6-sol"

# The second Codex identity. See scripts/codex-alt-home.sh for the indirection.
[harness.codex.variant.alternate]
model = "gpt-5.6-sol"
env_from = { CODEX_HOME = "ORCHESTRATOR_CODEX_ALT_HOME" }
unset_env = ["OPENAI_API_KEY"]

[harness.claude-code]
# IS_SANDBOX lets claude-code run under root without --dangerously-skip-permissions
# refusing; harmless on other harnesses.
env = { IS_SANDBOX = "1" }

# The Claude fallbacks are the same three identities every other role names, with
# the same portable indirections and credential masking.
[harness.claude-code.variant.alternate]
model = "claude-opus-5"
env_from = { CLAUDE_CONFIG_DIR = "ORCHESTRATOR_CLAUDE_ALT_CONFIG_DIR" }
# Subscription auth must not be shadowed by ambient API or OAuth credentials.
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

[harness.claude-code.variant.alternate2]
model = "claude-opus-5"
env_from = { CLAUDE_CONFIG_DIR = "ORCHESTRATOR_CLAUDE_ALT2_CONFIG_DIR" }
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

# The last resort: Claude's default config directory, with every higher-precedence
# credential selector and any inherited alternate directory masked off.
[harness.claude-code.variant.primary]
model = "claude-opus-5"
unset_env = [
    "CLAUDE_CONFIG_DIR",
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

# Inspect the effective, fully layered config (and where each value came from)
# with `oneharness config`.
