# yaml-language-server: $schema=https://raw.githubusercontent.com/nickderobertis/llmlint/main/assets/llmlint.schema.json
#
# The LLM-judge tier — separate from the deterministic `just check` gate.
# Run with `just lint-llm` (or `just lint-llm-diff` for the merge-base
# diff); the diff-scoped run is the blocking PR check, not part of `check`.
# Rules come from the pinned plugins below; tune one in place with
# `override: true`. Bump a plugin's `@version` pin to pull new rules.
files:
  # No `include`: llmlint lints the whole tree (exclude + .gitignore honored).
  # List committed files that shouldn't be judged (lock files, generated output).
  exclude:
    - "**/.git/**"
rationales: true
# No `agents` block: the harness/model are NOT pinned here. `oneharness.toml`
# (composed alongside this file) selects them in fallback mode — codex + gpt-5.5
# primary, claude-code + opus-4.8 secondary — so a Claude Code session falls
# through to claude-code with no config edit. Leaving the harness unset is what
# lets that fallback (or an ONEHARNESS_<FIELD> env override) decide.
plugins:
  - "https://raw.githubusercontent.com/nickderobertis/llmlint/main/assets/config_lint.yml@1"
  - "https://raw.githubusercontent.com/nickderobertis/dero-skills/main/skills/bootstrap/create-repo/assets/llmlint/base.llmlint.yml@1"
  - "https://raw.githubusercontent.com/nickderobertis/dero-skills/main/skills/bootstrap/create-repo/assets/llmlint/shapes/skills-repo.llmlint.yml@1"
  - "https://raw.githubusercontent.com/nickderobertis/dero-skills/main/skills/bootstrap/create-repo/assets/llmlint/languages/python.llmlint.yml@1"
  - "https://raw.githubusercontent.com/nickderobertis/dero-skills/main/skills/bootstrap/create-repo/assets/llmlint/languages/bash.llmlint.yml@1"
  - "https://raw.githubusercontent.com/nickderobertis/dero-skills/main/skills/bootstrap/create-repo/assets/llmlint/ci.llmlint.yml@1"

# Statically disable a plugin rule that cannot apply to this repo. This is a
# synchronous CLI orchestration harness: every module shells out to git/gh/onejudge via
# subprocess by design (and the e2e suite drives real git/subprocess), with no async
# server context and no typed client for an external process. `relevance: false` marks
# `async_typed_clients_at_boundaries` not-relevant repo-wide instead of re-suppressing it
# per file across every module it touches.
rules:
  - name: orchestration_contract_changes_update_docs
    relevance: >-
      The diff changes observable planner/operator behavior in the just command
      surface, planner-orchestrator channel or live-edit protocol, graph round or
      replan semantics, status/exit behavior, or documented repo-lifecycle policy.
    description: >-
      The diff updates the corresponding durable operator documentation in
      AGENTS.md, docs/orchestration.md, or docs/repo-lifecycle.md so a planner or
      operator would not find the docs stale or wrong.
    files:
      include:
        - "justfile"
        - "orchestrator/channel.py"
        - "orchestrator/edits.py"
        - "orchestrator/graph.py"
        - "orchestrator/plan.py"
        - "orchestrator/next_round.py"
        - "orchestrator/replan.py"
        - "orchestrator/runs.py"
        - "orchestrator/lifecycle.py"
        - "orchestrator/recover.py"
        - "orchestrator/merge.py"
        - "orchestrator/registry.py"
        - "AGENTS.md"
        - "docs/orchestration.md"
        - "docs/repo-lifecycle.md"
  - name: async_typed_clients_at_boundaries
    override: true
    relevance: false
