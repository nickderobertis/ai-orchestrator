# Judge / simulated-user side of the onejudge conversation: WHICH harness + model
# supervises the work and scores the transcript. Referenced by
# `config/onejudge.base.yaml`'s `provider.judge_config`. Scaffolded by
# `onejudge init` (`oneharness init oneharness.judge.toml`) and then customized:
# the supervisor uses a cheaper model than the agent, and the IS_SANDBOX env.

# run_mode: how the selected harnesses are run.
#   "parallel" (default) runs them all at once and reports each.
#   "fallback" tries them in priority order and stops at the first that can
#   actually run, falling through only harnesses that cannot run at all (not
#   installed, unspawnable, or an auth/quota rejection) — so one committed file
#   works wherever a given harness happens to be authenticated.
run_mode = "fallback"

# Record judge-side runs to disk too (see the note in oneharness.toml); onejudge's
# `--config` for this file skips the user-level config.toml, so enable it here.
history = true

# history_labels: the counterpart to the agent config's `role = "agent"` — this is
# the side that supervises. Stamping it makes "show me the judge's view of this
# node" a filter rather than a guess from the session name (`JUDGE_PREFIXES`).
history_labels = { role = "judge", agent_role = "judge" }

# The supervisor stays on codex, and a second Codex identity absorbs an exhausted
# quota before the chain leaves the provider at all. Past that it now reaches the
# workers' alternate Claude subscriptions before the primary one — the operator's
# deliberate trade: a supervisor that can still run beats a supervisor isolated
# from the workers' quota, since a dispatch is dead without its judge either way.
# llmlint: ignore[changed_behavior_has_e2e] integration tests exercise real oneharness fallback selection; paid-provider auth rejection cannot be deterministic.
harnesses = [
    "codex:primary",
    "codex:alternate",
    "claude-code:alternate",
    "claude-code:alternate2",
    "claude-code:primary",
]

# [harness.<id>]: per-harness overrides. Model names differ per provider, so
# each harness names its own.
# Match the agent side's GPT-5.6 Sol (named explicitly so the tier can't drift); the
# cheaper-supervisor intent lives in the claude-code fallback (sonnet-5 vs opus) below.
[harness.codex]
model = "gpt-5.6-sol"

# A variant rather than the bare `codex`, so the environment rules below reach it; no
# `unset_env` for `CODEX_HOME`, which this identity honours. AGENTS.md says why.
[harness.codex.variant.primary]
model = "gpt-5.6-sol"
# A dispatched turn's runtime directory is the node's own scratch rather than the
# launching session's, which on this host is mounted `noexec` and so fails every
# shebang recipe `just` writes under `XDG_RUNTIME_DIR`. scripts/node-scratch-dir.sh
# supplies the indirection to a caller that is not a dispatch, because oneharness
# refuses a variant whose `env_from` source is unset.
env_from = { XDG_RUNTIME_DIR = "ONEPIPELINE_NODE_SCRATCH_DIR" }
# The board credential is the plan store's and this role never reaches the store, so
# it stops here rather than travelling to the provider. The board *nomination* is left
# travelling on purpose: a live lane handed the owner, number and repository but no
# token skips and says why, where one handed nothing cannot tell a misconfigured lane
# from a deliberate one.
unset_env = ["GH_PROJECTS_TOKEN"]

# The second Codex identity; held identical to oneharness.toml's by
# tests/test_harness_routing.py, since one drifted copy would silently change how
# a role authenticates. See scripts/codex-alt-home.sh for the indirection.
[harness.codex.variant.alternate]
model = "gpt-5.6-sol"
env_from = { CODEX_HOME = "ORCHESTRATOR_CODEX_ALT_HOME", XDG_RUNTIME_DIR = "ONEPIPELINE_NODE_SCRATCH_DIR" }
unset_env = ["OPENAI_API_KEY", "GH_PROJECTS_TOKEN"]

[harness.claude-code]
# IS_SANDBOX lets claude-code run under root without --dangerously-skip-permissions
# refusing; harmless on other harnesses.
env = { IS_SANDBOX = "1" }

# The three Claude identities carry the same routing as every other role's — held
# byte-identical by tests/test_harness_routing.py — and differ only in `model`:
# this side stays on the cheaper supervisor tier wherever it lands.
[harness.claude-code.variant.alternate]
model = "claude-sonnet-5" # a cheaper supervisor keeps loop overhead down
env_from = { CLAUDE_CONFIG_DIR = "ORCHESTRATOR_CLAUDE_ALT_CONFIG_DIR", XDG_RUNTIME_DIR = "ONEPIPELINE_NODE_SCRATCH_DIR" }
# Subscription auth must not be shadowed by ambient API or OAuth credentials.
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
    "GH_PROJECTS_TOKEN",
]

[harness.claude-code.variant.alternate2]
model = "claude-sonnet-5" # a cheaper supervisor keeps loop overhead down
env_from = { CLAUDE_CONFIG_DIR = "ORCHESTRATOR_CLAUDE_ALT2_CONFIG_DIR", XDG_RUNTIME_DIR = "ONEPIPELINE_NODE_SCRATCH_DIR" }
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
    "GH_PROJECTS_TOKEN",
]

[harness.claude-code.variant.primary]
model = "claude-sonnet-5" # a cheaper supervisor keeps loop overhead down
# Claude's default config directory is the primary subscription. Mask every
# higher-precedence credential selector and any inherited alternate directory.
unset_env = [
    "CLAUDE_CONFIG_DIR",
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
    "GH_PROJECTS_TOKEN",
]
# The same runtime-directory repoint as above, for this identity.
env_from = { XDG_RUNTIME_DIR = "ONEPIPELINE_NODE_SCRATCH_DIR" }

# Inspect the effective, fully layered config (and where each value came from)
# with `oneharness config`.
