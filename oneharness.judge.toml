# Judge / simulated-user side of the onejudge conversation: WHICH harness + model
# supervises the work and scores the transcript. Referenced by
# `config/onejudge.base.yaml`'s `provider.judge_config`.
#
# The six identities are stated once in `oneharness.identities.toml` and the
# dispatched side's `XDG_RUNTIME_DIR` repoint in `oneharness.dispatch.toml`. What is
# this role's own: its chain order, its labels, and the cheaper model tier its Claude
# identities run on.
extends = "oneharness.dispatch.toml"

# history_labels: the counterpart to the agent config's `role = "agent"` — this is
# the side that supervises. Stamping it makes "show me the judge's view of this
# node" a filter rather than a guess from the session name (`JUDGE_PREFIXES`).
# Both keys are this host's own, and neither is a name the engine stamps: the six
# `onepipeline.*` keys a dispatch inherits name the run, project, scope, node, step and
# attempt, none of which distinguishes one side of a conversation from the other.
# `agent_role` is beside `role` because the telemetry lane reader keys on that one.
history_labels = { role = "judge", agent_role = "judge" }

# The supervisor stays on codex, and a second Codex identity absorbs an exhausted
# quota before the chain leaves the provider at all. Past that it now reaches the
# workers' alternate Claude subscriptions before the primary one — the operator's
# deliberate trade: a supervisor that can still run beats a supervisor isolated
# from the workers' quota, since a dispatch is dead without its judge either way.
# llmlint: ignore[changed_behavior_has_e2e] integration tests exercise real oneharness fallback selection; paid-provider auth rejection cannot be deterministic.
harnesses = [
    "codex:primary",
    "codex:alternate",
    "claude-code:alternate",
    "claude-code:alternate2",
    "claude-code:primary-backup",
    "claude-code:primary",
]

# The cheaper supervisor tier, and the one thing this role changes about the
# identities themselves. Codex matches the agent side's GPT-5.6 Sol, inherited
# unchanged; the cheaper-supervisor intent lives here, in the Claude identities, which
# run Sonnet where the worker runs Opus.
#
# Restates `unset_env` because it names `model`: the mask is inherited correctly, but
# `oneharness config` reports an inherited one as `[]` once the child mentions the
# variant, and these lines keep that report true. `oneharness.dispatch.toml` says why.
[harness.claude-code.variant.alternate]
model = "claude-sonnet-5"
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
    "GH_PROJECTS_TOKEN",
]

[harness.claude-code.variant.alternate2]
model = "claude-sonnet-5"
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
    "GH_PROJECTS_TOKEN",
]

[harness.claude-code.variant.primary-backup]
model = "claude-sonnet-5"
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
    "GH_PROJECTS_TOKEN",
]

[harness.claude-code.variant.primary]
model = "claude-sonnet-5"
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
    "GH_PROJECTS_TOKEN",
]

# The board credential is the plan store's and this role never reaches the store, so it
# stops here rather than travelling to the provider. Stated per role rather than in the
# shared parent because it is a per-role policy and a parent's mask is one no child can
# remove — `oneharness.identities.toml` says so at this same variant. The board
# *nomination* is left travelling on purpose: a live lane handed the owner, number and
# repository but no token skips and says why, where one handed nothing cannot tell a
# misconfigured lane from a deliberate one.
[harness.codex.variant.primary]
unset_env = ["GH_PROJECTS_TOKEN"]
