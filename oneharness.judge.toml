# Judge / simulated-user side of the onejudge conversation: WHICH harness + model
# supervises the work and scores the transcript.
#
# Referenced by `config/onejudge.base.yaml`'s `provider.judge_config` and passed to
# `oneharness run --config`. This is the file `onejudge init` scaffolds via
# `oneharness init oneharness.judge.toml`; hand-maintained here for the same reason
# as `oneharness.toml`.
#
# The supervisor does not need the strongest coding model — a capable, cheaper
# model keeps the loop's overhead down. Adjust to taste (or via ONEHARNESS_* env).
run_mode = "fallback"
harnesses = ["codex", "claude-code"]

[harness.codex]
model = "gpt-5.5"

[harness.claude-code]
model = "claude-sonnet-5"
env = { IS_SANDBOX = "1" }
