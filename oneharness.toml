# Agent side of the onejudge conversation: WHICH harness + model does the work.
# Scaffolded by `onejudge init` (`oneharness init oneharness.toml`) and then
# customized (the IS_SANDBOX env below). oneharness discovers it by walking up
# from the working directory, so it stays at the repo root. See
# docs/onejudge-integration.md.

# run_mode: how the selected harnesses are run. Set explicitly, so this file reads
# the same under any oneharness release: since 0.15.0 an unset run_mode resolves to
# "fallback" and "parallel" is the opt-in, where earlier releases defaulted the
# other way.
#   "parallel" runs them all at once and reports each.
#   "fallback" tries them in priority order and stops at the first that can
#   actually run, falling through only harnesses that cannot run at all (not
#   installed, unspawnable, or an auth/quota rejection) — so one committed file
#   works wherever a given harness happens to be authenticated.
run_mode = "fallback"

# Record a normalized cross-harness transcript of every run to disk (viewable with
# `oneharness history`). onejudge pins this file via `--config`, which skips the
# user-level config.toml — so history must be enabled HERE (or via ONEHARNESS_HISTORY)
# to capture dispatched runs, not just in a user config.
history = true

# history_labels: labels stamped on every history entry this config records. The
# two sides of an onejudge conversation are both recorded, into the same store, by
# the same tool — so without a stamp saying which side a session *is*, the only way
# to tell the worker from its supervisor is `JUDGE_PREFIXES`, guessing from the
# session name. This states it. A dispatch layers its graph labels (run/round/node)
# over these via ONEHARNESS_HISTORY_LABELS; the role is the constant, so it belongs
# in the config rather than at each call site.
history_labels = { role = "agent" }

# Every role's chain names the same six identities; only the order differs. The
# worker keeps Claude first, because the personas are tuned against that model
# tier: an exhausted alternate subscription reaches the SECOND alternate Claude
# plan before it degrades to Codex. Codex and its second identity follow, then the
# primary-backup Claude subscription, and the primary Claude subscription is the
# last resort everywhere.
# llmlint: ignore[changed_behavior_has_e2e] integration tests exercise real oneharness fallback selection; paid-provider quota rejection cannot be deterministic.
harnesses = [
    "claude-code:alternate",
    "claude-code:alternate2",
    "codex:primary",
    "codex:alternate",
    "claude-code:primary-backup",
    "claude-code:primary",
]

# [harness.<id>]: per-harness overrides. Model names differ per provider, so
# each harness names its own.
# Sol is the flagship tier of the GPT-5.6 family (Sol > Terra > Luna); `gpt-5.6`
# aliases to it, but name it explicitly so the tier can't drift under us.
[harness.codex]
model = "gpt-5.6-sol"

# A variant rather than the bare `codex`, so the environment rules below reach it; no
# `unset_env` for `CODEX_HOME`, which this identity honours. AGENTS.md says why.
[harness.codex.variant.primary]
model = "gpt-5.6-sol"
# A dispatched turn's runtime directory is the node's own scratch rather than the
# launching session's, which on this host is mounted `noexec` and so fails every
# shebang recipe `just` writes under `XDG_RUNTIME_DIR`. scripts/node-scratch-dir.sh
# supplies the indirection to a caller that is not a dispatch, because oneharness
# refuses a variant whose `env_from` source is unset.
env_from = { XDG_RUNTIME_DIR = "ONEPIPELINE_NODE_SCRATCH_DIR" }
# The board credential is the plan store's and this role never reaches the store, so
# it stops here rather than travelling to the provider. The board *nomination* is left
# travelling on purpose: a live lane handed the owner, number and repository but no
# token skips and says why, where one handed nothing cannot tell a misconfigured lane
# from a deliberate one.
unset_env = ["GH_PROJECTS_TOKEN"]

# The second Codex identity, reached only after the first one's quota is gone.
# scripts/codex-alt-home.sh derives this non-secret path from HOME for every
# dispatch and guarantees the directory exists; env_from maps it to CODEX_HOME in
# only this child, so — unlike a literal /home/... value — the committed config is
# machine-independent. A host that never authenticated a second Codex account
# leaves that directory empty, which oneharness classifies as `auth` and falls
# through, so this candidate costs nothing until it is logged in.
[harness.codex.variant.alternate]
model = "gpt-5.6-sol"
env_from = { CODEX_HOME = "ORCHESTRATOR_CODEX_ALT_HOME", XDG_RUNTIME_DIR = "ONEPIPELINE_NODE_SCRATCH_DIR" }
# Subscription auth must not be shadowed by an ambient API key: `codex login`
# writes ChatGPT tokens into the alternate home, and OPENAI_API_KEY would outrank
# them and silently bill the wrong account.
unset_env = ["OPENAI_API_KEY", "GH_PROJECTS_TOKEN"]

[harness.claude-code]
# IS_SANDBOX lets claude-code run under root without --dangerously-skip-permissions
# refusing; harmless on other harnesses.
env = { IS_SANDBOX = "1" }

[harness.claude-code.variant.alternate]
model = "claude-opus-5"
# scripts/claude-alt-config-dir.sh derives this non-secret path from HOME for
# every wrapper. env_from maps it to the Claude-specific name in only this child;
# unlike a literal /home/... value, the committed config is machine-independent.
env_from = { CLAUDE_CONFIG_DIR = "ORCHESTRATOR_CLAUDE_ALT_CONFIG_DIR", XDG_RUNTIME_DIR = "ONEPIPELINE_NODE_SCRATCH_DIR" }
# Subscription auth must not be shadowed by ambient API or OAuth credentials.
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
    "GH_PROJECTS_TOKEN",
]

# The second alternate Claude subscription, reached when the first one's quota is
# gone. It is credentialed from its own config directory, derived by the same one
# helper; a host that never authenticated it reports `failure_kind: "auth"` and
# falls through, so the candidate costs nothing until `claude login` runs against
# that directory. tests/e2e/test_oneharness_timeout_e2e.py holds every config's
# chain as the real CLI resolves it.
[harness.claude-code.variant.alternate2]
model = "claude-opus-5"
env_from = { CLAUDE_CONFIG_DIR = "ORCHESTRATOR_CLAUDE_ALT2_CONFIG_DIR", XDG_RUNTIME_DIR = "ONEPIPELINE_NODE_SCRATCH_DIR" }
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
    "GH_PROJECTS_TOKEN",
]

# The primary-backup subscription, reached just before the primary one. It is
# credentialed from the directory scripts/claude-alt-config-dir.sh resolves into
# ORCHESTRATOR_CLAUDE_PRIMARY_BACKUP_CONFIG_DIR, which is that helper's to default; a
# host that never logged it in reports `failure_kind: "auth"` and falls through, so the
# candidate costs nothing until then.
[harness.claude-code.variant.primary-backup]
model = "claude-opus-5"
env_from = { CLAUDE_CONFIG_DIR = "ORCHESTRATOR_CLAUDE_PRIMARY_BACKUP_CONFIG_DIR", XDG_RUNTIME_DIR = "ONEPIPELINE_NODE_SCRATCH_DIR" }
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
    "GH_PROJECTS_TOKEN",
]

# The last resort in every chain: the primary subscription, credentialed from the
# directory scripts/claude-alt-config-dir.sh resolves into
# ORCHESTRATOR_CLAUDE_PRIMARY_CONFIG_DIR, which is that helper's to default. Every
# higher-precedence credential selector is masked, so this identity can never run as
# another account.
[harness.claude-code.variant.primary]
model = "claude-opus-5"
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
    "GH_PROJECTS_TOKEN",
]
# Its config directory, and the same runtime-directory repoint as above.
env_from = { CLAUDE_CONFIG_DIR = "ORCHESTRATOR_CLAUDE_PRIMARY_CONFIG_DIR", XDG_RUNTIME_DIR = "ONEPIPELINE_NODE_SCRATCH_DIR" }

# Inspect the effective, fully layered config (and where each value came from)
# with `oneharness config`.
