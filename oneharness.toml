# Agent side of the onejudge conversation: WHICH harness + model does the work.
# oneharness discovers this file by walking up from the working directory, so it stays
# at the repo root under this exact name. See docs/onejudge-integration.md.
#
# The six identities it routes over — their variants, models, credential masks and
# environment indirections — are stated once in `oneharness.identities.toml`, and the
# dispatched side's `XDG_RUNTIME_DIR` repoint in `oneharness.dispatch.toml`. What is
# left here is what is really a decision about THIS role: its chain order and its
# history label.
extends = "oneharness.dispatch.toml"

# history_labels: labels stamped on every history entry this config records. The
# two sides of an onejudge conversation are both recorded, into the same store, by
# the same tool — so without a stamp saying which side a session *is*, the only way
# to tell the worker from its supervisor is `JUDGE_PREFIXES`, guessing from the
# session name. This states it.
#
# **`role` is this host's own key and the engine stamps nothing like it.** What a
# dispatch inherits through ONEHARNESS_HISTORY_LABELS is the engine's six
# `onepipeline.*` keys — the run, the project, the scope, the node, the step and the
# attempt — which say *where in the graph* a session was opened and nothing about which
# side of the conversation opened it. The engine strips only its own prefix from the
# value it inherited, so this key stands beside them untouched;
# `orchestrator/labels.py` is where that boundary is written down and
# `tests/test_engine_history_vocabulary.py` holds the engine's half of it to the pinned
# release. The role is the constant, so it belongs in the config rather than at each
# call site.
history_labels = { role = "agent" }

# Every role's chain names the same six identities; only the order differs. The
# worker keeps Claude first, because the personas are tuned against that model
# tier: an exhausted alternate subscription reaches the SECOND alternate Claude
# plan before it degrades to Codex. Codex and its second identity follow, then the
# primary-backup Claude subscription, and the primary Claude subscription is the
# last resort everywhere.
# llmlint: ignore[changed_behavior_has_e2e] integration tests exercise real oneharness fallback selection; paid-provider quota rejection cannot be deterministic.
harnesses = [
    "claude-code:alternate",
    "claude-code:alternate2",
    "codex:primary",
    "codex:alternate",
    "claude-code:primary-backup",
    "claude-code:primary",
]

# Inspect the effective, fully layered config (and where each value came from)
# with `oneharness config`.

# **One shell command may run for an hour, on both harnesses**, so a worker runs a long
# check as one command and is held only to finishing it inside its turn
# (`templates/dispatch-appendix.md`). Two roles carry it: this file, the node-scope
# worker's agent side, and `oneharness.follow-up.toml`. Both settings sit at the harness
# level, never on a variant, as `oneharness.dispatch.toml` explains; docs/onejudge-integration.md
# has the merge rules and the real turns that proved it.
#
# Claude Code: `BASH_MAX_TIMEOUT_MS` is the ceiling on the `timeout` one Bash tool call
# may ask for. `BASH_DEFAULT_TIMEOUT_MS` is deliberately left unset, so the model asks for
# a long timeout and a hung command does not block for an hour by default.
[harness.claude-code]
env = { BASH_MAX_TIMEOUT_MS = "3600000" }

# Codex: `background_terminal_max_timeout` bounds how long ONE `write_stdin` poll waits
# on a running `exec_command` process — not the process's lifetime, so a long command is
# one `exec_command` plus one wait of up to an hour. Passed as
# a `[harness.codex]` argument rather than a trailing passthrough, which would reach
# Claude Code as `--continue` (`oneharness.llmlint.toml` says why).
[harness.codex]
args = ["-c", "background_terminal_max_timeout=3600000"]

# The plan store's credentials — the board token and the Linear key — are the store's,
# and this role never reaches the store, so they stop here rather than travelling to the provider. Stated per role rather than in the
# shared parent because it is a per-role policy and a parent's mask is one no child can
# remove — `oneharness.identities.toml` says so at this same variant. The board
# *nomination* is left travelling on purpose: a live lane handed the owner, number and
# repository but no token skips and says why, where one handed nothing cannot tell a
# misconfigured lane from a deliberate one.
[harness.codex.variant.primary]
unset_env = ["GH_PROJECTS_TOKEN", "HELLOPATIENT_LINEAR_API_KEY"]
