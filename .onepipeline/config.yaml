# This repository's shared `human_items` defaults: what every host that checks it out
# reads, the engine's own two-layer configuration (onepipeline's `docs/contract.md`,
# **Human items**), overridden key by key by the host-local file `ONEPIPELINE_CONFIG`
# names, else `onepipeline/config.yaml` under the user's configuration directory.
# `just human-items config` prints the effective settings and the files they came from.
#
# One phase hook, and no host code beyond the thin command that raises it. A plan's design
# review is not a hook: it is the planning run's own `approve-design` human node
# (`templates/planning/`), which `just approve-design` attests.
#
#   * `follow-up-review` — a follow-up run's closeout raises it over every ticket the run
#     created or updated; the engine's `ticket_review` aggregation derives its priority,
#     groups the links, and retires it when there are none. It holds nothing.
#
# Human items are on for every host of this repository: the item store, holds, the CLI, the
# browser's Action items page, and each task's projection into `human-public`, the shared
# human-task source `onetaskgraph.yaml` declares. The store routes a task from there by the
# repositories it names — the engine files a plan-owned task with its plan's repositories and a
# link back to the plan — so public own-account work stays on `human-public`, and private or
# mixed work, or an organization's, goes where the host's user layer routes it
# (`config/onetaskgraph.user-layer.example.yaml`). A host with no such route has a private
# task refused, never written publicly. Each destination's `task_projection` is host-local too,
# so a host that declares none projects nothing. The engine's own default stays off, and a host
# turns human items off for itself in its host-local file.
human_items:
  enabled: true
  task_source: human-public
  hooks:
    - phase: follow-up-review
      kind: task
      title: "Accept or defer the follow-up tickets from {{ run }}"
      body: "Move each ticket to Todo to accept it or Deferred to defer it."
      priority: low
      block: {scope: nothing}
      aggregate: ticket_review
