# The design-doc REVIEWER's harness config: WHICH harness + model supervises the writer
# and holds the finished document to `config/design-doc-template.md`. Named by
# `graphs/design-doc.yaml`'s `worker` member as its **judge** side. See
# docs/onejudge-integration.md.
#
# This is the half of the reversal that motivates it. Every other pairing on this host
# puts Claude on the side that works and Codex on the side that supervises; here the
# supervisor is judging whether prose reads plainly to a non-specialist, so the Claude
# subscriptions lead this side and `oneharness.design-doc.toml` leads with Codex. It is
# also the one supervisory side off the cheaper tier, because this review *is* the
# deliverable's quality bar — so its Claude identities keep the Opus tier
# `oneharness.identities.toml` states, where `oneharness.judge.toml` drops to Sonnet.
#
# It extends `oneharness.identities.toml` rather than `oneharness.dispatch.toml`: the
# design-document pair is launched by `just plan` rather than inside a node's dispatch,
# so there is no node scratch directory for the runtime-directory repoint to point at.
# tests/e2e/test_oneharness_timeout_e2e.py reads both sides back from the real CLI.
extends = "oneharness.identities.toml"

# timeout: the per-turn deadline in seconds. Stated rather than inherited, for the
# reason the writer's is: this role is a bounded job, so the unbounded default would
# only ever mean a wedged turn that never ends. Shorter than the writer's because the
# turns are not the same size — a reviewer reads one document and answers, where the
# writer reads a whole plan and composes one — and still well clear of that reading.
timeout = 600

# `role` names the SIDE of the conversation: this is the side that supervises, and
# `oneharness.judge.toml` states it the same way so telemetry and `just history` treat
# the two as one kind of session.
# Neither key is one the engine stamps: the six `onepipeline.*` keys a dispatch inherits
# name the run, project, scope, node, step and attempt, and none of them says which side
# of a conversation a session is. See `orchestrator/labels.py`.
history_labels = { role = "judge", agent_role = "judge" }

# Both alternate Claude subscriptions first, in the worker's own relative order — the
# reverse of every other supervisory chain on this host, and the whole point of this
# role having its own pair of files. Past them it reaches both Codex identities rather
# than stopping, because every role names all six identities and a role that omitted
# one would lose that quota entirely once everything ahead of it was exhausted. The
# primary Claude identity is last here as it is everywhere.
# llmlint: ignore[changed_behavior_has_e2e] tests/e2e/test_oneharness_timeout_e2e.py proves this list against the real CLI's effective configuration; paid-provider quota rejection cannot be deterministic.
harnesses = [
    "claude-code:alternate",
    "claude-code:alternate2",
    "codex:primary",
    "codex:alternate",
    "claude-code:primary-backup",
    "claude-code:primary",
]

# **Each variant below restates a whole `unset_env` to leave `GH_PROJECTS_TOKEN`
# travelling, which is this role's whole point** — it supervises a turn whose task reads the plan out of the store. A child replaces the parent's
# mask only with a non-empty list, so "the parent's mask minus one name" is written by
# stating what remains. Do NOT fold these into `oneharness.identities.toml`: each is
# the parent's list with the board credential taken out.
# No `unset_env`: its parent states none either, precisely so this role can leave the
# board credential travelling. An empty list would not help — it inherits rather than
# clears.
[harness.codex.variant.primary]
model = "gpt-5.6-sol"

[harness.codex.variant.alternate]
unset_env = ["OPENAI_API_KEY"]

[harness.claude-code.variant.alternate]
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

[harness.claude-code.variant.alternate2]
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

[harness.claude-code.variant.primary-backup]
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

[harness.claude-code.variant.primary]
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]
