# The design-doc REVIEWER's harness config: WHICH harness + model supervises the writer
# and holds the finished document to `config/design-doc-template.md`. Named by
# `graphs/design-doc.yaml`'s `worker` member as its **judge** side. See
# docs/onejudge-integration.md.
#
# This is the half of the reversal that motivates it. Every other pairing on this host
# puts Claude on the side that works and Codex on the side that supervises; here the
# supervisor is judging whether prose reads plainly to a non-specialist, so the Claude
# subscriptions lead this side and `oneharness.design-doc.toml` leads with Codex.
#
# It is a separate file for the reason every copy of this routing is: the sides that
# share an identity order do not share a deadline, and pointing this member at
# `oneharness.judge.toml` would take this side's own deadline and its model tier away at
# once. tests/e2e/test_oneharness_timeout_e2e.py reads both back from the real CLI.

# run_mode: how the selected harnesses are run. "fallback" tries them in priority
# order and stops at the first that can actually run, falling through only
# harnesses that cannot run at all — see the note in oneharness.toml.
run_mode = "fallback"

# timeout: the per-turn deadline in seconds. Stated rather than inherited, for the
# reason the writer's is: this role is a bounded job, so the unbounded default would
# only ever mean a wedged turn that never ends. Shorter than the writer's because the
# turns are not the same size — a reviewer reads one document and answers, where the
# writer reads a whole plan and composes one — and still well clear of that reading.
timeout = 600

# Record this side's runs to disk too; a pinned `--config` skips the user-level
# config.toml, so history must be enabled here.
history = true

# `role` names the SIDE of the conversation: this is the side that supervises, and
# `oneharness.judge.toml` states it the same way so telemetry and `just history` treat
# the two as one kind of session.
history_labels = { role = "judge", agent_role = "judge" }

# Both alternate Claude subscriptions first, in the worker's own relative order — the
# reverse of every other supervisory chain on this host, and the whole point of this
# role having its own pair of files. Past them it reaches both Codex identities rather
# than stopping, because every role names all five identities and a role that omitted
# one would lose that quota entirely once everything ahead of it was exhausted. The
# primary Claude identity is last here as it is everywhere.
# llmlint: ignore[changed_behavior_has_e2e] tests/e2e/test_oneharness_timeout_e2e.py proves this list against the real CLI's effective configuration; paid-provider quota rejection cannot be deterministic.
harnesses = [
    "claude-code:alternate",
    "claude-code:alternate2",
    "codex",
    "codex:alternate",
    "claude-code:primary",
]

# [harness.<id>]: per-harness overrides. Model names differ per provider, so
# each harness names its own.
# Sol is the flagship tier of the GPT-5.6 family; name it explicitly so the tier
# cannot drift under us.
[harness.codex]
model = "gpt-5.6-sol"

# The second Codex identity. See scripts/codex-alt-home.sh for the indirection.
[harness.codex.variant.alternate]
model = "gpt-5.6-sol"
env_from = { CODEX_HOME = "ORCHESTRATOR_CODEX_ALT_HOME" }
unset_env = ["OPENAI_API_KEY"]

[harness.claude-code]
# IS_SANDBOX lets claude-code run under root without --dangerously-skip-permissions
# refusing; harmless on other harnesses.
env = { IS_SANDBOX = "1" }

# The three Claude identities carry the same routing every other role names, with the
# same portable indirections and credential masking. They do NOT carry
# `oneharness.judge.toml`'s cheaper supervisor tier: that file trades review depth for
# loop overhead across every dispatch on this host, and this side exists because the
# review here IS the deliverable's quality bar — whether a document reads plainly to a
# non-specialist is the judgment this role was given its own pairing to get.
[harness.claude-code.variant.alternate]
model = "claude-opus-5"
env_from = { CLAUDE_CONFIG_DIR = "ORCHESTRATOR_CLAUDE_ALT_CONFIG_DIR" }
# Subscription auth must not be shadowed by ambient API or OAuth credentials.
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

[harness.claude-code.variant.alternate2]
model = "claude-opus-5"
env_from = { CLAUDE_CONFIG_DIR = "ORCHESTRATOR_CLAUDE_ALT2_CONFIG_DIR" }
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

# The last resort: Claude's default config directory, with every higher-precedence
# credential selector and any inherited alternate directory masked off.
[harness.claude-code.variant.primary]
model = "claude-opus-5"
unset_env = [
    "CLAUDE_CONFIG_DIR",
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

# Inspect the effective, fully layered config (and where each value came from)
# with `oneharness config`.
