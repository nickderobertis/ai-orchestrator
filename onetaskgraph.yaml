default_sources: [authoring, examples, plans, plans-local, test-fixtures]
sources:
  examples:
    plugin: local-md
    config:
      root: examples
  authoring:
    plugin: local-md
    config:
      root: .plans
  test-fixtures:
    plugin: local-md
    config:
      root: /tmp/ai-orchestrator-test-projects
  plans-local:
    plugin: local-md
    config:
      root: .plans-local
  plans:
    plugin: github-projects
    config:
      owner: nickderobertis
      project_number: 2
      repository: nickderobertis/ai-orchestrator
      token_env: GH_PROJECTS_TOKEN
