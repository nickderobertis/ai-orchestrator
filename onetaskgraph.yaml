default_sources: [authoring, examples, plans, hellopatient, test-fixtures]
sources:
  examples:
    plugin: local-md
    config:
      root: examples
  authoring:
    plugin: local-md
    config:
      root: .plans
  drafts:
    plugin: local-md
    config:
      root: .follow-ups
  test-fixtures:
    plugin: local-md
    config:
      # This suite's own launchable projects. Rooted relatively and gitignored, beside
      # the two above, because every test process states a temporary root of its own over
      # this one (`tests/plan_fixture_source.py`); nothing writes here.
      root: .test-fixtures
  plans:
    plugin: github-projects
    config:
      owner: nickderobertis
      project_number: 2
      repository: nickderobertis/ai-orchestrator
      token_env: GH_PROJECTS_TOKEN
      status_mapping:
        # llmlint: ignore-block[contracts_have_one_source_or_a_drift_gate] This is the one
        # source of the options `unknown`, `queued`, `done` and `cancelled` are written to;
        # its other party is the live board, which no check here may read or write, since
        # that needs the board's credential. A board without any of them is refused by name
        # at the next write addressed to an item — a settlement write-back or a plan copy —
        # before either the Status option or the issue's state is changed. `queued` is what
        # a launched run writes every node it has not dispatched yet, so a board missing the
        # option would refuse the launch's first projection rather than a settlement. `done`
        # and `cancelled` are each a paired write: the store selects the option named here
        # and closes the issue, as completed for `done` and as not planned for `cancelled`,
        # with no closure-only fallback when the option is absent. `queued`, `done` and
        # `cancelled` are the shipped defaults and this states them, because a default that
        # moves upstream would move this board silently.
        unknown: Needs attention
        queued: Queued
        done: Done
        cancelled: Cancelled
        # llmlint: ignore-end[contracts_have_one_source_or_a_drift_gate]
    # A task whose repositories are all Hello Patient's (`petsinc`) lands in that team's
    # Linear, where its work is planned; every other task stays on this board. A plan's home
    # goes there only when every task it carries does, and otherwise stays here with a
    # member project in `hellopatient` for the routed tasks. Beside `plugin` and `config`
    # because it is the store's, not the plugin's, and it repoints none of the five values
    # above.
    routes:
      - repositories: ["github.com/petsinc/*"]
        to: hellopatient
  followups:
    plugin: github-projects
    config:
      owner: nickderobertis
      project_number: 3
      repository: nickderobertis/ai-orchestrator
      token_env: GH_PROJECTS_TOKEN
      status_mapping:
        # llmlint: ignore-block[contracts_have_one_source_or_a_drift_gate] This is the one
        # source of the options a follow-up ticket's `backlog`, `draft`, `queued`, `done` and
        # `cancelled` are written to; its other party is the live board, which no check here
        # may read or write, since that needs the board's credential. The board carries the
        # Status options `Proposal`, `Todo`, `Deferred`, `Queued`, `In Progress`, `Done` and
        # `Cancelled`: `todo` and `in-progress` keep the shipped defaults. `done` and
        # `cancelled` are each a paired write rather than a closure alone: the store selects
        # the option named here and closes the ticket's issue, as completed for `done` — a
        # ticket a person or a dispatch finished — and as not planned for `cancelled` — a
        # ticket a follow-up run withdrew, or a person did. A board missing the option a
        # write names refuses that write by name before either the Status option or the
        # issue's state is changed; there is no closure-only fallback, so a closed card
        # never reads `Todo` or `In Progress` on its face. This overrides the shipped
        # default of `backlog` to `Backlog`, an option that board does not carry, and sends
        # `draft`, a ticket a person deferred, to `Deferred`, so a board missing either
        # option refuses the copy by name. `queued` is a ticket a launched run claimed
        # through a node's `delivers`, and it, `done` and `cancelled` are stated rather than
        # left to the shipped `Queued`, `Done` and `Cancelled` for the same reason `plans`
        # states them: a default that moved upstream would move this board without a change
        # here saying so.
        backlog: Proposal
        draft: Deferred
        queued: Queued
        done: Done
        cancelled: Cancelled
        # llmlint: ignore-end[contracts_have_one_source_or_a_drift_gate]
      # The one source of the `Priority` options a follow-up ticket's priority is written to,
      # which `sources fields` creates the live board's field from. Every level is stated,
      # though each is the shipped default, for the reason `status_mapping` states its
      # defaults: a default that moved upstream would move this board without a change here
      # saying so. `tests/test_plan_source_roots.py` holds it to the CLI's resolved config and
      # its keys to the levels `orchestrator/follow_up_tickets.py` estimates.
      priority_mapping:
        urgent: Urgent
        high: High
        medium: Medium
        low: Low
    # A follow-up ticket whose root cause lives in a Hello Patient (`petsinc`) repository is
    # filed in that team's Linear, in its Agent Follow-ups project, where the team triages it;
    # every other ticket stays on this board. Beside `plugin` and `config` for the reason the
    # `plans` route gives, repointing none of the five values above.
    routes:
      - repositories: ["github.com/petsinc/*"]
        to: hellopatient-followups
  # Hello Patient's Linear team, which a plan task of a `petsinc` repository is routed to by
  # the `plans` route above. Below `plans` and `followups` because readers here take the
  # first `owner:`, `repository:` and `project_number:` lines as `plans`'.
  hellopatient:
    plugin: linear
    config:
      # The production key, from this checkout's `.env`. Named here so the source never
      # falls back to the plugin's default name, which is onetaskgraph's own test key.
      api_key_env: HELLOPATIENT_LINEAR_API_KEY
      team: ENG
      # Categories describe both a plan task and its member project: backlog is proposed,
      # draft deferred, todo accepted but unclaimed, queued claimed but not started,
      # in-progress working, unknown needing attention, done finished, cancelled withdrawn.
      # Task names resolve in ENG's workflow; project names resolve among the workspace's
      # project statuses. Compare both live with `just plans sources fields hellopatient`.
      # llmlint: ignore-block[contracts_have_one_source_or_a_drift_gate] These user-approved
      # names are the source configuration, not a second implementation of Linear's
      # vocabulary. Dispatches lack the production credential, so the manager compares
      # them live after settlement with the fields command above; schema and resolution
      # are held here by tests/test_plan_source_roots.py. Missing names fail at the write.
      status_mapping:
        backlog: { task: Proposed, project: Proposal }
        draft: { task: Backlog, project: Idea }
        todo: { task: Todo, project: Planned }
        queued: { task: Queued, project: Accepted }
        in-progress: In Progress
        unknown: { task: Needs Attention, project: Blocked }
        done: { task: Done, project: Completed }
        cancelled: Canceled
      # llmlint: ignore-end[contracts_have_one_source_or_a_drift_gate]
  # Hello Patient's Linear Agent Follow-ups project, which the `followups` route above files a
  # `petsinc` root cause's ticket in. Not a default source, for the reason `followups` is not:
  # a verified follow-up ticket is not a plan. Last, below the GitHub sources, for the reason
  # `hellopatient` is below them. Linear's priority is the issue's own, so this source needs
  # no `priority_mapping`.
  hellopatient-followups:
    plugin: linear
    config:
      # The production key, named for the reason `hellopatient` names it.
      api_key_env: HELLOPATIENT_LINEAR_API_KEY
      team: ENG
      # The Agent Follow-ups project: every read and create of this source is scoped to it.
      project: 986a467e-775a-4f8f-80dd-aca405063cf4
      status_mapping:
        # llmlint: ignore-block[contracts_have_one_source_or_a_drift_gate] The same eight
        # states as `hellopatient`, because both write the ENG team's one workflow;
        # `tests/test_plan_source_roots.py` holds the two mappings equal. Its other party is
        # that live workflow, which no check here may read, since that needs the production
        # key. `Triage` and the review states — `Ready for Review`, `In Review`, `Reviewed`,
        # `Ready To Merge`, `Blocked`, `Duplicate` and `Cannot Reproduce` — are people's, and
        # no follow-up run writes them.
        # A ticket a follow-up run filed, awaiting a person's decision: `Proposal` on the board.
        backlog: Proposed
        # Deferred by a person, picked up by no agent: `Deferred` on the board.
        draft: Backlog
        # Accepted by a person, and nothing has claimed it.
        todo: Todo
        # Claimed by a launched run through a node's `delivers`.
        queued: Queued
        # Taken up.
        in-progress: In Progress
        # A node delivering it failed, parked or was skipped.
        unknown: Needs Attention
        # Finished.
        done: Done
        # Withdrawn.
        cancelled: Canceled
        # llmlint: ignore-end[contracts_have_one_source_or_a_drift_gate]
