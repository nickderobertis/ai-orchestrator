# This host's plan store. Every source here is public or this checkout's own folder; a
# host's private sources, and the routes that send an organization's work to its own
# backend, live in onetaskgraph's user layer, `${XDG_CONFIG_HOME:-$HOME/.config}/onetaskgraph/
# config.yaml`, outside every checkout and read beneath this document.
# `config/onetaskgraph.user-layer.example.yaml` is that layer's shape, over synthetic names.
#
# The plan store's public write boundary is switched on: every write to a source not declared
# private is screened through the pinned `onevcs`, whose `boundary inspect` answers each
# repository an item names as public or private and whose `boundary check` refuses a write
# carrying a private repository's terms. Plans are drafted in the private `authoring` source and
# copied onto the public boards. A host doing an organization's work declares that
# organization's sources `visibility: private` in its own user layer before adopting this;
# `docs/orchestration.md` (The public write boundary) says why.
write_policy:
  visibility_command: [onevcs, boundary, inspect, --input, "-"]
  check_command: [onevcs, boundary, check, --destination, public, --input, "-"]
default_sources: [authoring, examples, plans, test-fixtures]
sources:
  examples:
    plugin: local-md
    config:
      root: examples
  authoring:
    # Plans, design documents, spike reports and budget answers are drafted here, and an
    # organization's name a private repository, so nothing written here is screened.
    visibility: private
    plugin: local-md
    config:
      root: .plans
  drafts:
    plugin: local-md
    config:
      root: .follow-ups
  # Follow-up launch tasks quote drafts and board comments that may name private work.
  # They stay on this machine and are never copied to a board, so this source is private.
  follow-up-runs:
    visibility: private
    plugin: local-md
    config:
      root: .follow-ups/runs
  test-fixtures:
    # Deliberately private fixture projects stay local; copies to public boards are screened
    # again at their destination.
    visibility: private
    plugin: local-md
    config:
      # This suite's own launchable projects. Rooted relatively and gitignored, beside
      # the two above, because every test process states a temporary root of its own over
      # this one (`tests/plan_fixture_source.py`); nothing writes here.
      root: .test-fixtures
  plans:
    visibility: public
    plugin: github-projects
    config:
      owner: nickderobertis
      project_number: 2
      repository: nickderobertis/ai-orchestrator
      token_env: GH_PROJECTS_TOKEN
      status_mapping:
        # llmlint: ignore-block[contracts_have_one_source_or_a_drift_gate] This is the one
        # source of the options `unknown`, `queued`, `done` and `cancelled` are written to;
        # its other party is the live board, which no check here may read or write, since
        # that needs the board's credential. A board without any of them is refused by name
        # at the next write addressed to an item — a settlement write-back or a plan copy —
        # before either the Status option or the issue's state is changed. `queued` is what
        # a launched run writes every node it has not dispatched yet, so a board missing the
        # option would refuse the launch's first projection rather than a settlement. `done`
        # and `cancelled` are each a paired write: the store selects the option named here
        # and closes the issue, as completed for `done` and as not planned for `cancelled`,
        # with no closure-only fallback when the option is absent. `queued`, `done` and
        # `cancelled` are the shipped defaults and this states them, because a default that
        # moves upstream would move this board silently.
        unknown: Needs attention
        queued: Queued
        done: Done
        cancelled: Cancelled
        # llmlint: ignore-end[contracts_have_one_source_or_a_drift_gate]
    # The store's per-host cache of this board, at its default directory under
    # `${XDG_CACHE_HOME:-$HOME/.cache}/onetaskgraph/`, shared by every process here. It serves
    # only a read pinned to a change token the store already holds; `AGENTS.md`'s plan-store
    # section says which readers that is. The same on `followups` below.
    cache:
      enabled: true
  followups:
    visibility: public
    plugin: github-projects
    config:
      owner: nickderobertis
      project_number: 3
      repository: nickderobertis/ai-orchestrator
      token_env: GH_PROJECTS_TOKEN
      status_mapping:
        # llmlint: ignore-block[contracts_have_one_source_or_a_drift_gate] This is the one
        # source of the options a follow-up ticket's `backlog`, `draft`, `queued`, `done` and
        # `cancelled` are written to; its other party is the live board, which no check here
        # may read or write, since that needs the board's credential. The board carries the
        # Status options `Proposal`, `Todo`, `Deferred`, `Queued`, `In Progress`, `Done` and
        # `Cancelled`: `todo` and `in-progress` keep the shipped defaults. `done` and
        # `cancelled` are each a paired write rather than a closure alone: the store selects
        # the option named here and closes the ticket's issue, as completed for `done` — a
        # ticket a person or a dispatch finished — and as not planned for `cancelled` — a
        # ticket a follow-up run withdrew, or a person did. A board missing the option a
        # write names refuses that write by name before either the Status option or the
        # issue's state is changed; there is no closure-only fallback, so a closed card
        # never reads `Todo` or `In Progress` on its face. This overrides the shipped
        # default of `backlog` to `Backlog`, an option that board does not carry, and sends
        # `draft`, a ticket a person deferred, to `Deferred`, so a board missing either
        # option refuses the copy by name. `queued` is a ticket a launched run claimed
        # through a node's `delivers`, and it, `done` and `cancelled` are stated rather than
        # left to the shipped `Queued`, `Done` and `Cancelled` for the same reason `plans`
        # states them: a default that moved upstream would move this board without a change
        # here saying so.
        backlog: Proposal
        draft: Deferred
        queued: Queued
        done: Done
        cancelled: Cancelled
        # llmlint: ignore-end[contracts_have_one_source_or_a_drift_gate]
      # The one source of the `Priority` options a follow-up ticket's priority is written to,
      # which `sources fields` creates the live board's field from. Every level is stated,
      # though each is the shipped default, for the reason `status_mapping` states its
      # defaults: a default that moved upstream would move this board without a change here
      # saying so. `tests/test_plan_source_roots.py` holds it to the CLI's resolved config and
      # its keys to the levels `orchestrator/follow_up_tickets.py` estimates.
      priority_mapping:
        urgent: Urgent
        high: High
        medium: Medium
        low: Low
      # Projects the machine a follow-up ticket's verification ran on onto the board's `Host`
      # text field, so the board filters by host the way it filters by origin; the record
      # keeps it in its description's metadata slot, which stays its one home. `sources fields
      # followups --apply` creates the field, and a copy onto a board without it is refused
      # by name before anything is written. `tests/test_plan_source_roots.py` holds it to the
      # CLI's resolved config and its `key` and `path` to the record's metadata key and its
      # `host` key in `orchestrator/follow_up_tickets.py`.
      metadata_fields:
        - field: Host
          key: orchestrator.follow-up
          path: [host]
      # The owners a create on this board may file a follow-up ticket's issue under: the
      # board's own owner, so a ticket naming a repository of anybody else is refused by the
      # store as `creation-owner` before anything is written — filing an issue in a third
      # party's repository is an outward action nobody asked for — while an update of an issue
      # that already exists is never refused for it, and a ticket a host route sends elsewhere
      # is held to that destination's own setting. `task locate` reports the refusal as
      # `creates_in.refused`, which `board-status` reads.
      creation_owners: [nickderobertis]
    cache:
      enabled: true
  # The operator's two human-task boards, which the engine projects each human item's task into
  # through `human-public`, the `task_source` `.onepipeline/config.yaml` names: public
  # own-account work on `human-public`, and work the public boundary classifies private on
  # `human-private`. Like `plans` and `followups`, neither carries `routes` here, because a
  # list this document sets replaces a user layer's whole list: the host's user layer
  # declares `human-public`'s routes — the `purpose: human-task` entry sending a private task
  # to `human-private`, and any organization's — and without one a private task is refused,
  # never written publicly. Also host-local: each board's `task_projection`, the one host
  # authoritative for its intents and their absolute directory, and `human-private`'s issue
  # repository, which is private and so is never named in this public file
  # (`config/onetaskgraph.user-layer.example.yaml`). `sources fields <source> --apply` is how
  # each board's `Status` and `Priority` options are created from the mappings here.
  human-public:
    visibility: public
    plugin: github-projects
    config:
      owner: nickderobertis
      project_number: 7
      repository: nickderobertis/ai-orchestrator
      token_env: GH_PROJECTS_TOKEN
      status_mapping:
        # Every category is stated: a projected task is created at `todo` and settles at
        # `done` (closed as completed) or `cancelled` (closed as not planned); a person may
        # move one to `in-progress`; and the categories no human task reaches are disabled, so
        # the board carries no option nothing writes.
        backlog: null
        draft: null
        todo: Todo
        queued: null
        in-progress: In Progress
        unknown: null
        done: Done
        cancelled: Cancelled
      # The operator's word for each wire priority: `urgent` is shown as Critical.
      priority_mapping:
        urgent: Critical
        high: High
        medium: Medium
        low: Low
  human-private:
    visibility: private
    plugin: github-projects
    config:
      owner: nickderobertis
      project_number: 8
      token_env: GH_PROJECTS_TOKEN
      # The same options as `human-public`, so a task reads alike on either board.
      status_mapping:
        backlog: null
        draft: null
        todo: Todo
        queued: null
        in-progress: In Progress
        unknown: null
        done: Done
        cancelled: Cancelled
      priority_mapping:
        urgent: Critical
        high: High
        medium: Medium
        low: Low
