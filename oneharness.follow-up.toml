# The follow-up agent's side: the one single-sided member of `graphs/follow-up.yaml`,
# which `just follow-ups <run-id>` dispatches after a run to verify that run's drafted
# follow-ups, group them by root cause, and put the verified tickets on the `followups`
# board. It has no judge side, so this is the only harness config its turn reads.
#
# It mirrors `oneharness.judge.toml`'s chain order and model tier, and is its own file
# because four things differ:
#
#   * a finite `timeout`, because the turn runs after settlement and nothing else is
#     watching it — an unbounded deadline would leave a wedged verification alive forever;
#   * `GH_PROJECTS_TOKEN` is unmasked on every identity, because this role's whole
#     deliverable is reading and writing the `followups` board through `onetaskgraph`.
#     Every other mask is kept;
#   * its turns stream to the views, so a manager can watch the verification as it goes;
#   * the turn runs in `bypass` mode, which the judge file does not declare at all.
#
# `tests/e2e/test_oneharness_timeout_e2e.py` holds the chain, the pins, the deadline, the
# streaming and the mode against the judge file's effective values,
# `tests/e2e/test_dispatch_environment_e2e.py` reads the unmasked token and each
# identity's bypass argument out of a real turn on every identity, and
# `tests/e2e/test_oneharness_config_equivalence_e2e.py` holds every mask below.
extends = "oneharness.dispatch.toml"

# Bypass, because the member's working directory is its agent graph's scratch directory
# (`…/runs/follow-up-<id>/members/worker`), which is not a repository. In `default` mode
# there codex refuses the turn outright ("Not inside a trusted directory", which falls
# through as `untrusted-directory`) and Claude Code runs under `dontAsk` and is denied
# every tool outside that directory, so the turn can verify nothing and write no ticket.
# Each identity maps this one value to its own mechanism; no harness argument is written
# here. Declared in this file rather than on the graph member because the oneagentgraph
# the engine links admits no `mode` on a single-sided `kind: oneharness` member, and
# stamps none over the config it hands through — so this is the value the turn uses.
# `tests/plan_tooling/test_follow_ups_recipe_e2e.py` dispatches the member against a
# provider that refuses a default-mode turn the way codex does.
mode = "bypass"

# A bounded job — read the drafts, verify each against the trees, write and copy the
# tickets — whose size grows with the run's drafts, so an hour rather than the pacemaker's
# four minutes.
timeout = 3600

# Streamed, so the tool transcript reaches the views as it happens rather than after a
# turn that runs for many minutes.
stream = true

# Both labels are this host's own — the engine's six `onepipeline.*` keys name a
# session's place in the graph and nothing about which side or which lane it is.
history_labels = { role = "agent", agent_role = "follow-up" }

# The judge file's chain, in the judge file's order: codex first, then the alternate
# Claude subscriptions, the primary one last.
harnesses = [
    "codex:primary",
    "codex:alternate",
    "claude-code:alternate",
    "claude-code:alternate2",
    "claude-code:primary-backup",
    "claude-code:primary",
]

# **Each variant below restates a whole `unset_env` to leave `GH_PROJECTS_TOKEN`
# travelling, which is this role's whole point** — the board credential is this role's deliverable and a masked one writes no ticket. A child replaces the parent's
# mask only with a non-empty list, so "the parent's mask minus one name" is written by
# stating what remains. Do NOT fold these into `oneharness.identities.toml`: each is
# the parent's list with the board credential taken out.
# The Claude identities also carry the judge file's cheaper Sonnet tier.
# No `unset_env`: its parent states none either, precisely so this role can leave the
# board credential travelling. An empty list would not help — it inherits rather than
# clears.
[harness.codex.variant.primary]
model = "gpt-5.6-sol"

[harness.codex.variant.alternate]
model = "gpt-5.6-sol"
unset_env = ["OPENAI_API_KEY"]

[harness.claude-code.variant.alternate]
model = "claude-sonnet-5"
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

[harness.claude-code.variant.alternate2]
model = "claude-sonnet-5"
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

[harness.claude-code.variant.primary-backup]
model = "claude-sonnet-5"
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

[harness.claude-code.variant.primary]
model = "claude-sonnet-5"
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]
