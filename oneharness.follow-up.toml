# The follow-up agent's side: the one single-sided member of `graphs/follow-up.yaml`,
# which `just follow-ups <run-id>` dispatches after a run to verify that run's drafted
# follow-ups, group them by root cause, and put the verified tickets on the `followups`
# board. It has no judge side, so this is the only harness config its turn reads.
#
# Its own file rather than `oneharness.judge.toml`, although it mirrors that file's chain
# order and per-identity model pins verbatim, for the reason every side here has its own:
# three things differ, and a shared file could hold none of them without moving the
# judge too.
#
#   * a finite `timeout`, because the turn runs after settlement and nothing else is
#     watching it — an unbounded deadline would leave a wedged verification alive forever;
#   * `GH_PROJECTS_TOKEN` is unmasked on every identity, because this role's whole
#     deliverable is reading and writing the `followups` board through `onetaskgraph`.
#     Every other mask the judge file declares is kept;
#   * its turns stream to the views, so a manager can watch the verification as it goes.
#
# And one thing the judge file does not declare at all: the turn runs in `bypass` mode.
#
# `tests/e2e/test_oneharness_timeout_e2e.py` holds the chain, the pins, the deadline, the
# streaming and the mode against the judge file's effective values, and
# `tests/e2e/test_dispatch_environment_e2e.py` reads the unmasked token and each
# identity's bypass argument out of a real turn on every identity.

run_mode = "fallback"

# Bypass, because the member's working directory is its agent graph's scratch directory
# (`…/runs/follow-up-<id>/members/worker`), which is not a repository. In `default` mode
# there codex refuses the turn outright ("Not inside a trusted directory", which falls
# through as `untrusted-directory`) and Claude Code runs under `dontAsk` and is denied
# every tool outside that directory, so the turn can verify nothing and write no ticket.
# Each identity maps this one value to its own mechanism; no harness argument is written
# here. Declared in this file rather than on the graph member because the oneagentgraph
# the engine links admits no `mode` on a single-sided `kind: oneharness` member, and
# stamps none over the config it hands through — so this is the value the turn uses.
# `tests/plan_tooling/test_follow_ups_recipe_e2e.py` dispatches the member against a
# provider that refuses a default-mode turn the way codex does.
mode = "bypass"

# A bounded job — read the drafts, verify each against the trees, write and copy the
# tickets — whose size grows with the run's drafts, so an hour rather than the pacemaker's
# four minutes.
timeout = 3600

# Streamed, so the tool transcript reaches the views as it happens rather than after a
# turn that runs for many minutes.
stream = true

# A follow-up run is a dispatch, so the engine switches recording on for it too; this
# is kept for the same reason `oneharness.toml`'s copy is. Both labels are this host's
# own — the engine's six `onepipeline.*` keys name a session's place in the graph and
# nothing about which side or which lane it is.
history = true
history_labels = { role = "agent", agent_role = "follow-up" }

# The judge file's chain, in the judge file's order: codex first, then the alternate
# Claude subscriptions, the primary one last.
harnesses = [
    "codex:primary",
    "codex:alternate",
    "claude-code:alternate",
    "claude-code:alternate2",
    "claude-code:primary-backup",
    "claude-code:primary",
]

[harness.codex]
model = "gpt-5.6-sol"

[harness.codex.variant.primary]
model = "gpt-5.6-sol"
# The same runtime-directory repoint every dispatched side carries; see
# `oneharness.judge.toml`.
env_from = { XDG_RUNTIME_DIR = "ONEPIPELINE_NODE_SCRATCH_DIR" }

[harness.codex.variant.alternate]
model = "gpt-5.6-sol"
env_from = { CODEX_HOME = "ORCHESTRATOR_CODEX_ALT_HOME", XDG_RUNTIME_DIR = "ONEPIPELINE_NODE_SCRATCH_DIR" }
unset_env = ["OPENAI_API_KEY"]

[harness.claude-code]
env = { IS_SANDBOX = "1" }

[harness.claude-code.variant.alternate]
model = "claude-sonnet-5"
env_from = { CLAUDE_CONFIG_DIR = "ORCHESTRATOR_CLAUDE_ALT_CONFIG_DIR", XDG_RUNTIME_DIR = "ONEPIPELINE_NODE_SCRATCH_DIR" }
# Subscription auth must not be shadowed by ambient API or OAuth credentials.
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

[harness.claude-code.variant.alternate2]
model = "claude-sonnet-5"
env_from = { CLAUDE_CONFIG_DIR = "ORCHESTRATOR_CLAUDE_ALT2_CONFIG_DIR", XDG_RUNTIME_DIR = "ONEPIPELINE_NODE_SCRATCH_DIR" }
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

# The primary-backup subscription, reached just before the primary one. It is
# credentialed from the directory scripts/claude-alt-config-dir.sh resolves into
# ORCHESTRATOR_CLAUDE_PRIMARY_BACKUP_CONFIG_DIR, which is that helper's to default; a
# host that never logged it in reports `failure_kind: "auth"` and falls through, so the
# candidate costs nothing until then.
[harness.claude-code.variant.primary-backup]
model = "claude-sonnet-5"
env_from = { CLAUDE_CONFIG_DIR = "ORCHESTRATOR_CLAUDE_PRIMARY_BACKUP_CONFIG_DIR", XDG_RUNTIME_DIR = "ONEPIPELINE_NODE_SCRATCH_DIR" }
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

[harness.claude-code.variant.primary]
model = "claude-sonnet-5"
# The last resort in every chain: the primary subscription, credentialed from the
# directory scripts/claude-alt-config-dir.sh resolves into
# ORCHESTRATOR_CLAUDE_PRIMARY_CONFIG_DIR, which is that helper's to default. Every
# higher-precedence credential selector is masked, so this identity can never run as
# another account.
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]
env_from = { CLAUDE_CONFIG_DIR = "ORCHESTRATOR_CLAUDE_PRIMARY_CONFIG_DIR", XDG_RUNTIME_DIR = "ONEPIPELINE_NODE_SCRATCH_DIR" }
