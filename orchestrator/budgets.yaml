# The orchestrator project's own budgets, checked by its `budgets` Nx target whenever a
# change touches the project. Each command runs from this directory with no shell, and
# writes the value it measured to the file `ONEBUDGETSPEC_RESULT` names. This file is the
# one statement of each threshold: the tests that measure them read it from here.
schema_version: 1
budgets:
  - id: plan-level-prompt-chars
    description: >-
      Characters of the plan-level prompt `just review-plan` composes for a realistic
      44-node, 52-budget plan — the larger of the baseline-shaped and host-shaped fixtures
      in tests/test_plan_review.py — which must stay well inside the smallest context
      window a candidate of the plan-level role answers in.
    measure: reported
    command: ["uv", "run", "--directory", "..", "pytest", "tests/test_plan_review.py", "-k", "plan_level_prompt_size"]
    unit: characters
    direction: max
    threshold: 200000
  - id: plan-level-prompt-chars-per-node
    description: >-
      Characters the costliest node of either realistic fixture adds to the plan-level
      prompt, so a plan's prompt grows with how many nodes it has and never with how
      long their task bodies are.
    measure: reported
    command: ["uv", "run", "--directory", "..", "pytest", "tests/test_plan_review.py", "-k", "plan_level_prompt_per_node"]
    unit: characters
    direction: max
    threshold: 1600
  - id: follow-up-scoped-comment-reads
    description: >-
      Board requests a comment-answering pass scoped to one issue spends, on a board crowded
      with unrelated commented items, out of the GitHub allowance every session on this host
      shares.
    measure: reported
    # llmlint: ignore[budgets_reuse_gate_telemetry, budgets_scoped_to_minimal_tree] The plan that registered this budget states its measurement source as direct and this exact command; a store-request count is recorded by no gate's telemetry, and the crowded-board test it runs lives with the module's other tests under tests/, as the two budgets above do.
    command: ["uv", "run", "--directory", "..", "pytest", "tests/test_follow_up_comments.py", "-k", "scoped_comment_reads"]
    unit: requests
    direction: max
    threshold: 2
