# The orchestrator project's own budgets, checked by its `budgets` Nx target whenever a
# change touches the project. Each command runs from this directory with no shell and
# analyses what the test targets that `budgets` depends on recorded during their normal
# run (`tests/budget_telemetry.py`), reporting the figure and its breakdown. This file is
# the one statement of each threshold.
#
# A budget labelled `planning` is about one planning flow the way `cycle-time` is about one
# landed change, so no push gate and no Nx target selects it: `scripts/finish-plan.sh`
# checks it over the flow it has just finished, with `PLAN_CHECKLIST_FLOW` naming the
# flow's draft run and `PLAN_CHECKLIST_PROJECT` its plan project, and an overrun warns
# without refusing the plan. Its command reads that flow's own run records.
schema_version: 1
budgets:
  - id: follow-up-run-points
    description: >-
      Modelled GitHub GraphQL points one realistic follow-up run spends on the followups
      board, priced on the loopback stand-in. It protects the board token's hourly
      allowance, which every session on this host shares.
    measure: reported
    command: ["uv", "run", "--directory", "..", "python", "-m", "tests.budget_telemetry"]
    unit: points
    direction: max
    threshold: 160
  - id: ticket-lifecycle-points
    description: >-
      Modelled GitHub GraphQL points one follow-up ticket's whole life spends on the
      followups board: filed, re-copied, answered once and withdrawn. It protects the same
      shared allowance per ticket, including the steps a run does not drive.
    measure: reported
    command: ["uv", "run", "--directory", "..", "python", "-m", "tests.budget_telemetry"]
    unit: points
    direction: max
    threshold: 23
  - id: lost-turn-surface-chars
    description: >-
      Characters of the planner surface a lost monitor turn raises, the largest the journeys
      raise. It protects how much a manager reads on the channel in place of the lost turn.
    measure: reported
    command: ["uv", "run", "--directory", "..", "python", "-m", "tests.budget_telemetry"]
    unit: characters
    direction: max
    threshold: 400
  - id: plan-level-prompt-chars
    description: >-
      Characters of the plan-level prompt `just review-plan` composes for a realistic
      44-node, 52-budget plan. It protects the room that prompt needs inside the smallest
      context window a candidate of the plan-level role answers in.
    measure: reported
    command: ["uv", "run", "--directory", "..", "python", "-m", "tests.budget_telemetry"]
    unit: characters
    direction: max
    threshold: 200000
  # llmlint: ignore-block[budgets_track_product_owner_outcomes] The only budget bounding how the plan-level prompt grows with a plan's size: the total is measured on one 44-node fixture, whose ceiling would not catch a per-node regression of more than twice, so this is the scaling outcome a plan author relies on rather than a part the total already guards.
  - id: plan-level-prompt-chars-per-node
    description: >-
      Characters one node costs the plan-level prompt, at the costliest node of a realistic
      plan. It protects how fast that prompt grows with a plan's node count, which keeps a
      plan of any size reviewable however long its task bodies are.
    measure: reported
    command: ["uv", "run", "--directory", "..", "python", "-m", "tests.budget_telemetry"]
    unit: characters
    direction: max
    threshold: 1600
  # llmlint: ignore-end[budgets_track_product_owner_outcomes]
  # This repository's orchestrator project keeps every test under tests/ and every fixture
  # under tests/fixtures, and orchestrator/ holds the package alone; the budgets above are
  # measured from tests/ too, through tests/budget_telemetry.py.
  # llmlint: ignore-block[budgets_scoped_to_minimal_tree] see above
  - id: plan-checklist-added-seconds
    description: >-
      Seconds one planning flow waits on the plan checklist beyond its planners' reviewer,
      read off the harness's recorded judge time. It protects how long planning takes.
    labels: [host, planning]
    measure: reported
    command: ["uv", "run", "--directory", "..", "python", "-m", "orchestrator.plan_checklist_budgets"]
    unit: seconds
    direction: max
    threshold: 400
  - id: plan-checklist-tokens
    description: >-
      Harness tokens, input plus output as oneharness records them, that the plan checklist
      spends over one planning flow: its draft and finalize planner dispatches and its `just
      review-plan` run. It protects the subscription quota planning draws on.
    labels: [planning]
    measure: reported
    command: ["uv", "run", "--directory", "..", "python", "-m", "orchestrator.plan_checklist_budgets"]
    unit: tokens
    direction: max
    threshold: 3000000
  # llmlint: ignore-end[budgets_scoped_to_minimal_tree]
