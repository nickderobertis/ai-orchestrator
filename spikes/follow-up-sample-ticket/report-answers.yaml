spike: spike-sample-ticket
branch: nick/follow-up-collapsed-agent-sections/spike-sample-ticket
harness: 'On the branch, under `spikes/follow-up-sample-ticket/`, run from the checkout root:


  - `body.md` is the sample issue''s body; `comment.md` is the sample comment''s body.

  - `build_source.py` writes the sample''s local Markdown item `store/tasks/follow-up-collapsed-agent-sections/sample-ticket.md` from `body.md` and the pre-rendered record. It keeps the copy link the store writes back into the item.

  - `onetaskgraph.yaml` adds one `metadata_fields` entry per field to `followups`, each read from `orchestrator.follow-up-sample`, and adds the local source `follow-up-sample` (`visibility: public`, rooted at `spikes/follow-up-sample-ticket/store`).

  - **`file-sample.sh`** files or refreshes the sample. It builds the source, runs `sources fields followups --apply`, runs `task copy … --to followups`, then adds the comment (or edits it, found by its marker) with `task comment add`/`edit`, and prints each answer the store gave plus `task show` of the result.

  - **`measure-field-length.sh followups:I_kwDOTXCWqs8AAAABe3Kl1w`** takes the length measurement. It appends each length to `measurements.tsv` and restores the realistic value. `PROBES="N …"` tries single lengths only, and `KEEP_LAST=1` skips the restore.

  - `realistic_size.py` reads `task list --source followups --all --json` on standard input and prints `realistic-size.txt`.

  - `verify-render.sh 2505` reads the item''s field values and GitHub''s rendered HTML of the body and comments, and prints `render-check.txt`.


  Every store command runs this checkout''s `.venv/bin/onetaskgraph` against this branch''s `onetaskgraph.yaml`, through the wrapper `PLAN_STORE`. That defaults to the canonical checkout''s `scripts/plan-store.sh`, which loads the board credential for the one command and never prints it.'
method: "**The sample.** [Issue #2505, \"[sample] follow-up ticket structure\"](https://github.com/nickderobertis/ai-orchestrator/issues/2505) in `github.com/nickderobertis/ai-orchestrator`, at status `Proposal` on the `followups` board (project 3), and [its sample evidence comment](https://github.com/nickderobertis/ai-orchestrator/issues/2505#issuecomment-6845837157). Both were filed through the store at the adopted onetaskgraph 0.14.12: `task copy follow-up-sample:follow-up-collapsed-agent-sections/sample-ticket --to followups` created the issue and board item (`followups:I_kwDOTXCWqs8AAAABe3Kl1w`), and `task comment add` posted the comment. A second run of `file-sample.sh` updated the same item through the copy link (`\"via\": \"link\"`) and edited the same comment (`IC_kwDOTXCWqs8AAAABmAsvZQ`), so the harness refreshes rather than duplicating. The body's content is copied from public follow-up [issue #2499](https://github.com/nickderobertis/ai-orchestrator/issues/2499) and names nothing private. The sample's record is kept under `orchestrator.follow-up-sample`, never `orchestrator.follow-up`, so no follow-up run reads it as a ticket.\n\n**The fields it shows**, as a GraphQL read of the board item returns them (`verify-render.sh 2505`); `\\n` is a newline held inside the value:\n\n- Title: \"[sample] follow-up ticket structure\"\n- Status: \"Proposal\"\n- onetaskgraph.origin: \"follow-up-sample:follow-up-collapsed-agent-sections/sample-ticket\"\n- Host: \"lima-hp\"\n- Owning runs: \"User-rulings-bind--manager-rulings-are-challengeable--and-plan-review-checks-who-owns-the-knowledge-at-a-seam\"\n- Basis: \"github.com/nickderobertis/onejudge: e1299b8ac7b4131bf3b7de587dfadda70bf7ba10\\ngithub.com/nickderobertis/onepipeline: 5f7f4611e1a88685dd8846b50d77d06eb50d2f89\"\n- Drafts: \"drafts:User-rulings-bind--manager-rulings-are-challengeable--and-plan-review-checks-who-owns-the-knowledge-at-a-seam/drafts/20261112T195514Z-let-a-read-only-judge-decline-a-manager-ruling-t\"\n- Transcripts: \"onepipeline transcript User-rulings-bind--manager-rulings-are-challengeable--and-plan-review-checks-who-owns-the-knowledge-at-a-seam aio-adopt-ruling-provenance\"\n- Witnesses: \"none recorded (the source ticket, issue 2499, names no witness)\"\n- Verified at: \"2026-11-13T04:36:44Z\"\n\nEach value was stored as a string already rendered as a list or map will later be: the one-element lists `owning_runs`, `drafts` and `transcripts` as one line, and `basis` as one `KEY: VALUE` line per repository in key order. `Witnesses` holds a placeholder sentence, because issue #2499 records no witness. The six fields `Owning runs`, `Basis`, `Drafts`, `Transcripts`, `Witnesses` and `Verified at` were created by `sources fields followups --apply`, which reported each one as `created the <name> text field`; `Host` already existed. They persist on the board.\n\n**How it renders on GitHub.** Checked against GitHub's own rendered HTML (`bodyHTML`) of the issue and of the comment, read back after filing:\n- `Cost of the workaround`: a `<details>` element with no `open` attribute, so it renders collapsed, holding a rendered list (`<ul>`, `<li>`).\n- `Contributing locations`: collapsed the same way, holding a rendered list with inline code (`<ul>`, `<li>`, `<code>`).\n- The comment's `This run's evidence`: collapsed the same way, holding a rendered list (`<ul>`, `<li>`).\n- The body carries no `## Owning runs` section, and Evidence holds only what happened.\n\nThe check reads GitHub's rendering through the API, not a browser screenshot. The board's own table and side-panel display of the multi-line `Basis` value was not looked at; see the design findings.\n\n**The issue body as filed** (the store added the `<a id>` anchors and the trailing hidden metadata comment):\n\n````markdown\n> **This is a sample of the proposed follow-up ticket structure, not a ticket**: its content is copied from issue #2499 so the shape can be judged on real text, and it will be closed as not planned once the structure is confirmed.\n\n<a id=\"root-cause\"></a>\n## Root cause\n\nA judge may challenge a manager ruling but cannot emit the recognized decline while running read-only. Its disagreement can appear only as prose in a verdict, leaving the manager without the typed challenge the run is supposed to surface.\n\n<a id=\"impact\"></a>\n## Impact\n\n**Who is affected.** Developers and managers delivering changes through onepipeline.\n\n**What it costs them.** Read-only judges cannot use the command-based decline path; the host currently relies on verdict prose that does not become a typed challenge.\n\n**What it costs the product owner.** This adds diagnosis and repeated work to delivery in the affected situation; no data loss or measured extra monthly spend is established.\n\n<details>\n<summary>Cost of the workaround</summary>\n\n- Applying it: Have the judge explain the departure in its verdict and have the manager read and handle it manually. This requires manual intervention per occurrence.\n- Side effects on the outcome: none once completed; delivery is delayed.\n- Discovery: the draft required diagnosis; the failure does not directly prescribe this workaround.\n\n</details>\n\n- Severity: high\n- Workaround: Have the judge explain the departure in its verdict and have the manager read and handle it manually.\n- Severity with the workaround: medium\n- Priority estimate: high (severity with the workaround medium; fires consistently; 1 occurrence; raised one level because it fires consistently)\n\n<a id=\"examples\"></a>\n## Examples\n\nRead-only judges cannot use the command-based decline path; the host currently relies on verdict prose that does not become a typed challenge.\n\n<a id=\"suggested-fix\"></a>\n## Suggested fix\n\nAdd an optional structured manager-ruling decline to the judge verdict and have the engine validate its reference and emit the existing typed challenge on the judge’s behalf.\n\n<details>\n<summary>Contributing locations</summary>\n\n- onepipeline `src/ruling.rs`: resolves manager rulings for the write-based decline path.\n- onepipeline `src/verbs.rs`: accepts declines only through a channel-writing verb.\n- onejudge `crates/onejudge/src/provider.rs:381`: owns the verdict contract without a structured ruling-decline field.\n\n</details>\n\n<a id=\"workflow--onepipeline\"></a>\n### Workflow — `onepipeline`\n\nJudge verdict gains an optional declined_manager_ruling object with ruling reference and reason. The engine refuses user rulings and unknown references and emits one existing declined-ruling surface for a valid manager ruling.\n\n<a id=\"verdict-contract--onejudge\"></a>\n### Verdict contract — `onejudge`\n\nJudge verdict gains an optional declined_manager_ruling object with ruling reference and reason. The engine refuses user rulings and unknown references and emits one existing declined-ruling surface for a valid manager ruling.\n\n<a id=\"evidence\"></a>\n## Evidence\n\nA read-only judge in node `aio-adopt-ruling-provenance` disagreed with a manager ruling and could say so only as prose in its verdict, so no typed decline reached the manager. The contributing behavior was verified in the trees on this item's Basis field against that occurrence.\n\n<!-- onetaskgraph.metadata\n{\"onetaskgraph.copied_destination_version\":\"sha256:d9e35856aff9b43660df938b1ecf3ebbe8894509fa3d1e2de3ca24b051ff6d94\",\"onetaskgraph.copied_version\":\"md1|78d8b72bbd2bd533b2cd6a4607e8e013cf4b205863b544f0c91580d0cc851fe1\",\"onetaskgraph.create_key\":\"0ddc8121-80b1-509b-9639-ed16e539dd23\",\"onetaskgraph.edges_on_record\":1,\"onetaskgraph.item_kind\":\"task\",\"onetaskgraph.origin\":\"follow-up-sample:follow-up-collapsed-agent-sections/sample-ticket\",\"orchestrator.follow-up-sample\":{\"host\":\"lima-hp\",\"owning_runs\":\"User-rulings-bind--manager-rulings-are-challengeable--and-plan-review-checks-who-owns-the-knowledge-at-a-seam\",\"basis\":\"github.com/nickderobertis/onejudge: e1299b8ac7b4131bf3b7de587dfadda70bf7ba10\\ngithub.com/nickderobertis/onepipeline: 5f7f4611e1a88685dd8846b50d77d06eb50d2f89\",\"drafts\":\"drafts:User-rulings-bind--manager-rulings-are-challengeable--and-plan-review-checks-who-owns-the-knowledge-at-a-seam/drafts/20261112T195514Z-let-a-read-only-judge-decline-a-manager-ruling-t\",\"transcripts\":\"onepipeline transcript User-rulings-bind--manager-rulings-are-challengeable--and-plan-review-checks-who-owns-the-knowledge-at-a-seam aio-adopt-ruling-provenance\",\"witnesses\":\"none recorded (the source ticket, issue 2499, names no witness)\",\"verified_at\":\"2026-11-13T04:36:44Z\"}}\n-->\n````\n\n**The comment as filed:**\n\n````markdown\nAdditional evidence from follow-up run `sample-follow-up-run-2026-11-13`.\n\nA second read-only judge, in a later plan review, disagreed with a manager ruling on a seam's owner and again wrote its departure into its verdict's prose; the manager found it only by reading the verdict, and no declined-ruling surface was raised.\n\nBears on the ticket: this is a second occurrence of the same root cause on a different node, so the frequency stays consistent and the workaround's per-occurrence manual read is confirmed.\n\n<details>\n<summary>This run's evidence</summary>\n\n- Host: lima-hp\n- Basis: github.com/nickderobertis/onepipeline at 5f7f4611e1a88685dd8846b50d77d06eb50d2f89\n- Draft: drafts:sample-follow-up-run-2026-11-13/drafts/20261113T060000Z-a-read-only-judge-again-declined-in-prose; transcript: onepipeline transcript sample-follow-up-run-2026-11-13 sample-plan-review\n- Witnesses: none (sample)\n\n</details>\n\n<!-- orchestrator:follow-up-comment run=\"sample-follow-up-run-2026-11-13\" root_cause=\"sample-follow-up-ticket-structure\" -->\n````\n\nThe comment's run, draft, transcript and observation are sample content made up to show the shape. The opening line, the `Bears on the ticket:` paragraph, the collapsed block and the marker follow the proposed shape.\n\n**The text-field limit.** `measure-field-length.sh` wrote values of the given lengths onto the sample's `Owning runs` field through the store's `task metadata set followups:I_kwDOTXCWqs8AAAABe3Kl1w orchestrator.follow-up-sample <record>`. Each value was the run name repeated one per line and cut to the exact length. It bisected between 1,000 (accepted) and 60,000 (refused) until within 100, and two single probes (`PROBES=\"1024 1025\"`) then pinned the edge. **The longest value accepted is 1,024 characters; the shortest refused is 1,025.** Each length tried, with the store's own answer:\n\n| Length tried | Store exit | The store's answer |\n| --- | --- | --- |\n| 60000 | 1 | refused: `Column value must be a valid value for text column` (store failure class `refused`, source `followups`) |\n| 1000 | 0 | accepted |\n| 30500 | 1 | refused: `Column value must be a valid value for text column` (store failure class `refused`, source `followups`) |\n| 15750 | 1 | refused: `Column value must be a valid value for text column` (store failure class `refused`, source `followups`) |\n| 8375 | 1 | refused: `Column value must be a valid value for text column` (store failure class `refused`, source `followups`) |\n| 4687 | 1 | refused: `Column value must be a valid value for text column` (store failure class `refused`, source `followups`) |\n| 2843 | 1 | refused: `Column value must be a valid value for text column` (store failure class `refused`, source `followups`) |\n| 1921 | 1 | refused: `Column value must be a valid value for text column` (store failure class `refused`, source `followups`) |\n| 1460 | 1 | refused: `Column value must be a valid value for text column` (store failure class `refused`, source `followups`) |\n| 1230 | 1 | refused: `Column value must be a valid value for text column` (store failure class `refused`, source `followups`) |\n| 1115 | 1 | refused: `Column value must be a valid value for text column` (store failure class `refused`, source `followups`) |\n| 1057 | 1 | refused: `Column value must be a valid value for text column` (store failure class `refused`, source `followups`) |\n| 1024 | 0 | accepted |\n| 1025 | 1 | refused: `Column value must be a valid value for text column` (store failure class `refused`, source `followups`) |\n\nAfter the refused 1,025-character write, both the body's record and the board field still held the 1,024-character value, so a refusal changed nothing. The realistic value was then restored by re-running `file-sample.sh`, and the read-back above was taken after that.\n\n**The realistic size beside it.** Read through the store with `task list --source followups --all` (1,802 items, 1,801 carrying `orchestrator.follow-up`), each record's value rendered as the proposed fields would show it:\n\n````text\nitems read: 1802; tickets carrying orchestrator.follow-up: 1801\nlongest rendered basis: 975 characters, on https://github.com/nickderobertis/ai-orchestrator/issues/1835\n  tickets whose rendered basis exceeds 1024 characters: 0\nlongest rendered drafts: 1671 characters, on https://github.com/nickderobertis/printobserver/issues/287\n  tickets whose rendered drafts exceeds 1024 characters: 5\nlongest rendered owning_runs: 132 characters, on https://github.com/nickderobertis/oneagentgraph/issues/181\n  tickets whose rendered owning_runs exceeds 1024 characters: 0\n````\n\nSo `Owning runs` (longest 132) and `Basis` (longest 975) fit under 1,024 today. `Drafts` does not: 5 tickets exceed it, the longest at 1,671 characters on [printobserver#287](https://github.com/nickderobertis/printobserver/issues/287). No record carries `transcripts` or `witnesses` yet, so their realistic size was not measured. `Transcripts` holds one line per draft and each line is about as long as a draft id, so it will reach the limit at about the same draft count as `Drafts` does.\n\n**Limits on how far this carries.** The limit was measured on one board, with ASCII values, through `task metadata set`. A `task copy` projects through the same field write, but was not itself driven past the limit."
candidates: []
findings:
- '**A ProjectV2 text field holds at most 1,024 characters, and a longer value is refused whole, never truncated.** GitHub answers `Column value must be a valid value for text column`, the store fails with class `refused`, and nothing on the item changes. Five tickets on the board today have a rendered `drafts` value over the limit (longest 1,671, printobserver#287), and `transcripts` grows with the number of drafts at about the same rate. A field projected straight from the record would make the copy of those tickets fail. The plan needs a rule for a value over 1,024 characters: elide it on the field with a pointer to where the full value lives, keep that field off the board for that ticket, or split it. The full value then still has to live somewhere a person can read, which the proposed body no longer carries.'
- '**One board field cannot be fed by two metadata keys.** With an entry for `Host` from `orchestrator.follow-up` beside one from `orchestrator.follow-up-sample`, the store refuses the configuration: `metadata_fields[1] … names the same board field as metadata_fields[0]; one field cannot hold two values`. The sample therefore repoints `Host` at its own key, on this throwaway branch only. The implementation keeps `Host` on `orchestrator.follow-up`, so this does not block it. It does mean a ticket''s record key cannot change, nor two record shapes coexist, while they share one board field.'
- '**The board''s display of multi-line values was not checked visually.** The API stores and returns the newlines in `Basis` intact. Whether the board''s table cell and item side panel show them as separate lines, or run them together, was not looked at, because this dispatch has no browser. A person confirming the sample should open the board item and look at `Basis`.'
- '**The copy''s public-boundary screen depends on GitHub''s REST quota.** While the `gh` REST core limit was exhausted, `onevcs boundary inspect` answered `{"visibility":"unknown"}` for the public `github.com/nickderobertis/ai-orchestrator`. The store then treated the item as private and refused the copy as `not-private-destination`, even though the copy itself spends no REST requests. It went through once the limit reset. A follow-up run filing tickets while the host''s REST quota is spent would be refused the same way.'
- '**A local-md source with no declared visibility is treated as private.** Before `visibility: public` was declared on `follow-up-sample`, its copy onto `followups` was refused as private for that reason. Nothing changes for the follow-up flow, whose `drafts` source already copies to the board, but a new local source feeding a public board must declare its visibility.'
- '**This dispatch was handed no `GH_PROJECTS_TOKEN`.** `just plans task list --source followups --allow-partial` answered `source followups could not answer: authentication for this source failed: source followups: environment variable GH_PROJECTS_TOKEN is missing or empty`, although the dispatch-env hook is meant to carry it. On the manager''s ruling, every board command ran through the canonical checkout''s credential loader, `scripts/plan-store.sh`, for that one command, with this checkout''s own store binary and config.'
