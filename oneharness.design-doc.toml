# The design-doc WRITER's harness config: WHICH harness + model writes the one short
# document a person reviews a plan as. Named by `graphs/design-doc.yaml`'s `worker`
# member as its **agent** side. See docs/onejudge-integration.md.
#
# This role's pairing is the REVERSE of this host's ordinary one, and that is the whole
# reason it needs two files of its own rather than borrowing the worker's and the
# judge's: Codex leads the side that writes, and Claude leads the side that reviews.
# `oneharness.design-doc-judge.toml` is that other half.
#
# It extends `oneharness.identities.toml` rather than `oneharness.dispatch.toml`: the
# design-document pair is launched by `just plan` rather than inside a node's dispatch,
# so there is no node scratch directory for the runtime-directory repoint to point at.
# tests/e2e/test_oneharness_timeout_e2e.py reads both sides back from the real CLI.
extends = "oneharness.identities.toml"

# timeout: the per-turn deadline in seconds. Stated rather than inherited, because this
# role is a bounded job: it reads one plan, writes one document, and stops. Nothing
# watches for the life of a run here, so the unbounded default would only ever mean a
# wedged turn that never ends.
#
# It is a backstop against that wedged turn and not a budget for the work. Reading a
# whole plan's tasks and composing a document from them is a real amount of reading, and
# a writer cut off mid-document produces nothing at all, so the number is set well clear
# of the honest case.
timeout = 900

# `role` names the SIDE of the conversation: this is the side that does the work.
# `role` is this host's key and the engine stamps nothing like it: the six
# `onepipeline.*` keys a dispatch inherits name the run, project, scope, node, step and
# attempt, none of which says which side of a conversation a session is.
history_labels = { role = "agent" }

# The writer carries the supervisory order rather than the worker's, and here that is a
# choice about the work rather than about queueing: Codex leads because this side writes
# prose to a fixed template under a reviewer that pushes back, and this host prefers its
# Claude subscriptions on the side that judges that prose. Past both Codex identities it
# reaches the workers' alternate Claude subscriptions in the worker's own relative order,
# with the primary Claude identity last — every role names all six, so no quota is lost
# once everything ahead of it is exhausted.
# llmlint: ignore[changed_behavior_has_e2e] tests/e2e/test_oneharness_timeout_e2e.py proves this list against the real CLI's effective configuration; paid-provider quota rejection cannot be deterministic.
harnesses = [
    "codex:primary",
    "codex:alternate",
    "claude-code:alternate",
    "claude-code:alternate2",
    "claude-code:primary-backup",
    "claude-code:primary",
]

# Astra is the GPT-6 tier; name it explicitly so the tier cannot drift under us. This
# side leads on Codex, so the model it names is the one that ordinarily does the work
# rather than a fallback. It needs a codex CLI at 0.153.0 or newer: an older one does
# not know this id, so the candidate refuses and the chain falls through to Claude with
# the intent silently unmet.
[harness.codex]
model = "gpt-6-astra"

# **Each variant below restates a whole `unset_env` to leave `GH_PROJECTS_TOKEN`
# travelling, which is this role's whole point** — its composed task reads the plan out of the store. A child replaces the parent's
# mask only with a non-empty list, so "the parent's mask minus one name" is written by
# stating what remains. Do NOT fold these into `oneharness.identities.toml`: each is
# the parent's list with the board credential taken out.
# The two Codex identities also carry this side's Astra tier.
# No `unset_env`: its parent states none either, precisely so this role can leave the
# board credential travelling. An empty list would not help — it inherits rather than
# clears.
[harness.codex.variant.primary]
model = "gpt-6-astra"

[harness.codex.variant.alternate]
model = "gpt-6-astra"
unset_env = ["OPENAI_API_KEY"]

[harness.claude-code.variant.alternate]
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

[harness.claude-code.variant.alternate2]
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

[harness.claude-code.variant.primary-backup]
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

[harness.claude-code.variant.primary]
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]
