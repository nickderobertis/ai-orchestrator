# The design-doc WRITER's harness config: WHICH harness + model writes the one short
# document a person reviews a plan as. Named by `graphs/design-doc.yaml`'s `worker`
# member as its **agent** side. See docs/onejudge-integration.md.
#
# This role's pairing is the REVERSE of this host's ordinary one, and that is the whole
# reason it needs two files of its own rather than borrowing the worker's and the
# judge's: Codex leads the side that writes, and Claude leads the side that reviews.
# `oneharness.design-doc-judge.toml` is that other half.
#
# It is also a separate file for the reason every copy of this routing is separate: the
# sides that share an identity order do not share a deadline, and pointing this member
# at another's config would take its own deadline away silently.
# tests/e2e/test_oneharness_timeout_e2e.py reads both back from the real CLI.

# run_mode: how the selected harnesses are run. "fallback" tries them in priority
# order and stops at the first that can actually run, falling through only
# harnesses that cannot run at all — see the note in oneharness.toml.
run_mode = "fallback"

# timeout: the per-turn deadline in seconds. Stated rather than inherited, because this
# role is a bounded job: it reads one plan, writes one document, and stops. Nothing
# watches for the life of a run here, so the unbounded default would only ever mean a
# wedged turn that never ends.
#
# It is a backstop against that wedged turn and not a budget for the work. Reading a
# whole plan's tasks and composing a document from them is a real amount of reading, and
# a writer cut off mid-document produces nothing at all, so the number is set well clear
# of the honest case.
timeout = 900

# Record this side's runs to disk too; a pinned `--config` skips the user-level
# config.toml, so history must be enabled here.
history = true

# `role` names the SIDE of the conversation: this is the side that does the work.
history_labels = { role = "agent" }

# The writer carries the supervisory order rather than the worker's, and here that is a
# choice about the work rather than about queueing: Codex leads because this side writes
# prose to a fixed template under a reviewer that pushes back, and this host prefers its
# Claude subscriptions on the side that judges that prose. Past both Codex identities it
# reaches the workers' alternate Claude subscriptions in the worker's own relative order,
# with the primary Claude identity last — every role names all five, so no quota is lost
# once everything ahead of it is exhausted.
# llmlint: ignore[changed_behavior_has_e2e] tests/e2e/test_oneharness_timeout_e2e.py proves this list against the real CLI's effective configuration; paid-provider quota rejection cannot be deterministic.
harnesses = [
    "codex",
    "codex:alternate",
    "claude-code:alternate",
    "claude-code:alternate2",
    "claude-code:primary",
]

# [harness.<id>]: per-harness overrides. Model names differ per provider, so
# each harness names its own.
# Astra is the GPT-6 tier; name it explicitly so the tier cannot drift under us.
# This side leads on Codex, so the model it names is the one that ordinarily does
# the work rather than a fallback. It needs a codex CLI at 0.153.0 or newer: an
# older one does not know this id, so the candidate refuses and the chain falls
# through to Claude with the intent silently unmet.
[harness.codex]
model = "gpt-6-astra"

# The second Codex identity. See scripts/codex-alt-home.sh for the indirection.
[harness.codex.variant.alternate]
model = "gpt-6-astra"
env_from = { CODEX_HOME = "ORCHESTRATOR_CODEX_ALT_HOME" }
unset_env = ["OPENAI_API_KEY"]

[harness.claude-code]
# IS_SANDBOX lets claude-code run under root without --dangerously-skip-permissions
# refusing; harmless on other harnesses.
env = { IS_SANDBOX = "1" }

# The Claude fallbacks are the same three identities every other role names, with the
# same portable indirections and credential masking. They stay on the working tier: a
# side that falls through to one of them is still the side writing the document.
[harness.claude-code.variant.alternate]
model = "claude-opus-5"
env_from = { CLAUDE_CONFIG_DIR = "ORCHESTRATOR_CLAUDE_ALT_CONFIG_DIR" }
# Subscription auth must not be shadowed by ambient API or OAuth credentials.
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

[harness.claude-code.variant.alternate2]
model = "claude-opus-5"
env_from = { CLAUDE_CONFIG_DIR = "ORCHESTRATOR_CLAUDE_ALT2_CONFIG_DIR" }
unset_env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

# The last resort: Claude's default config directory, with every higher-precedence
# credential selector and any inherited alternate directory masked off.
[harness.claude-code.variant.primary]
model = "claude-opus-5"
unset_env = [
    "CLAUDE_CONFIG_DIR",
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_TOKEN",
    "CLAUDE_CODE_OAUTH_REFRESH_TOKEN",
]

# Inspect the effective, fully layered config (and where each value came from)
# with `oneharness config`.
