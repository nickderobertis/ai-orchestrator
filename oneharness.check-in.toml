# The `check-in` pacemaker's harness config: WHICH harness + model writes the
# durable planner-update surface. Named by `graphs/dag-scope.yaml`'s `check-in`
# member, which oneagentgraph runs on a `{every: 1800, resettable: true}`
# schedule. See docs/onejudge-integration.md.
#
# This file exists only so the pacemaker keeps a finite deadline once the
# orchestrator's agent side stopped having one — see
# docs/onejudge-integration.md#choosing-a-deadline-per-side. It is
# `oneharness.orchestrator.toml`'s routing with one field changed: both extend
# `oneharness.identities.toml` and name the same chain, and only the `timeout`
# differs. tests/e2e/test_oneharness_timeout_e2e.py holds that to exactly one field.
extends = "oneharness.identities.toml"

# timeout: the per-turn deadline in seconds. Stated rather than inherited, because a
# deadline nobody wrote down is precisely what killed the orchestrator side. A
# pacemaker must stay bounded: its whole job is to fire, report, and exit, its period
# is 1800 seconds, and a turn that outlives its own period is wedged rather than
# working. A missed update costs one tick; an unbounded one costs every tick after it.
#
# Raised from the 120 this member resolved to for its first releases. This bound is a
# backstop against a wedged turn, not a budget for the work: reading every active
# workstream's durable evidence across several runs is a real amount of reading, and a
# pacemaker cut off mid-survey reports nothing at all, so the number is set well clear
# of the honest case and still far inside the period.
#
# It is NOT what keeps a dispatched worker alive. A round must never run inside this
# member's turn in the first place — which is what the member's own `task` in
# graphs/dag-scope.yaml secures. When a round did run here, this deadline killed the
# worker with it, and raising the number would only have moved when that happened.
timeout = 240

# `role` names the SIDE of the conversation, not the persona: like the orchestrator
# it drives, the pacemaker is an agent-side session. Keeping `role = "agent"` here
# is what lets telemetry and `just history` treat it as one.
# `role` is this host's key and the engine stamps nothing like it: the six
# `onepipeline.*` keys a dispatch inherits name the run, project, scope, node, step and
# attempt, none of which says which side of a conversation a session is.
history_labels = { role = "agent" }

# The pacemaker carries the orchestrator's order, not the worker's: both Codex
# identities first — deliberately the reverse of oneharness.toml's worker order —
# then the workers' alternate Claude subscriptions in the same relative order the
# worker uses, with the primary Claude identity last. This member runs beside the
# supervisory process it reports on, so it queues where that process queues rather
# than ahead of the workers it is reporting about.
# llmlint: ignore[changed_behavior_has_e2e] tests/e2e/test_oneharness_timeout_e2e.py proves this list against the real CLI's effective configuration; paid-provider quota rejection cannot be deterministic.
harnesses = [
    "codex:primary",
    "codex:alternate",
    "claude-code:alternate",
    "claude-code:alternate2",
    "claude-code:primary-backup",
    "claude-code:primary",
]

# The board credential is the plan store's and this role never reaches the store, so it
# stops here rather than travelling to the provider. Stated per role rather than in the
# shared parent because it is a per-role policy and a parent's mask is one no child can
# remove — `oneharness.identities.toml` says so at this same variant. The board
# *nomination* is left travelling on purpose: a live lane handed the owner, number and
# repository but no token skips and says why, where one handed nothing cannot tell a
# misconfigured lane from a deliberate one.
[harness.codex.variant.primary]
unset_env = ["GH_PROJECTS_TOKEN"]
