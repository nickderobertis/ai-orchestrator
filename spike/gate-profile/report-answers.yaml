  - |-
    **Gaps in uv, Nx or a pinned library.** The chosen fix needs none, because it removes writers from the shared toolchain rather than coordinating them. Writer-only targets would not need one either. Two observations, both reported here without a fill in this repository:
      - `uv` offers no shared/read lock on a project environment. `--no-sync` and `--frozen` still take an exclusive lock briefly, and both block while the environment lock is held. The fix does not need one: the lock is released before the child starts, so readers that keep `uv run` wait only on each other's millisecond checks (see the lock and fix findings).
      - Bun 1.3.14's no-change `bun install --frozen-lockfile` still rewrites `node_modules/.bin`. Concurrent runs over one tree fail `EEXIST`, as `workspace-install.sh` records.
  - |-
    **Observations that contradict the plan's assumptions.**
      - The premise that most xdist workers sit idle behind one `uv` lock does not hold as a lock: every exclusive lock `uv run` was recorded taking is held for milliseconds and released before the child starts (`.venv/.lock` by path in the plain traces, inferred for the variants). The idleness is the `shared-checkout-toolchain` xdist group serialising its 594 tests per tier. Dropping the group, with writers isolated, is the fix.
      - Narrow diffs are not cheap today. The script and persona edits rerun the critical `orchestrator-e2e:test`, and a narrow gate costs 84% of a wide one.
      - The gate's wall clock is bounded below by Nx's default `parallel` of 3: total phase-1 work / 3 ≈ 1183 s for a wide diff after the fix. So the draft 1200 s threshold is not reachable for a wide diff from the lock fix alone, and the projected figure is 1313.5 s.
      - The manager's unbootstrapped profile does not carry over. In a bootstrapped worktree the suite ran 6531 per-tier test results, 8241 s summed, with 594 tests and 3754 s in the group across tiers, and the only real failure was a timing flake. The 6118 / 5240 s / 592 / 2782 s figures are the manager's, from an unbootstrapped single-pytest run.
      - A single test failure in phase 1 doubles the cost of `orchestrator-e2e:test`: phase 2's `test-checkouts`/`coverage` re-run the uncached failed tier (`gate-wide-justfile-cold`: +1578.5 s).
      - `tests/e2e/test_gate_time_budget_e2e.py::test_a_host_variable_over_beside_a_strict_over_is_still_refused` is timing-sensitive at a 1 s budget.
      - `dispatches_max` reads `unknown` on this host in every sample (1 proven, 7 unprovable), so the `gate-time` budget's dispatch condition will read `unknown` too.
      - The traced tier run left two `onemessagebus serve surfaces --codec monitor` processes running (transport dirs under `/tmp/pytest-of-nick/pytest-888/popen-gw1/`) after every tier had finished. So some journey does not reap the monitor server it starts. Older such processes from other runs are on this host too. I left them running.
      - A narrow edit's rerun set after the split is set by the 11 modules that copy the whole checkout (1411.1 s) and the root drift gates. Narrowing what those copies copy is what would let `docs/` and `personas/` edits replay them.
      - The harness fetched `origin/main` into this run clone mid-dispatch, which moves the comparison base. A measurement node must pin its base, as `measure.sh pin-base` does.
      - The judged turn spent against the moved base (`judge-wide-justfile-wrong-base`) is why this spike spent 4 turns. With the manager's grant that uses the plan's one spare, so `gate-tuning-and-measure` keeps its cap of 4 and the plan has no spare left.
