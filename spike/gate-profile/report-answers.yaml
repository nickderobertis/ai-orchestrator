    **Lock mechanism.** In every recorded `uv run` trace, every exclusive lock is taken only while uv resolves and syncs, and released before uv `execve`s the child, so none is held for the child's lifetime. Only the two plain `uv run` traces record paths, and they establish that the second of the two exclusive locks is `<root>/.venv/.lock`. For the variants, the path is inferred, not recorded (below). The evidence is under `results/lock-experiments/`.
      - **`uv run` (plain), `--no-sync` / `UV_NO_SYNC=1`, `--frozen` / `UV_FROZEN=1` and `--locked`** all take exclusive locks after a shared lock on `~/.cache/uv/.lock`, hold each briefly when the environment is in sync, and release each before they `execve` the child. Eight of the nine recorded `uv run` acquisitions are held about 1-20 ms (1.2-20.0 ms). The ninth is the first, `/tmp/uv-<hash>.lock` acquisition in `strace-uvrun.txt`, held about 48 ms (19.230481 to 19.278809). The plain trace (`strace-uvrun2.txt`) records paths: a short exclusive lock on `/tmp/uv-<hash>.lock` (1.2 ms), then `flock(.venv/.lock, LOCK_EX)` (9.4 ms). The variant traces (`strace---*.txt`) record `flock` and `execve` but no paths. `--frozen` and `--locked` show the same two exclusive acquisitions as plain (the second held 4.9 ms and 19.4 ms). `--no-sync` shows only one (1.4 ms), and the trace does not say which file. That `--no-sync` waits on the environment lock comes from the matrix below, not from this trace. The cache lock stays shared for the child's lifetime, which blocks only `uv cache clean`/`prune`, never a reader.
      - **Blocking behaviour.** While the lock `matrix.sh` holds is held, every one of those readers blocks (5.4-5.5 s against a held lock, versus 0.03-0.10 s unheld, `matrix-envlock.txt`). `matrix.sh` holds whatever lock path it is given. Its comment says the path was found by strace, and the file is named for the environment lock, but neither the script nor its output records the path. That this blocking is on `.venv/.lock` is therefore inferred from those names and from the plain traces, not directly recorded. `--no-sync` and `--frozen` still lock.
      - **`.venv/bin/<tool>` directly** takes no lock (0.02 s held and unheld).
      - **Writers.** `uv sync --locked` (`scripts/python-install.sh`) takes two exclusive locks in the same pattern as plain `uv run`. The second is held about 10 ms when in sync and 2.1 s with `--reinstall` (`strace-sync_--locked*.txt`). These traces record no paths either, so that the second lock is `.venv/.lock` is inferred from the plain `uv run` traces. `scripts/session-setup.sh` syncs the root only when its version checks fail.
