spike: spike-gate-profile
branch: nick/gate-time-split-and-lock/spike-gate-profile
harness: |
  Everything is under `spike/gate-profile/` on the branch. Run every command from the root of a bootstrapped checkout of that branch (`just bootstrap`), with a clean tree. The command checks out the measured commit detached, commits one representative edit (or `--patch`) on top, and then returns to the branch.

  - `spike/gate-profile/measure.sh offline <edit>...` (**offline mode**). Lists the cached test targets whose Nx key covers each edited path, using `tests/nx_inputs.py`'s `target_input_globs`. It also lists the uncached targets that always run and the projects `nx affected` selects. It runs nothing.
  - `spike/gate-profile/measure.sh tier --commit <sha> --edit <edit> --cache cold|warm --label <label>` (**tier mode**). Runs `just check` exactly as the gate does: same `scripts/nx-selection.sh` narrowing, targets and phases. It writes `summary.json` with:
    - wall clock per phase;
    - per Nx task, its cache hit or miss, exit status and duration;
    - per pytest tier, per-test setup/call/teardown durations with each test's xdist group, collected by `plugin/gate_profile_plugin.py` through `PYTEST_ADDOPTS`;
    - host samples.
  - `spike/gate-profile/measure.sh gate --commit <sha> --edit <edit> --cache cold|warm --label <label>` (**gate mode**). Times `just gate <remote> <base>` end to end, split into `llmlint` validate, the judged lint diff (with its `lint-llm-diff: judged|replayed` line) and `just check`. It also records the Nx cache state the run started from, each Nx task's hit or miss, and the exit status (provenance only).
  - `spike/gate-profile/measure.sh judge ...` spends one judged lint turn on a tree, so later gate runs replay it.
  - `spike/gate-profile/measure.sh three --commit <sha> [--patch <file>] ...` runs `orchestrator-e2e:test`, `plan-tooling:test` and `orchestrator:test-docs` at once through `three.sh`.
  - `spike/gate-profile/measure.sh pin-base <sha>` creates a throwaway local remote `spikebase` whose `main` is `<sha>`. Run with `GATE_PROFILE_REMOTE=spikebase`, every mode then compares against it, `just check`'s affected selection included.

  The representative edits are named in `measure.sh` (`EDITS`): `narrow-script`, `narrow-persona`, `narrow-doc`, `wide-conftest` and `wide-justfile`. Each inserts one empty line.

  Every run uses its own Nx cache: `XDG_CACHE_HOME=$GATE_PROFILE_HOME/xdg`, default `~/.cache/gate-profile-spike/xdg`. Only `ai-orchestrator/nx` there is private; every other cache entry symlinks to the host's.
  - `cold` starts from an empty Nx cache, seeded with the judged verdicts in `~/.cache/gate-profile-spike/verdicts/`.
  - `warm` keeps whatever the previous run left.

  A run writes to `~/.cache/gate-profile-spike/runs/<label>/`. `archive-run.sh <label>` copies it onto the branch under `spike/gate-profile/results/runs/<label>/`.

  - `spike/gate-profile/measure.sh cmd --commit <sha> [--patch <file>] --cache warm --label <label> -- <command>...` profiles any command over a measured tree the same way. It exports `GATE_PROFILE_ISOLATION_LOG` and `GATE_PROFILE_RUN_OUT`, so a patched tree's isolation steps and the tier tracer write beside the run. The option-comparison runs it took:
    - option (i): `measure.sh cmd --commit 3b6a1ef7 --patch prototype-writer-only-target.patch --label writers-only-target-alone -- ./scripts/nx.sh run orchestrator:test-toolchain-writers`;
    - option (ii): `measure.sh cmd --commit 3b6a1ef7 --patch prototype-isolated-writer-toolchains-v2.patch --label writers-isolated-v2 -- env -u FORCE_COLOR NO_COLOR=1 uv run pytest <the 10 writer modules> --no-cov -n 4 --dist loadgroup`, followed by `analysis/isolation_summary.py <run> results/runs/gate-wide-conftest-cold`;
    - the tier trace: `measure.sh cmd --commit 3b6a1ef7 --label tier-traces-execve -- bash -c '"$GATE_PROFILE_HARNESS"/trace/tiers.sh'`, followed by `analysis/tier_reads.py <run>`. `trace/tiers.sh` runs `trace/run-tiers.sh` under `strace -f -s 256 -e trace=openat,execve,clone,clone3,fork,vfork,chdir`, streamed through `trace/filter.py`, which writes `execs.jsonl` and `reads.json`. Once every tier has reported, it ends its own `strace` and lists what was still traced.

  Other tools on the branch:
  - `trace/trace.sh <label> <nodeid>...` traces one pytest selection under `strace -f -e trace=openat,execve`. It writes `results/traces/<label>.json`: the tracked files read in the root or in any copy, and the slowest processes spawned.
  - The scripts under `analysis/` produce every derived table in `results/analysis/`:
    - `profile.py <run>` gives the per-tier profile and the 30 slowest modules;
    - `modules.py` gives module tables per tier;
    - `split_map.py` gives the split-map group seconds;
    - `project_wide.py` gives the after-projection;
    - `compare_options.py` gives the measured option comparison;
    - `isolation_summary.py` gives per-writer isolation overhead;
    - `tier_reads.py` gives the per-tier, per-group and per-module read sets of a tier trace (groups from `split_map_groups.py`).

  The re-measure the last node owes is two runs:
  - `GATE_PROFILE_REMOTE=spikebase spike/gate-profile/measure.sh gate --commit 3b6a1ef79ff3953763fcf644c496c5d6a9248e36 --edit wide-conftest --cache cold --label <l>`;
  - the same with `--edit narrow-script --cache warm`.

  Run `measure.sh pin-base 3b6a1ef7` once first. Each of those runs replays its before tree's verdict.

  The prototypes:
  - `prototype-isolated-writer-toolchains.patch` (v1) is also applied to the branch's own `tests/`, in commit `67db1222`;
  - `prototype-isolated-writer-toolchains-v2.patch` (v1 plus an isolated `session_setup` and per-step isolation timing) applies to `3b6a1ef7`;
  - `prototype-writer-only-target.patch` (option (i)'s `orchestrator:test-toolchain-writers`) applies to `3b6a1ef7`.
method: |
  **Base commit measured.** Every tree is `3b6a1ef79ff3953763fcf644c496c5d6a9248e36` plus one edit. The last node re-measures that same commit as its before.

  **Toolchain.** uv 0.11.32 (aarch64), Nx 23.1.0 (local), Bun 1.3.14, llmlint 0.4.7. The judge fingerprint is `scripts/llmlint-fingerprint.sh` output, sha256 prefix `f8415a2fd16a02f4`. The host has 14 cores and is shared with other dispatches. Nx runs at its default `parallel` of 3 (`nx.json` sets none), and each pytest runs with `-n 4 --dist loadgroup`.

  **Isolated Nx cache.** `/home/nick.guest/.cache/gate-profile-spike/xdg/ai-orchestrator/nx/756e79f93796751d`, whose key is this clone's origin URL. The judged verdicts are copied beside it in `/home/nick.guest/.cache/gate-profile-spike/verdicts/`, with a `README.txt` mapping each entry to its tree.

  **Representative edits.** Each inserts one empty line.

  | edit | path | used in |
  | --- | --- | --- |
  | `narrow-script` | `scripts/budget-dispatches.sh` | gate mode |
  | `narrow-persona` | `personas/researcher.yaml` | tier mode |
  | `narrow-doc` | `docs/budgets.md` | tier mode |
  | `wide-conftest` | `tests/conftest.py` | gate mode |
  | `wide-justfile` | `justfile` | gate mode |

  Offline mode covered all five (`results/offline-representative-edits.json`). The `justfile` covers 29 cached test targets and `tests/conftest.py` covers 33; the four extra are `session-setup:test`, `plan-store-assets:test`, `project-store-race:test` and `ask-seam-bus-resolution:test`. The two wide edits are therefore not equivalent, and the `justfile` edit was gate-measured too.

  **Runs.** Each lives in `results/runs/<label>/`. Host conditions come from `scripts/budget-dispatches.sh` and `/proc/loadavg`, sampled every 5 s.

  | run | load1_max | dispatches_max |
  | --- | --- | --- |
  | `gate-wide-conftest-cold` | 12.67 | `unknown` |
  | `gate-narrow-script-warm` | 15.73 | `unknown` |
  | `gate-wide-justfile-cold` | 11.89 | `unknown` |
  | `tier-narrow-doc-warm` | 13.86 | `unknown` |
  | `tier-narrow-persona-warm` | 19.05 | `unknown` |
  | `three-prototype` | 18.44 | `unknown` |
  | `writers-isolated-v2` | 8.14 | `unknown` |
  | `writers-only-target-alone` | 5.30 | `unknown` |
  | `tier-traces` (`openat` only) | 23.61 | `unknown` |
  | `tier-traces-execve` | 16.03 | `unknown` |
  | judged turns | 2.35-3.69 | `unknown` |

  `dispatches_max` is `unknown` in every sample, as the budget script itself reports it. It proved 1 dispatch and could not prove 7 others, which it counts toward neither answer.

  **Limits.**
  - **Warm cache provenance.** `warm` means the cache left by the previous run of a *different* tree, not by a run of the base.
    - For `gate-narrow-script-warm` this changes nothing that matters. Its 11 phase-1 tasks were exactly the targets offline mode says cover the edit (7 test targets), plus `orchestrator`'s lint/typecheck/format-check/budgets, which took 20.7 s together. Those would miss over a base-warmed cache too.
    - `tier-narrow-doc-warm` also reran `orchestrator-e2e:test`, `plan-tooling:test` and `orchestrator:test`, which a doc edit does not key. That is an artefact of the cache state, so its wall clock is not a narrow-doc figure. The narrow-doc figure is projected under findings.
  - **Moved comparison base.** At 21:14 local the harness fast-forwarded this clone's `origin/main` from `3b6a1ef7` to `80385987` by a fetch. That was mid-spike, so the runs split by start time:
    - **Before the fetch:** every gate and judge run except the `justfile` ones, which compared against `3b6a1ef7`.
    - **After the fetch, unpinned:** `tier-narrow-persona-warm` (started 21:15) selected projects `affected --base origin/main=80385987`. Its keys and misses are still the tree's own, but its selection may be wider than over `3b6a1ef7`.
    - **After the fetch, pinned:** the `justfile` runs use `spikebase/main=3b6a1ef7`.
  - **Load.** Each figure moves with host load (load1 peaks of 11.9-19.1 on 14 cores).
  - **Prototype run.** `three-prototype` ran the three tiers alone. In the gates they shared Nx's three slots with the other phase-1 tasks.
candidates:
  - budget: gate-time
    measure: "Complete pre-push gate wall clock, `just gate <remote> <base>` timed as `.githooks/pre-push` times it: `llmlint` validate, then the judged lint diff, then `just check`. Every figure comes from gate mode and is split into those three phases, with its cache provenance and host conditions."
    workload: "Base `3b6a1ef7` plus one edit, comparison base `3b6a1ef7`. Narrow: `narrow-script` over the Nx cache the wide-conftest run left. Wide: `wide-conftest` and `wide-justfile`, each over a cold Nx cache seeded only with judged verdicts. The judged lint was replayed in every gate run, as on a typical publishing push."
    achievable: "**Narrow diff (`narrow-script`), before: 1638.7 s (27.3 min).** Validate 0.3 s, judged lint 0.4 s (replayed; the verdict for this tree was judged once in 38.9 s), handoff 0.3 s, `just check` 1637.7 s. Cache: warm, 11 phase-1 tasks, all missed. The critical path is `orchestrator-e2e:test` at 1606.3 s, then 28.1 s of uncached phase 2, where coverage is 0.9 s. `load1_max` 15.73, `dispatches_max` unknown (1 proven). Exit 0.

    **Wide diff (`wide-conftest`), before: 1943.3 s (32.4 min).** Validate 0.2 s, judged lint 0.4 s (replayed; judged once in 26.1 s), handoff 0.4 s, `just check` 1942.3 s. Cache: cold, 36 phase-1 tasks, all missed. Phase 1 took 1863.0 s, with `orchestrator-e2e:test` at 1715.5 s. Phase 2 took 73.3 s, of which a re-run of `orchestrator:test` was 73.8 s. `load1_max` 12.67, `dispatches_max` unknown. Exit 1, on 7 harness-artefact failures: the profiling plugin was missing from nested pytest runs in `test_coverage_gate.py` (5) and `test_nx_cache_scope.py` (2), and the harness was fixed in commit `29c55df7`.

    **Wide diff (`wide-justfile`), before: 3482.0 s (58.0 min).** Validate 0.3 s, judged lint 0.4 s (replayed; judged once in 28.4 s against `spikebase/main=3b6a1ef7`), handoff 0.3 s, `just check` 3481.0 s. Cache: cold, all missed. Phase 1 took 1900.0 s, with `orchestrator-e2e:test` at 1760.0 s. Exit 1, because one test of that tier failed: `test_gate_time_budget_e2e::test_a_host_variable_over_beside_a_strict_over_is_still_refused`, whose measured time rounded to exactly its 1 s budget, which reads as within the budget rather than over it. With that tier uncached, phase 2 re-ran `orchestrator-e2e:test` in full (1578.5 s), so phase 2 took 1579.3 s. Without the failure the gate would have been about 1900.0 + 28.1 + 0.3 + 0.4 + 0.3 ≈ 1929 s, the same as the conftest edit. `load1_max` 11.89, `dispatches_max` unknown.

    **Wide diff after the plan: 1313.5 s projected (21.9 min), from 1943.3 s.** This projection is not a measurement. Its arithmetic is in `results/analysis/projection-wide-after.json`:
    - **Prototype tiers (measured, all misses).** With isolated writer toolchains and the group removed (prototype v1; v2's extra `session_setup` isolation is in none of these tiers), the three big tiers were measured in `three-prototype`: `orchestrator-e2e:test` 920.7 s, `plan-tooling:test` 912.9 s, `orchestrator:test-docs` 414.1 s.
    - **Phase 1 (projected).** The wide-conftest run's other 33 phase-1 tasks took 1301.6 s. Scheduling all of them on Nx's 3 slots, big tiers first, gives 1281.1 s; the work/3 lower bound is 3549.3 / 3 = 1183.1 s.
    - **Rest of the gate.** Uncached phase 2 adds 28.1 s (the narrow run's) and `check-nx-cache` 3.3 s, so the deterministic tier is 1312.5 s. The replayed `llmlint` phases add 1.0 s (0.2 + 0.4 + 0.4).
    - **Why it is conservative.** The 1301.6 s was measured with those tasks' journeys still serialised by the group: `writeback-budget:test` takes 295 s for 5 tests and `run-end-hooks:test` 148 s.
    - **Split map not included.** The projection does not count the split map, which does not shorten a wide diff that reruns everything; it lowers narrow diffs.
    - **Deterministic tier only.** The three prototype tiers' own critical path is 920.7 s, against 1715.5 s for the same three in the wide-conftest gate. That is a tier-mode figure, not a complete-gate figure."
    limits: "**What a complete gate costs today.** A complete gate is `llmlint` (~1 s replayed, 26-39 s when judged) plus `just check`. `just check` is phase 1 (Nx `affected`, 3 slots), then phase 2 (uncached `test-checkouts`, `coverage`, `budgets-host`; 26-30 s), then `check-nx-cache` (0-3.3 s).

    **Why narrow is close to wide.** Every narrow edit measured reruns `orchestrator-e2e:test` except the doc edit. Offline mode: the script edit covers 7 test targets and the persona 5, both including `orchestrator-e2e:test`, while the doc edit covers only the 2 `test-docs` targets. That tier is the gate's critical path, so before the plan a narrow gate is 84% of a wide one (1638.7 / 1943.3).

    **Narrow-doc, deterministic tier, projected.** About 832 s over a base-warmed cache. Its covering targets, measured in `tier-narrow-doc-warm`, are `orchestrator:test-docs` at 805.8 s and `plan-tooling:test-docs` at 222.8 s, in parallel, plus phase 2 at 26.6 s.

    **Narrow-persona, deterministic tier, measured.** 1784.3 s. Its critical path is `orchestrator-e2e:test` at 1751.4 s, which the persona edit genuinely keys. Its affected base had moved, as stated under method.

    **Lower bound after the fix.** For a wide diff, Nx `parallel` 3 sets the floor at total task seconds / 3 = 1183 s. Below that takes either more slots or less work per gate. The draft candidate threshold of 1200 s sits within 2% of that floor and under the 1313.5 s projection, so headroom for this host's load needs the tuning node's `parallel` and xdist changes or the split on top.

    **Projection uncertainty.** `three-prototype` summed 8632.9 s of test time for three tiers, against 5874.2 s for the same three before. Contention inflates per-test time: 3 × 4 workers on a 14-core host shared with other dispatches."
    consumed: "**Wall clock**, against the 2-3 hours the manager approved: spike wall clock from 19:15:06 local on 2026-10-09 (session branch cut) to the measuring dispatch's last commit at 04:13:13 on 2026-10-10 (`7fb640f9`), about 8 h 58 min. Of that, about 4 h 25 min went to the first report, about 2 h 50 min to the option-comparison runs and the first tier trace, and about 1 h 45 min to the `execve` tier trace and the liveness evidence. A later reconciling revision of the lock and fix findings (about 04:15-04:25) ran no suite, tier, trace or judged lint. **Judged lint turns: 4**, as the manager granted:
    - narrow-script, 38.9 s;
    - wide-conftest, 26.1 s;
    - wide-justfile, 28.5 s, spent against the moved `origin/main=80385987` and unusable at `3b6a1ef7`;
    - wide-justfile again against the pinned `3b6a1ef7`, 28.4 s.

    The 4th is the plan-wide spare: the plan's measurement total is now the cap of 8, `gate-tuning-and-measure` keeps its 4, and no spare is left.

    **Full-suite runs: 5 complete `just check` runs, plus two traced runs of the six affected tiers.** Three of the `just check` runs were inside gate mode (1943 s, 1639 s and 3482 s) and two were tier mode (1662 s and 1784 s). The two traced runs of those six tiers took 7841.5 s (`tier-traces`, `openat` only) and 6291.3 s (`tier-traces-execve`) under `strace`.

    **Partial runs:**
    - one tier run killed when its turn ended, about 10 min in;
    - one three-tier run, 921 s;
    - the writer modules under prototype v2, 494 s;
    - the writer-only target alone, 1202 s;
    - eight single-test strace traces, 23-316 s each;
    - lock experiments of seconds each.

    **No judged lint turn** was spent after the fourth."
findings:
  - |-
    **What was measured, what was inferred, and what is left open.** This is the account the finalize stage and the split nodes should start from.
      - **Measured** (each a recorded run under `results/`):
        - complete gate, narrow (`narrow-script`) and wide (`wide-conftest`, `wide-justfile`), with phases, cache provenance and host conditions;
        - the deterministic tier for `narrow-persona` and for `narrow-doc` (whose cache state makes it no narrow-doc figure);
        - offline coverage of all five edits;
        - the `uv` and Bun lock experiments;
        - the three big tiers together under prototype v1;
        - the 10 writer modules under prototype v2, with per-step isolation cost;
        - option (i)'s writer-only target alone (1201.9 s);
        - two traced runs of the six affected tiers (`openat`; then `openat` and `execve`), with reads and execs attributed per test.
      - **Inferred, by arithmetic over those runs:**
        - the wide gate after the fix, 1313.5 s;
        - option (i)'s wide-gate floor, 1912.3 s;
        - the narrow-doc deterministic tier, about 832 s;
        - each proposed group's test seconds, which are its modules' seconds in the grouped, serialised `gate-wide-conftest-cold` run, so they overstate wall clock once the group is gone;
        - which edits rerun which group, read off the traced read sets.
      - **Left open, for the split nodes to establish in their own dispatch.** After the manager's note asking the spike to converge, I ran no further suite or trace:
        1. **Imported modules.** The traces see a Python import only when its source is read rather than its `__pycache__`, so no group's import graph is established by tracing. Take it from `tests/nx_inputs.py` and the `tests/conftest.py` read guards, as the existing keys do.
        2. **Tiers never traced.** `orchestrator:test`, `orchestrator:test-recipes`, `orchestrator:test-checkouts`, `unfinished:test` and `unfinished:test-host`, and the small per-journey projects: `ask-seam-*`, `writeback-budget`, `run-end-hooks`, `unwatched`, `unpublished-view`, `board-copy-approval`, `dag-ui`, `session-setup`, `host-*`, `graceful-cancel`, `merge-policy`, `manager-allowlist`, `session-open-conflict`, `render-diagram`, `plan-store-*`, `project-store-race`. Their reads rest on their current Nx inputs and read guards, unverified by this spike. Any node that moves one of them traces its own tier command first.
        3. **A conditional read in `plan-tooling/check-and-review`.** It read `scripts/budget-dispatches.sh` in one trace and not in the other, so what triggers the read is unknown. Its key should cover the script until a node shows why.
        4. **The 11 whole-checkout copying modules** read the whole tree by construction. Their group can only narrow if what `copy_working_tree` copies narrows, and nothing here measured that.
        5. **Prototype v2 over the whole suite.** Only its writer modules ran. The after-figure is a projection, and the tuning node's measurement is what replaces it.
        6. **Failure causes not established:**
           - the v1 liveness `member-died` (stderr cut short by oneharness);
           - under tracing, the liveness `cron-reset` miss and two `workspace_contract` installer tests.
           Whether any of them involves a reader meeting a toolchain mid-rewrite is not established.
        7. **No narrow-doc complete gate** was measured, because a base-warmed cache was never built.
