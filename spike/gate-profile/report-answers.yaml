  - |-
    **Lock mechanism.** Every `uv run` variant takes the exclusive `<root>/.venv/.lock` only while it resolves and syncs, never for the child's lifetime. The evidence is under `results/lock-experiments/`.
      - **`uv run` (plain), `--no-sync` / `UV_NO_SYNC=1`, `--frozen` / `UV_FROZEN=1` and `--locked`** all take the same lock: `flock(.venv/.lock, LOCK_EX)` after a shared lock on `~/.cache/uv/.lock`. They hold it 2-20 ms when the environment is in sync, then `execve` the child after releasing it. The cache lock stays shared for the child's lifetime, which blocks only `uv cache clean`/`prune`, never a reader.
      - **Blocking behaviour.** While the `.venv` lock is held, every one of those readers blocks (5.4-5.5 s against a held lock, versus 0.03-0.10 s unheld, `matrix-envlock.txt`). `--no-sync` and `--frozen` still lock.
      - **`.venv/bin/<tool>` directly** takes no lock (0.02 s held and unheld).
      - **Writers.** `uv sync --locked` (`scripts/python-install.sh`) holds the lock about 10 ms when in sync and 2.2 s with `--reinstall` (`strace-sync_--locked*.txt`). `scripts/session-setup.sh` syncs the root only when its version checks fail.
      - **Bun.** `scripts/workspace-install.sh` holds a `flock -x` on the tree's lock around `bun install --frozen-lockfile` for that install's duration: milliseconds when in sync (`strace-wsi.txt`). A no-change `bun install` still unlinks and re-links every package `bin` (`strace-bunbin.txt`), so it rewrites `node_modules/.bin` and is a writer even when in sync.
      - **Nx heal.** `scripts/nx.sh` runs both installs before every Nx invocation.
      - **What actually serialises the gate.** No reader waits on uv's lock for longer than a sync. The idle workers come from the `shared-checkout-toolchain` xdist group itself: `--dist loadgroup` puts its 594 tests (3754 s in the wide run) on one worker per tier.
      - **Readers are unprotected.** A reader running through `.venv/bin` or an already-started `uv run` child is not protected from a concurrent writer by any lock.
  - |-
    **Writers and readers of `SHARED_TOOLCHAIN_GROUP`** (`results/item4-shared-toolchain-group-static-read.md`, a static read at `3b6a1ef7`). 46 modules carry the group: 10 writers and 36 readers.
      - **Writers of the root `node_modules`** run `scripts/nx.sh` or `just`, and so `workspace-install.sh`'s `bun install`, through a copy whose `node_modules` symlinks to the root's:
        - `test_nx_cache_scope_e2e`, `test_llmlint_cache_e2e`, `test_llmlint_two_path_verdict_e2e`, `test_budget_target_e2e`, `test_budget_telemetry_e2e`;
        - `test_workspace_contract_e2e`, 3 of its 4 grouped tests, through `_provisioning_copy` then `./scripts/nx.sh`.
      - **Writers of both the root `.venv` and `node_modules`:** `test_nx_wrapper_version_e2e` (`./scripts/nx.sh --version` at the root) and `test_project_boundaries` (`./scripts/nx.sh graph` at the root), through `python-install.sh`'s `uv sync --locked`.
      - **Conditional writer of the root `.venv`:** `session_setup/test_locked_plan_store_setup_e2e`, through `scripts/session-setup.sh`, only when its checks fail. Its first test also runs `uv tool install --upgrade llmlint-cli` under the real HOME.
      - **Fixture-only writer:** `dag_ui/test_dag_ui_serving_e2e`, through `workspace_install`.
      - **Does `workspace_install` rewrite a provisioned toolchain? Yes.** It runs `workspace-install.sh` once per xdist worker, unconditionally, and Bun re-links every `bin`, so every module requesting it (51 tests) is a writer.
      - **Readers.** The 36 readers include `test_publish_branch_e2e`, the plan-tooling follow-ups modules, `run_end_hooks`, `writeback_budget`, `unfinished`, `unwatched` and the `ask_seam` launches; the file lists them all. They only run recipes through `uv run` or `.venv/bin`.
      - **Detection gap.** `_reprovisioning_tests` detects only 1 of these writers, the inline `session-setup.sh` call. It sees none of the `nx.sh` or Bun writers.
  - |-
    **Fix chosen: (ii) isolated writer toolchains.**
      - **What the prototype changes** (`prototype-isolated-writer-toolchains.patch`, applied in `67db1222`):
        - a copy gets a private, hardlinked `node_modules` rather than a symlink to the root's;
        - `test_nx_wrapper_version_e2e` and `test_project_boundaries` run `scripts/nx.sh` in a copy;
        - `workspace_install` provisions only what is absent;
        - a collection hook strips the group.
      - **Why it protects readers.**
        - **Within one pytest process:** no writer touches the root toolchain any more, so a reader on another worker never meets a toolchain mid-rewrite.
        - **Across concurrent Nx tiers:** the same holds, because no test writes the root `.venv` or `node_modules` while tiers run. The one root write left in a gate is `scripts/nx.sh`'s heal. It relinks `node_modules/.bin` under the Bun lock, and `uv sync` takes milliseconds when in sync. `just check` runs that heal once per phase, before the phase's tasks start, never while tests run.
        - **Residual the real fix must also close:** `session_setup/test_locked_plan_store_setup_e2e` still runs the root's `scripts/session-setup.sh`. That script runs `uv sync` on the root `.venv` only when its version checks fail, so it does nothing on a provisioned checkout. The prototype did not isolate it; the fix should run it in a copy with its own `.venv`.
      - **Why not (i).** Writer-only targets with `parallelism: false` would put every writer journey on the critical path with nothing beside it. The grouped tests of the profiled writer modules sum 1276.3 s over 97 tests in the wide run: `nx_cache_scope_e2e` 624.4, `budget_target` 301.6, `budget_telemetry` 287.3, `llmlint_cache` 42.4, `llmlint_two_path` 11.4, `workspace_contract` 5.8, `dag_ui` 2.9, and under 1 s for the other two. `session-setup:test` (18.0 s as an Nx task) was not profiled. Writers all rewrite the one root `node_modules`, so they also exclude one another; about 1276 s would sit serially with nothing beside it. That exceeds the whole projected deterministic tier.
      - **Cost of isolation per writer.** A hardlinked `node_modules` per copy (no extra disk for package files) and a Bun relink per copy. `test_nx_cache_scope_e2e`'s heaviest test ran in 186.7 s traced under the prototype, against 149.2 s before.
