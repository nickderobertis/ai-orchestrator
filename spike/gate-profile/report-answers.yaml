      - **What actually serialises the gate.** No reader waits on uv's lock for longer than a sync. The idle workers come from the `shared-checkout-toolchain` xdist group itself: `--dist loadgroup` puts its 594 tests (3754 s in the wide run) on one worker per tier.
      - **Readers are unprotected by any lock, and do not need one.** A reader running through `.venv/bin`, or the child of a `uv run` that has already started, holds no lock, so no lock protects it from a concurrent writer. A reader's protection therefore cannot come from a lock. It has to come from no writer rewriting the root toolchain while readers run, which is what the chosen fix provides (below).
      - **Why readers that still go through `uv run` need no lock-free mechanism.** Readers do still take exclusive locks, but only briefly. In every recorded `uv run` trace, every exclusive acquisition is released before the child's `execve`: eight of the nine after about 1-20 ms, and the `/tmp/uv-<hash>.lock` acquisition in `strace-uvrun.txt` after about 48 ms, so before the reader's own work starts. Where the trace records paths, the environment lock is `.venv/.lock` (plain `strace-uvrun2.txt`: `.venv/.lock` taken 23.662246, released 23.671672, child `execve` 23.675110; `strace-uvrun.txt`: taken 19.278978, released 19.299024). For the variants, which record no paths, the environment-lock attribution is inferred ( `--frozen` and `--locked` show the same two-lock order in `strace---*.txt`, and `--no-sync`'s single exclusive acquisition is also released before its `execve`). Unheld, each variant returns in 0.03-0.10 s (`matrix-envlock.txt`). So under the fix, readers contend for that lock only with each other, for milliseconds per `uv run` start. The 5.4-5.5 s blocking measured in the matrix happens only while something holds the lock, and under the fix no test does. A shared/read lock from `uv`, which does not exist, would save those milliseconds and nothing else. It is not needed, so its absence is not a gap the fix depends on.
