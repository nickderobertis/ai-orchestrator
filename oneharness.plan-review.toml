# The plan reviewer's harness config: WHICH harness + model reads one plan task
# against `personas/planner.yaml`'s bar before that task may be dispatched. Named by
# `orchestrator/plan_review.py`, which `just review-plan` runs. See AGENTS.md.
#
# It extends `oneharness.identities.toml` rather than `oneharness.dispatch.toml`: this
# turn is a command of this repository rather than a node's dispatch, so there is no
# node scratch directory for the runtime-directory repoint to point at.
#
# `schema_file`, `schema_max_retries`, `stream` and the deadline below are this side's
# alone, and this one's schema is the verdict contract a review record is written from.
# `schema_file` is a path this file has to state itself: the released core resolves
# only `extends` against the declaring file's directory, and the graph layer reads
# `schema_file` and `stream` off the child document alone.
extends = "oneharness.identities.toml"

# timeout: the per-turn deadline in seconds. Stated rather than inherited, because a
# reviewer is a scheduled, bounded job and not a watcher: it reads one task, answers
# with one verdict, and exits. It sits between an operator and a launch, so a turn with
# no deadline would hold a plan unlaunchable indefinitely.
#
# What a missed deadline costs is bounded and safe: a review that does not answer
# records nothing, so the task stays refused and the operator runs it again. The
# failure direction is always "not reviewed", never "reviewed and passed".
timeout = 300

# schema_file: the structured answer every turn is validated against, and what makes
# this a contract rather than a prompt. Relative to THIS file's directory. It is also
# hashed into every review key, so editing it invalidates every record made under the
# previous version.
schema_file = "config/plan-review-verdict.schema.json"

# schema_max_retries: how many times oneharness re-prompts a turn whose answer does not
# validate. Two, for the reason the drafter states: the failure this absorbs is a model
# wrapping its verdict in prose rather than a model that cannot judge the task.
schema_max_retries = 2

# stream = false, and it is not a preference. oneharness validates a structured answer
# against the COMPLETE response, so `stream = true` and `schema_file` cannot both hold.
stream = false

# `role` names the SIDE of the conversation: the reviewer is a single-sided agent turn.
# `role` is this host's key and the engine stamps nothing like it: the six
# `onepipeline.*` keys a dispatch inherits name the run, project, scope, node, step and
# attempt, none of which says which side of a conversation a session is.
history_labels = { role = "agent" }

# The reviewer carries the supervisory order, not the worker's: both Codex identities
# first — deliberately the reverse of oneharness.toml's worker order — then the workers'
# alternate Claude subscriptions in the same relative order the worker uses, with the
# primary Claude identity last. This turn runs before any worker is dispatched, so it
# must not queue ahead of the workers already doing their own.
# llmlint: ignore[changed_behavior_has_e2e] tests/e2e/test_oneharness_timeout_e2e.py proves this list against the real CLI's effective configuration; paid-provider quota rejection cannot be deterministic.
harnesses = [
    "codex:primary",
    "codex:alternate",
    "claude-code:alternate",
    "claude-code:alternate2",
    "claude-code:primary-backup",
    "claude-code:primary",
]

# Astra is the GPT-6 tier; name it explicitly so the tier cannot drift under us. This
# side leads on Codex, so the model it names is the one that ordinarily does the work
# rather than a fallback. It needs a codex CLI at 0.153.0 or newer: an older one does
# not know this id, so the candidate refuses and the chain falls through to Claude with
# the intent silently unmet.
[harness.codex]
model = "gpt-6-astra"

# Restates `unset_env` because it names `model`: the mask is inherited correctly, but
# `oneharness config` reports an inherited one as `[]` once the child mentions the
# variant, and these lines keep that report true. `oneharness.dispatch.toml` says why.
# The variant `model` is named rather than left to `[harness.codex]`, because that is
# where `oneharness config` reports a variant's tier from.
[harness.codex.variant.primary]
model = "gpt-6-astra"
unset_env = ["GH_PROJECTS_TOKEN"]

[harness.codex.variant.alternate]
model = "gpt-6-astra"
unset_env = ["OPENAI_API_KEY", "GH_PROJECTS_TOKEN"]
